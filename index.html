<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎵 Sedatur Music Hub</title>

<meta name="theme-color" content="#0f172a">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:
linear-gradient(180deg,#0f172a,#020617);

color:#fff;

overflow-x:hidden;

min-height:100vh;

}



/* HEADER */

header{

position:sticky;

top:0;

z-index:999;

padding:18px;

background:rgba(15,23,42,.88);

backdrop-filter:blur(12px);

display:flex;

justify-content:space-between;

align-items:center;

border-bottom:1px solid rgba(255,255,255,.08);

}



.logo{

font-size:22px;

font-weight:bold;

}



.clock{

text-align:right;

}



#clock{

font-size:23px;

font-weight:bold;

}



#date{

font-size:12px;

color:#cbd5e1;

margin-top:2px;

}



/* RUNNING TEXT */

.marquee{

margin:15px;

background:#1e293b;

border-radius:12px;

padding:10px;

overflow:hidden;

white-space:nowrap;

}



.marquee span{

display:inline-block;

padding-left:100%;

animation:marquee 15s linear infinite;

font-weight:bold;

}



@keyframes marquee{

0%{

transform:translateX(0);

}

100%{

transform:translateX(-100%);

}

}



/* CONTAINER */

.container{

max-width:900px;

margin:auto;

padding:20px;

}



/* PLAYER */

.player{

background:#1e293b;

border-radius:25px;

padding:25px;

box-shadow:0 20px 40px rgba(0,0,0,.35);

text-align:center;

}



/* VINYL */

.vinyl{

position:relative;

width:260px;

height:260px;

margin:auto;

}



.disc{

width:260px;

height:260px;

border-radius:50%;

background:
radial-gradient(circle,
#333 0 18%,
#111 19% 22%,
#000 23% 100%);

display:flex;

justify-content:center;

align-items:center;

box-shadow:
0 10px 30px rgba(0,0,0,.45);

}



.disc.playing{

animation:spin 8s linear infinite;

}



.disc img{

width:95px;

height:95px;

border-radius:50%;

background:white;

padding:8px;

object-fit:cover;

}



@keyframes spin{

from{

transform:rotate(0deg);

}

to{

transform:rotate(360deg);

}

}



/* INFO */

.song-title{

font-size:28px;

font-weight:bold;

margin-top:25px;

}



.song-artist{

color:#94a3b8;

margin-top:8px;

}



.status{

margin-top:12px;

font-size:14px;

color:#22c55e;

font-weight:bold;

}



/* SEEK */

.progress{

margin-top:25px;

}



.progress input{

width:100%;

}



.time{

display:flex;

justify-content:space-between;

margin-top:5px;

font-size:13px;

color:#cbd5e1;

}



/* CONTROL */

.controls{

display:flex;

justify-content:center;

gap:14px;

margin-top:25px;

flex-wrap:wrap;

}



.controls button{

width:50px;

height:50px;

border:none;

border-radius:50%;

background:#334155;

color:white;

font-size:20px;

cursor:pointer;

transition:.2s;

}



.controls button:hover{

background:#2563eb;

}



.play{

width:65px!important;

height:65px!important;

background:#22c55e!important;

font-size:26px!important;

}



/* PART 1B */
/* VOLUME */

.volume{

display:flex;

align-items:center;

gap:10px;

margin-top:20px;

}

.volume input{

flex:1;

}



/* FILTER ARTIS */

.filter{

margin-top:25px;

}

.filter select{

width:100%;

padding:14px;

border:none;

border-radius:14px;

background:#334155;

color:#fff;

font-size:15px;

outline:none;

}



/* PLAYLIST */

.playlist{

margin-top:25px;

background:#0f172a;

border-radius:20px;

padding:12px;

max-height:420px;

overflow-y:auto;

}

.song-item{

display:flex;

align-items:center;

gap:15px;

padding:12px;

border-radius:15px;

cursor:pointer;

transition:.2s;

}

.song-item:hover{

background:#1e293b;

}

.song-item.active{

background:#2563eb;

}

.song-item img{

width:55px;

height:55px;

border-radius:50%;

background:#fff;

padding:4px;

object-fit:cover;

}

.song-info{

flex:1;

text-align:left;

}

.song-name{

font-weight:bold;

font-size:15px;

}

.song-by{

font-size:13px;

color:#cbd5e1;

}



/* MOBILE */

@media(max-width:600px){

.vinyl{

width:210px;
// =========================
// ELEMENT
// =========================

const audio = document.getElementById("audio");

const cover = document.getElementById("cover");
const disc = document.getElementById("disc");

const title = document.getElementById("title");
const artist = document.getElementById("artist");
const status = document.getElementById("status");

const playlistBox = document.getElementById("playlist");

const playBtn = document.getElementById("play");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");

const shuffleBtn = document.getElementById("shuffle");
const repeatBtn = document.getElementById("repeat");

const seek = document.getElementById("seek");
const volume = document.getElementById("volume");

const current = document.getElementById("current");
const duration = document.getElementById("duration");

const runningText =
document.getElementById("runningText");

const categoryFilter =
document.getElementById("categoryFilter");

const clock =
document.getElementById("clock");

const dateText =
document.getElementById("date");



// =========================
// DATA
// =========================

let songs=[];

let currentIndex=0;

let isShuffle=false;

let isRepeat=false;



// =========================
// LOAD PLAYLIST
// =========================

fetch("playlist.json")

.then(res=>res.json())

.then(data=>{

songs=data;

loadCategory();

renderPlaylist();

restoreData();

});



// =========================
// KATEGORI ARTIS
// =========================

function loadCategory(){

const list=[
...new Set(
songs.map(s=>s.category)
)
];


list.forEach(cat=>{

const option=
document.createElement("option");

option.value=cat;

option.textContent="🎤 "+cat;

categoryFilter.appendChild(option);

});

}



categoryFilter.onchange=()=>{

renderPlaylist();

};



// =========================
// PLAYLIST
// =========================

function renderPlaylist(){

playlistBox.innerHTML="";

const filter=
categoryFilter.value;


songs.forEach((song,index)=>{


if(
filter!="all" &&
song.category!=filter
){

return;

}


const item=
document.createElement("div");


item.className="song-item";


item.innerHTML=`

<img src="${song.cover}">

<div class="song-info">

<div class="song-name">

${song.title}

</div>

<div class="song-by">

${song.artist}

</div>

</div>

`;


item.onclick=()=>{

currentIndex=index;

loadSong(index);

playSong();

};


playlistBox.appendChild(item);

});


updateActive();

}



// =========================
// LOAD SONG
// =========================

function loadSong(index){

const song=songs[index];

if(!song)return;


cover.src=song.cover;

audio.src=song.file;

title.textContent=song.title;

artist.textContent=song.artist;


runningText.innerHTML=

"🎵 Sedang Diputar • "

+song.title+

" • "

+song.artist+

" • Selamat Mendengarkan 🎧";


saveData();

updateActive();

updateMedia();

}



// =========================
// ACTIVE PLAYLIST
// =========================

function updateActive(){

document

.querySelectorAll(".song-item")

.forEach(e=>{

e.classList.remove("active");

});


const items=

document.querySelectorAll(".song-item");


if(items[currentIndex]){

items[currentIndex]

.classList.add("active");

}

}



// =========================
// JAM REALTIME
// =========================

function updateClock(){

const now=new Date();


clock.textContent=

now.toLocaleTimeString("id-ID");


dateText.textContent=

now.toLocaleDateString(

"id-ID",

{

weekday:"long",

day:"numeric",

month:"long",

year:"numeric"

}

);


}


updateClock();

setInterval(updateClock,1000);
<script>

// =========================
// PLAY
// =========================

function playSong(){

audio.play();

playBtn.textContent="⏸";

status.textContent="🟢 Sedang Diputar";

disc.classList.add("playing");

}

function pauseSong(){

audio.pause();

playBtn.textContent="▶";

status.textContent="⏸ Dijeda";

disc.classList.remove("playing");

}

playBtn.onclick=()=>{

if(audio.paused){

playSong();

}else{

pauseSong();

}

};



// =========================
// NEXT
// =========================

nextBtn.onclick=()=>{

if(isShuffle){

currentIndex=
Math.floor(Math.random()*songs.length);

}else{

currentIndex++;

if(currentIndex>=songs.length){

currentIndex=0;

}

}

loadSong(currentIndex);

playSong();

};



// =========================
// PREVIOUS
// =========================

prevBtn.onclick=()=>{

currentIndex--;

if(currentIndex<0){

currentIndex=songs.length-1;

}

loadSong(currentIndex);

playSong();

};



// =========================
// SHUFFLE
// =========================

shuffleBtn.onclick=()=>{

isShuffle=!isShuffle;

shuffleBtn.style.background=

isShuffle
?"#22c55e"
:"#334155";

saveData();

};



// =========================
// REPEAT
// =========================

repeatBtn.onclick=()=>{

isRepeat=!isRepeat;

repeatBtn.style.background=

isRepeat
?"#22c55e"
:"#334155";

saveData();

};



// =========================
// AUTO NEXT
// =========================

audio.onended=()=>{

if(isRepeat){

audio.currentTime=0;

playSong();

}else{

nextBtn.click();

}

};



// =========================
// SEEK BAR
// =========================

audio.addEventListener("loadedmetadata",()=>{

seek.max=audio.duration;

duration.textContent=

formatTime(audio.duration);

});



audio.addEventListener("timeupdate",()=>{

seek.value=audio.currentTime;

current.textContent=

formatTime(audio.currentTime);

savePosition();

});



seek.oninput=()=>{

audio.currentTime=seek.value;

};



// =========================
// VOLUME
// =========================

volume.oninput=()=>{

audio.volume=volume.value;

localStorage.setItem(

"sedatur_volume",

volume.value

);

};



// =========================
// FORMAT TIME
// =========================

function formatTime(sec){

if(isNaN(sec))

return "00:00";

const m=Math.floor(sec/60);

const s=Math.floor(sec%60);

return String(m).padStart(2,"0")

+":"

+String(s).padStart(2,"0");

}
// =========================
// LOCAL STORAGE
// =========================

function saveData(){

localStorage.setItem(
"sedatur_song",
currentIndex
);

localStorage.setItem(
"sedatur_shuffle",
isShuffle
);

localStorage.setItem(
"sedatur_repeat",
isRepeat
);

}

function savePosition(){

localStorage.setItem(
"sedatur_position",
audio.currentTime
);

}

function restoreData(){

const song=
localStorage.getItem("sedatur_song");

const pos=
localStorage.getItem("sedatur_position");

const vol=
localStorage.getItem("sedatur_volume");

const sh=
localStorage.getItem("sedatur_shuffle");

const rep=
localStorage.getItem("sedatur_repeat");

if(song){

currentIndex=parseInt(song);

}

if(vol){

audio.volume=parseFloat(vol);

volume.value=vol;

}

if(sh==="true"){

isShuffle=true;

shuffleBtn.style.background="#22c55e";

}

if(rep==="true"){

isRepeat=true;

repeatBtn.style.background="#22c55e";

}

loadSong(currentIndex);

audio.addEventListener("loadedmetadata",()=>{

if(pos){

audio.currentTime=parseFloat(pos);

}

},{once:true});

}



// =========================
// MEDIA SESSION
// =========================

function updateMedia(){

if(!("mediaSession" in navigator))
return;

navigator.mediaSession.metadata=
new MediaMetadata({

title:title.textContent,

artist:artist.textContent,

album:"Sedatur Music Hub",

artwork:[

{

src:cover.src,

sizes:"512x512",

type:"image/png"

}

]

});

navigator.mediaSession.setActionHandler(
"play",
()=>playSong()
);

navigator.mediaSession.setActionHandler(
"pause",
()=>pauseSong()
);

navigator.mediaSession.setActionHandler(
"nexttrack",
()=>nextBtn.click()
);

navigator.mediaSession.setActionHandler(
"previoustrack",
()=>prevBtn.click()
);

}



// =========================
// START
// =========================

audio.volume=1;

</script>

</body>
  </html>
