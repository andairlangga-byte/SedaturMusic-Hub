<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sedatur Music Hub</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.player{
width:340px;
background:#1e293b;
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.player img{
width:180px;
height:180px;
border-radius:15px;
object-fit:cover;
margin-bottom:15px;
}

h2{
font-size:22px;
margin-bottom:5px;
}

p{
color:#94a3b8;
margin-bottom:20px;
}

button{
padding:12px 20px;
margin:5px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:18px;
}

#play{
background:#22c55e;
color:white;
}

#prev,#next{
background:#334155;
color:white;
}

.home{
position:fixed;
top:15px;
left:15px;
background:#2563eb;
color:white;
text-decoration:none;
padding:10px 15px;
border-radius:12px;
font-weight:bold;
}

.home:hover{
opacity:.9;
}
</style>

</head>
<body>

<a class="home"
href="https://sedatur.my.id"
target="_blank"
rel="noopener">
🏠 Home
</a>

<div class="player">

<img id="cover" src="logo.png">

<h2 id="title">Sedatur Music Hub</h2>

<p id="artist">Loading...</p>

<audio id="audio"></audio>

<div>

<button id="prev">⏮</button>

<button id="play">▶</button>

<button id="next">⏭</button>

</div>

</div>

<script>

let playlist=[];
let index=0;

const audio=document.getElementById("audio");

fetch("playlist.json")
.then(r=>r.json())
.then(data=>{
playlist=data;
loadSong(0);
});

function loadSong(i){

index=i;

document.getElementById("title").textContent=playlist[i].title;

document.getElementById("artist").textContent=playlist[i].artist;

document.getElementById("cover").src=playlist[i].cover;

audio.src=playlist[i].file;

}

play.onclick=()=>{

if(audio.paused){

audio.play();

play.innerHTML="⏸";

}else{

audio.pause();

play.innerHTML="▶";

}

}

next.onclick=()=>{

index++;

if(index>=playlist.length) index=0;

loadSong(index);

audio.play();

play.innerHTML="⏸";

}

prev.onclick=()=>{

index--;

if(index<0) index=playlist.length-1;

loadSong(index);

audio.play();

play.innerHTML="⏸";

}

audio.onended=()=>next.click();

</script>

</body>
</html>
