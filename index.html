<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sedatur Music Hub</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#7c3aed">


<style>

*{
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}


body{

margin:0;
padding-bottom:100px;

background:
radial-gradient(circle at top,#7c3aed55,transparent 40%),
#020617;

color:white;

}



/* HEADER */

header{

text-align:center;

padding:30px 20px;

}


.logo{

width:110px;
height:110px;

border-radius:50%;

object-fit:cover;

box-shadow:0 0 40px #7c3aed;

}



header h1{

margin:15px 0 5px;

font-size:30px;

}


header p{

color:#94a3b8;

}



/* CONTAINER */

.container{

max-width:700px;

margin:auto;

padding:20px;

}



/* MAIN PLAYER */

.player{

background:#ffffff10;

backdrop-filter:blur(20px);

border:1px solid #ffffff20;

border-radius:30px;

padding:25px;

text-align:center;

}



.cover{

width:260px;

height:260px;

border-radius:25px;

object-fit:cover;

box-shadow:0 20px 50px #000;

}



#title{

font-size:24px;

margin:20px 0 5px;

}



#artist{

color:#94a3b8;

}



audio{

width:100%;

margin-top:20px;

}



/* SEARCH */

.search{

margin-top:25px;

}



.search input{

width:100%;

padding:15px 20px;

border-radius:30px;

border:none;

outline:none;

font-size:16px;

}



/* PLAYLIST */

.playlist{

margin-top:20px;

}



.song{

display:flex;

align-items:center;

gap:15px;

background:#ffffff10;

padding:15px;

border-radius:20px;

margin-bottom:12px;

cursor:pointer;

transition:.3s;

}



.song:hover{

background:#7c3aed55;

transform:translateX(5px);

}



.song img{

width:65px;

height:65px;

border-radius:15px;

object-fit:cover;

}



.song-info{

flex:1;

}



.song-title{

font-weight:bold;

font-size:17px;

}



.song-artist{

color:#94a3b8;

font-size:14px;

}




/* MINI PLAYER */

.mini-player{

position:fixed;

left:15px;

right:15px;

bottom:15px;

background:#111827ee;

backdrop-filter:blur(20px);

border-radius:25px;

padding:12px;

display:flex;

align-items:center;

gap:10px;

box-shadow:0 10px 30px #000;

z-index:99;

}



.mini-player button{

width:45px;

height:45px;

border:none;

border-radius:50%;

background:#7c3aed;

color:white;

font-size:18px;

}



.mini-info{

flex:1;

overflow:hidden;

}



#miniTitle{

font-weight:bold;

}



#miniArtist{

color:#94a3b8;

font-size:13px;

}



footer{

text-align:center;

padding:30px;

color:#64748b;

}


</style>

</head>



<body>



<header>

<img src="logo.png" class="logo">

<h1>🎧 Sedatur Music Hub</h1>

<p>Music Center Sedatur Rawamangun</p>

</header>




<div class="container">



<div class="player">


<img src="logo.png" id="cover" class="cover">


<h2 id="title">
Pilih Lagu
</h2>


<p id="artist">
Sedatur Music
</p>


<audio id="audio" controls></audio>



</div>




<div class="search">

<input 
id="search"
placeholder="Cari lagu atau artis...">

</div>




<div class="playlist" id="playlist">

Memuat playlist...

</div>



</div>





<!-- MINI PLAYER -->

<div class="mini-player">


<button onclick="prevSong()">
⏮
</button>


<button onclick="togglePlay()">
▶️
</button>


<button onclick="nextSong()">
⏭
</button>



<div class="mini-info">

<div id="miniTitle">
Sedatur Music
</div>

<div id="miniArtist">
-
</div>

</div>


</div>





<footer>

© 2026 Sedatur Music Hub

</footer>



<script>

let songs = [];
let current = 0;


const audio = document.getElementById("audio");

const title = document.getElementById("title");
const artist = document.getElementById("artist");
const cover = document.getElementById("cover");

const playlist = document.getElementById("playlist");

const miniTitle = document.getElementById("miniTitle");
const miniArtist = document.getElementById("miniArtist");




// LOAD PLAYLIST

fetch("playlist.json?v=1")

.then(response => response.json())

.then(data => {

songs = data;

renderPlaylist(songs);


// buka lagu terakhir

let last = localStorage.getItem("lastSong");

if(last !== null){

loadSong(Number(last), false);

}


})

.catch(error=>{

playlist.innerHTML =
"Playlist gagal dimuat";

});





// TAMPILKAN LIST LAGU

function renderPlaylist(data){


playlist.innerHTML="";


data.forEach(song=>{


let index = songs.indexOf(song);


let item = document.createElement("div");


item.className="song";


item.innerHTML = `

<img src="${song.cover}">


<div class="song-info">

<div class="song-title">
${song.title}
</div>


<div class="song-artist">
${song.artist}
</div>


</div>

`;



item.onclick = ()=>{

loadSong(index,true);

};



playlist.appendChild(item);



});


}





// LOAD LAGU

function loadSong(index,play=true){


current = index;


let song = songs[index];


audio.src = song.file;


title.innerHTML = song.title;

artist.innerHTML = song.artist;


cover.src = song.cover;



miniTitle.innerHTML = song.title;

miniArtist.innerHTML = song.artist;



localStorage.setItem(
"lastSong",
index
);



if(play){

audio.play();

}


}





// NEXT

function nextSong(){


current++;


if(current >= songs.length){

current = 0;

}


loadSong(current,true);


}





// PREVIOUS

function prevSong(){


current--;


if(current < 0){

current = songs.length-1;

}


loadSong(current,true);


}





// PLAY / PAUSE MINI PLAYER

function togglePlay(){


if(audio.paused){

audio.play();

}

else{

audio.pause();

}


}





// AUTO NEXT

audio.onended=function(){

nextSong();

};






// SEARCH

document
.getElementById("search")
.addEventListener(
"input",
function(){


let keyword=this.value.toLowerCase();



let result=songs.filter(song=>


song.title
.toLowerCase()
.includes(keyword)


||

song.artist
.toLowerCase()
.includes(keyword)


);



renderPlaylist(result);



});







// PWA SERVICE WORKER

if("serviceWorker" in navigator){


navigator.serviceWorker.register(
"sw.js"
)

.then(()=>{

console.log(
"Sedatur PWA aktif"
);

});


  }

</script>


</body>

</html>
