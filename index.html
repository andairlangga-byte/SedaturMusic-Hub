<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>🎵 Sedatur Music Hub</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
margin:0;
padding:0
}

:root{
--bg:#030712;
--panel:#0f172a;
--panel2:#111c30;
--border:rgba(255,255,255,.09);
--text:#f8fafc;
--muted:#94a3b8;
--accent:#38bdf8;
--green:#22c55e
}

body{
background:
radial-gradient(circle at 15% 0%,rgba(56,189,248,.13),transparent 30%),
radial-gradient(circle at 90% 20%,rgba(34,197,94,.08),transparent 28%),
var(--bg);
color:var(--text);
min-height:100vh
}

button,
input,
select{
font:inherit
}

button{
cursor:pointer
}


/* HEADER */

header{
position:sticky;
top:0;
z-index:100;
padding:15px;
background:rgba(3,7,18,.82);
backdrop-filter:blur(18px);
border-bottom:1px solid var(--border);
display:flex;
justify-content:space-between;
align-items:center;
gap:15px
}

.logo{
font-size:20px;
font-weight:900
}

.home{
display:inline-block;
background:rgba(56,189,248,.14);
border:1px solid rgba(56,189,248,.25);
color:var(--accent);
padding:9px 13px;
border-radius:12px;
text-decoration:none;
font-size:13px;
font-weight:700
}

.clock{
text-align:right;
margin-top:6px
}

#time{
font-size:18px;
font-weight:900
}

#date{
font-size:10px;
color:var(--muted)
}


/* MARQUEE */

.marquee{
margin:15px auto;
max-width:650px;
background:rgba(255,255,255,.035);
border:1px solid var(--border);
padding:11px;
border-radius:14px;
overflow:hidden;
white-space:nowrap
}

.marquee span{
display:inline-block;
animation:run 16s linear infinite;
color:#cbd5e1;
font-size:12px
}

@keyframes run{
from{transform:translateX(100%)}
to{transform:translateX(-100%)}
}


/* MAIN */

.box{
width:min(650px,100%);
margin:auto;
padding:0 15px 30px
}

.card{
background:
linear-gradient(
145deg,
rgba(17,28,48,.95),
rgba(8,15,29,.95)
);
border:1px solid var(--border);
border-radius:28px;
padding:22px;
box-shadow:0 25px 80px rgba(0,0,0,.35)
}


/* VINYL */

.vinyl{
width:220px;
height:220px;
margin:5px auto 0;
border-radius:50%;
background:
radial-gradient(
circle,
#222 0 10%,
#111 11% 20%,
#333 21% 22%,
#080808 23% 100%
);
display:flex;
align-items:center;
justify-content:center;
box-shadow:
0 0 0 8px rgba(255,255,255,.025),
0 20px 50px rgba(0,0,0,.5)
}

.vinyl img{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
border:4px solid #111
}

.spin{
animation:spin 8s linear infinite
}

@keyframes spin{
to{transform:rotate(360deg)}
}


/* SONG INFO */

#title{
font-size:24px;
margin-top:22px;
line-height:1.2
}

.artist{
color:var(--muted);
font-size:14px;
margin-top:7px
}

#status{
margin-top:10px;
font-size:12px;
color:#cbd5e1
}


/* SEEK */

.seek-area{
margin-top:22px
}

#seek{
width:100%;
accent-color:var(--accent)
}

.time-row{
display:flex;
justify-content:space-between;
font-size:11px;
color:var(--muted);
margin-top:5px
}


/* CONTROLS */

.controls{
display:flex;
justify-content:center;
align-items:center;
gap:9px;
margin:20px 0 15px;
flex-wrap:wrap
}

.controls button{
width:43px;
height:43px;
border:1px solid var(--border);
border-radius:50%;
background:#1e293b;
color:white;
font-size:17px;
transition:.2s
}

.controls button:active{
transform:scale(.92)
}

.controls button:hover{
background:#334155
}

.play{
width:62px!important;
height:62px!important;
background:var(--green)!important;
color:#001b08!important;
font-size:22px!important
}


/* LYRICS BUTTON */

.lyrics-btn{
width:100%;
height:48px;
border:1px solid rgba(56,189,248,.25);
border-radius:15px;
background:
linear-gradient(
135deg,
rgba(56,189,248,.18),
rgba(56,189,248,.06)
);
color:#7dd3fc;
font-weight:800;
font-size:14px;
transition:.2s
}

.lyrics-btn:hover{
background:rgba(56,189,248,.25)
}

.lyrics-btn:disabled{
opacity:.35;
cursor:not-allowed
}


/* VOLUME */

.volume-box{
margin-top:15px;
padding:13px 15px;
border-radius:15px;
background:rgba(255,255,255,.035);
border:1px solid var(--border)
}

.volume-label{
font-size:11px;
color:var(--muted);
margin-bottom:7px
}

#vol{
width:100%;
accent-color:var(--accent)
}


/* CATEGORY */

#cat{
width:100%;
margin-top:15px;
padding:13px;
border-radius:14px;
border:1px solid var(--border);
background:#0b1424;
color:white;
outline:none
}


/* PLAYLIST */

.playlist{
margin-top:15px;
background:rgba(2,6,23,.7);
border:1px solid var(--border);
border-radius:18px;
padding:8px
}

.song{
display:flex;
gap:12px;
align-items:center;
padding:10px;
border-radius:13px;
cursor:pointer;
transition:.2s
}

.song:hover{
background:#1e293b
}

.song.active{
background:
linear-gradient(
90deg,
rgba(56,189,248,.14),
rgba(56,189,248,.04)
);
border-left:3px solid var(--accent)
}

.song img{
width:48px;
height:48px;
border-radius:50%;
object-fit:cover
}

.song-info{
min-width:0
}

.song-info b{
font-size:13px
}

.song-info small{
color:var(--muted);
font-size:11px
}


/* =========================
   VIDEO POPUP
========================= */

.video-modal{
position:fixed;
inset:0;
z-index:9999;
display:none;
align-items:center;
justify-content:center;
padding:18px;
background:rgba(0,0,0,.88);
backdrop-filter:blur(12px)
}

.video-modal.active{
display:flex
}

.video-panel{
width:min(900px,100%);
max-height:92vh;
background:
linear-gradient(
145deg,
#111827,
#020617
);
border:1px solid rgba(255,255,255,.12);
border-radius:24px;
overflow:hidden;
box-shadow:0 30px 100px rgba(0,0,0,.7);
animation:modalIn .22s ease
}

@keyframes modalIn{
from{
opacity:0;
transform:scale(.94)
}
to{
opacity:1;
transform:scale(1)
}
}

.video-header{
padding:14px 16px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
border-bottom:1px solid var(--border)
}

.video-title{
min-width:0
}

.video-title b{
display:block;
font-size:14px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.video-title span{
display:block;
font-size:11px;
color:var(--muted);
margin-top:3px
}

.video-actions{
display:flex;
gap:7px;
flex-shrink:0
}

.video-actions button{
width:38px;
height:38px;
border:0;
border-radius:50%;
background:rgba(255,255,255,.08);
color:white;
font-size:17px
}

.video-actions button:hover{
background:rgba(255,255,255,.15)
}

.video-wrap{
background:#000;
aspect-ratio:16/9;
display:flex;
align-items:center;
justify-content:center
}

#lyricsVideo{
width:100%;
height:100%;
display:block;
background:#000
}

.video-footer{
padding:11px 15px;
font-size:10px;
color:#64748b;
text-align:center
}


/* MOBILE */

@media(max-width:500px){

header{
align-items:flex-start
}

.logo{
font-size:17px
}

.clock{
display:none
}

.card{
padding:17px
}

.vinyl{
width:190px;
height:190px
}

.vinyl img{
width:78px;
height:78px
}

#title{
font-size:21px
}

.video-modal{
padding:8px
}

.video-panel{
border-radius:18px
}

}


/* DESKTOP */

@media(min-width:800px){

.box{
padding-bottom:50px
}

}

</style>
</head>


<body>


<header>

<div class="logo">
🎵 Sedatur Music Hub
</div>

<div>

<a
class="home"
href="https://sites.google.com/view/sedatur-rawamangun/home"
target="_blank">

🏠 Home

</a>

<div class="clock">

<div id="time">
00:00:00
</div>

<div id="date">
-
</div>

</div>

</div>

</header>


<div class="marquee">

<span id="run">
🎵 Selamat datang di Sedatur Music Hub 🎧
</span>

</div>


<main class="box">

<div class="card">


<div
class="vinyl"
id="vinyl">

id="cover"
src="logo.png"
alt="Cover">

</div>

</div>

min="0"
max="100"
value="0">

00:00

00:00
</span>

</div>

id="play"
class="play">

type="range"
min="0"
max="1"
step="0.01"

id="videoModal">

<b id="videoTitle">
Lirik Video
</b>

Sedatur Music Hub
</span>

</div>

id="fullscreenBtn"
title="Fullscreen">

⛶

</button>

id="closeVideo"
title="Tutup">

✕

</button>

</div>

</div>

controls
playsinline
preload="metadata">

Browser tidak mendukung video.

</video>

</div>

🎵 Sedatur Music Hub • Video lirik

</div>


</div>

</div>


<audio id="audio"></audio>

<script>

/* =====================================================
   ELEMENT
===================================================== */

const audio = document.getElementById("audio");

const vinyl = document.getElementById("vinyl");
const cover = document.getElementById("cover");

const title = document.getElementById("title");
const artist = document.getElementById("artist");
const status = document.getElementById("status");

const play = document.getElementById("play");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

const shuffle = document.getElementById("shuffle");
const repeat = document.getElementById("repeat");

const seek = document.getElementById("seek");
const vol = document.getElementById("vol");

const cur = document.getElementById("cur");
const dur = document.getElementById("dur");

const list = document.getElementById("list");
const cat = document.getElementById("cat");

const run = document.getElementById("run");

const lyricsBtn = document.getElementById("lyricsBtn");

const videoModal = document.getElementById("videoModal");
const lyricsVideo = document.getElementById("lyricsVideo");

const videoTitle = document.getElementById("videoTitle");
const videoArtist = document.getElementById("videoArtist");

const closeVideo = document.getElementById("closeVideo");
const fullscreenBtn = document.getElementById("fullscreenBtn");


/* =====================================================
   DATA
===================================================== */

let songs = [];

let index = 0;

let shuf = false;
let rep = false;


/* =====================================================
   CLOCK REALTIME
===================================================== */

function updateClock(){

    const now = new Date();

    document.getElementById("time").textContent =
        now.toLocaleTimeString(
            "id-ID",
            {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            }
        );

    document.getElementById("date").textContent =
        now.toLocaleDateString(
            "id-ID",
            {
                weekday:"long",
                day:"numeric",
                month:"long",
                year:"numeric"
            }
        );

}

updateClock();

setInterval(updateClock,1000);


/* =====================================================
   LOAD PLAYLIST.JSON
===================================================== */

fetch("playlist.json?cache=" + Date.now())

.then(response => {

    if(!response.ok){

        throw new Error(
            "playlist.json gagal dimuat"
        );

    }

    return response.json();

})

.then(data => {

    if(!Array.isArray(data)){

        throw new Error(
            "Format playlist.json harus berupa array"
        );

    }

    songs = data;

    buatKategori();

    restore();

    tampil();

})

.catch(error => {

    console.error(error);

    list.innerHTML = `

        <div style="
        padding:20px;
        text-align:center;
        color:#fca5a5;
        font-size:12px;
        ">

        ⚠️ Playlist gagal dimuat.<br><br>

        ${escapeHTML(error.message)}

        </div>

    `;

});


/* =====================================================
   CATEGORY
===================================================== */

function buatKategori(){

    cat.innerHTML = `
        <option value="all">
            🎤 Semua Artis
        </option>
    `;

    const categories = [
        ...new Set(
            songs
            .map(song => song.category)
            .filter(Boolean)
        )
    ];

    categories.forEach(category => {

        const option =
            document.createElement("option");

        option.value = category;

        option.textContent =
            "🎤 " + category;

        cat.appendChild(option);

    });

}


/* =====================================================
   PLAYLIST
===================================================== */

function tampil(){

    list.innerHTML = "";

    songs.forEach((song,i) => {

        if(
            cat.value !== "all" &&
            song.category !== cat.value
        ){

            return;

        }

        const div =
            document.createElement("div");

        div.className =
            "song" +
            (i === index ? " active" : "");

        div.innerHTML = `

            <img
            src="${escapeHTML(song.cover || "logo.png")}"
            onerror="this.src='logo.png'"
            alt="Cover">

            <div class="song-info">

                <b>
                    ${escapeHTML(song.title || "Tanpa Judul")}
                </b>

                <br>

                <small>
                    ${escapeHTML(song.artist || "Unknown")}
                </small>

            </div>

        `;

        div.onclick = () => {

            index = i;

            load();

            playSong();

            tampil();

        };

        list.appendChild(div);

    });

}

cat.addEventListener(
    "change",
    tampil
);


/* =====================================================
   LOAD SONG
===================================================== */

function load(){

    const song = songs[index];

    if(!song){
        return;
    }

    audio.src = song.file;

    cover.src =
        song.cover || "logo.png";

    title.textContent =
        song.title || "Tanpa Judul";

    artist.textContent =
        song.artist || "Unknown";

    run.textContent =
        "🎵 Sedang Diputar • " +
        (song.title || "") +
        " • " +
        (song.artist || "") +
        " 🎧";

    /*
       VIDEO LIRIK
    */

    if(song.lyricsVideo){

        lyricsBtn.disabled = false;

        lyricsBtn.textContent =
            "🎬 Lihat Lirik Video";

    }else{

        lyricsBtn.disabled = true;

        lyricsBtn.textContent =
            "🎬 Lirik Video Tidak Tersedia";

    }

    /*
       SIMPAN LAGU
    */

    localStorage.setItem(
        "sedatur_song",
        index
    );

    /*
       RESET SEEK
    */

    seek.value = 0;

    cur.textContent = "00:00";

    dur.textContent = "00:00";

    /*
       MEDIA SESSION
    */

    setupMediaSession();

}


/* =====================================================
   PLAY
===================================================== */

function playSong(){

    if(!audio.src){

        load();

    }

    const promise =
        audio.play();

    if(promise){

        promise.catch(error => {

            console.log(
                "Autoplay/play ditolak:",
                error
            );

        });

    }

    play.textContent = "⏸";

    status.textContent =
        "🟢 Sedang Diputar";

    vinyl.classList.add("spin");

}


/* =====================================================
   PAUSE
===================================================== */

function pauseSong(){

    audio.pause();

    play.textContent = "▶";

    status.textContent =
        "⏸ Dijeda";

    vinyl.classList.remove("spin");

}


/* =====================================================
   PLAY BUTTON
===================================================== */

play.onclick = () => {

    if(audio.paused){

        playSong();

    }else{

        pauseSong();

    }

};


/* =====================================================
   NEXT
===================================================== */

next.onclick = () => {

    if(!songs.length){
        return;
    }

    if(shuf){

        if(songs.length === 1){

            index = 0;

        }else{

            let nextIndex;

            do{

                nextIndex =
                    Math.floor(
                        Math.random() *
                        songs.length
                    );

            }while(nextIndex === index);

            index = nextIndex;

        }

    }else{

        index++;

        if(index >= songs.length){

            index = 0;

        }

    }

    load();

    tampil();

    playSong();

};


/* =====================================================
   PREVIOUS
===================================================== */

prev.onclick = () => {

    if(!songs.length){
        return;
    }

    index--;

    if(index < 0){

        index =
            songs.length - 1;

    }

    load();

    tampil();

    playSong();

};


/* =====================================================
   SHUFFLE
===================================================== */

shuffle.onclick = () => {

    shuf = !shuf;

    shuffle.style.background =
        shuf
        ? "#22c55e"
        : "#1e293b";

    localStorage.setItem(
        "sedatur_shuffle",
        shuf
    );

};


/* =====================================================
   REPEAT
===================================================== */

repeat.onclick = () => {

    rep = !rep;

    repeat.style.background =
        rep
        ? "#22c55e"
        : "#1e293b";

    localStorage.setItem(
        "sedatur_repeat",
        rep
    );

};


/* =====================================================
   AUTO NEXT
===================================================== */

audio.addEventListener(
    "ended",
    () => {

        if(rep){

            audio.currentTime = 0;

            playSong();

        }else{

            next.click();

        }

    }
);


/* =====================================================
   LOADED METADATA
===================================================== */

audio.addEventListener(
    "loadedmetadata",
    () => {

        if(
            Number.isFinite(audio.duration)
        ){

            seek.max =
                audio.duration;

            dur.textContent =
                formatTime(audio.duration);

        }

    }
);


/* =====================================================
   TIME UPDATE
===================================================== */

audio.addEventListener(
    "timeupdate",
    () => {

        if(
            Number.isFinite(audio.duration)
        ){

            seek.value =
                audio.currentTime;

        }

        cur.textContent =
            formatTime(
                audio.currentTime
            );

        localStorage.setItem(
            "sedatur_position",
            audio.currentTime
        );

    }
);


/* =====================================================
   SEEK
===================================================== */

seek.addEventListener(
    "input",
    () => {

        audio.currentTime =
            Number(seek.value);

    }
);


/* =====================================================
   VOLUME
===================================================== */

const savedVolume =
    localStorage.getItem(
        "sedatur_volume"
    );

if(savedVolume !== null){

    vol.value = savedVolume;

}

audio.volume =
    Number(vol.value);


vol.addEventListener(
    "input",
    () => {

        audio.volume =
            Number(vol.value);

        localStorage.setItem(
            "sedatur_volume",
            vol.value
        );

    }
);


/* =====================================================
   VIDEO LIRIK
===================================================== */

lyricsBtn.addEventListener(
    "click",
    bukaVideo
);


function bukaVideo(){

    const song = songs[index];

    if(
        !song ||
        !song.lyricsVideo
    ){

        return;

    }

    /*
       SET VIDEO
    */

    lyricsVideo.src =
        song.lyricsVideo;

    videoTitle.textContent =
        song.title || "Lirik Video";

    videoArtist.textContent =
        song.artist || "Sedatur Music Hub";


    /*
       BUKA MODAL
    */

    videoModal.classList.add(
        "active"
    );

    document.body.style.overflow =
        "hidden";


    /*
       VIDEO MENGIKUTI POSISI MP3
    */

    lyricsVideo.currentTime =
        audio.currentTime;


    /*
       COBA PLAY
    */

    const promise =
        lyricsVideo.play();

    if(promise){

        promise.catch(() => {

            /*
               Browser bisa menolak
               autoplay, user tinggal
               tekan tombol play video.
            */

        });

    }

}


/* =====================================================
   TUTUP VIDEO
===================================================== */

function tutupVideo(){

    lyricsVideo.pause();

    lyricsVideo.removeAttribute(
        "src"
    );

    lyricsVideo.load();

    videoModal.classList.remove(
        "active"
    );

    document.body.style.overflow =
        "";

}


closeVideo.onclick =
    tutupVideo;


/* =====================================================
   KLIK LUAR POPUP
===================================================== */

videoModal.addEventListener(
    "click",
    event => {

        if(
            event.target === videoModal
        ){

            tutupVideo();

        }

    }
);


/* =====================================================
   ESCAPE
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape" &&
            videoModal.classList.contains(
                "active"
            )
        ){

            tutupVideo();

        }

    }
);


/* =====================================================
   FULLSCREEN
===================================================== */

fullscreenBtn.onclick = () => {

    if(
        document.fullscreenElement
    ){

        document.exitFullscreen();

        return;

    }

    if(
        lyricsVideo.requestFullscreen
    ){

        lyricsVideo.requestFullscreen();

    }else if(
        lyricsVideo.webkitEnterFullscreen
    ){

        /*
           Safari/iOS fallback
        */

        lyricsVideo.webkitEnterFullscreen();

    }

};


/* =====================================================
   SINKRON POSISI MP3 → VIDEO
===================================================== */

/*
   Saat popup dibuka, video mengambil
   posisi MP3.

   Kalau user sedang menggeser MP3
   sebelum membuka video, posisi juga
   akan ikut.
*/

audio.addEventListener(
    "seeked",
    () => {

        if(
            videoModal.classList.contains(
                "active"
            ) &&
            Number.isFinite(
                lyricsVideo.duration
            )
        ){

            /*
               Hanya sinkron kalau
               perbedaannya signifikan.
            */

            const difference =
                Math.abs(
                    lyricsVideo.currentTime -
                    audio.currentTime
                );

            if(difference > 1){

                lyricsVideo.currentTime =
                    audio.currentTime;

            }

        }

    }
);


/* =====================================================
   VIDEO AUTO FOLLOW AUDIO
===================================================== */

audio.addEventListener(
    "play",
    () => {

        if(
            videoModal.classList.contains(
                "active"
            )
        ){

            /*
               Samakan posisi
            */

            if(
                Math.abs(
                    lyricsVideo.currentTime -
                    audio.currentTime
                ) > 1
            ){

                lyricsVideo.currentTime =
                    audio.currentTime;

            }

            lyricsVideo.play()
            .catch(() => {});

        }

    }
);


audio.addEventListener(
    "pause",
    () => {

        if(
            videoModal.classList.contains(
                "active"
            )
        ){

            lyricsVideo.pause();

        }

    }
);

/* =====================================================
   RESTORE
===================================================== */

function restore(){

    if(!songs.length){
        return;
    }

    const savedSong =
        Number(
            localStorage.getItem(
                "sedatur_song"
            )
        );

    if(
        Number.isInteger(savedSong) &&
        savedSong >= 0 &&
        savedSong < songs.length
    ){

        index = savedSong;

    }else{

        index = 0;

    }


    shuf =
        localStorage.getItem(
            "sedatur_shuffle"
        ) === "true";


    rep =
        localStorage.getItem(
            "sedatur_repeat"
        ) === "true";


    shuffle.style.background =
        shuf
        ? "#22c55e"
        : "#1e293b";


    repeat.style.background =
        rep
        ? "#22c55e"
        : "#1e293b";


    load();

}


/* =====================================================
   RESTORE POSITION
===================================================== */

audio.addEventListener(
    "loadedmetadata",
    () => {

        const savedPosition =
            Number(
                localStorage.getItem(
                    "sedatur_position"
                )
            );

        /*
           Jangan restore posisi kalau
           hampir melewati akhir lagu.
        */

        if(
            Number.isFinite(savedPosition) &&
            savedPosition > 0 &&
            savedPosition < audio.duration - 3
        ){

            audio.currentTime =
                savedPosition;

        }

    }
);


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(seconds){

    if(
        !Number.isFinite(seconds)
    ){

        return "00:00";

    }

    const minutes =
        Math.floor(
            seconds / 60
        );

    const secs =
        Math.floor(
            seconds % 60
        );

    return String(minutes)
        .padStart(2,"0")
        +
        ":" +
        String(secs)
        .padStart(2,"0");

}


/* =====================================================
   MEDIA SESSION ANDROID
===================================================== */

function setupMediaSession(){

    if(
        !("mediaSession" in navigator)
    ){

        return;

    }

    const song =
        songs[index];

    if(!song){
        return;
    }

    try{

        navigator.mediaSession.metadata =
            new MediaMetadata({

                title:
                    song.title || "Sedatur Music Hub",

                artist:
                    song.artist || "Sedatur",

                album:
                    "Sedatur Music Hub",

                artwork:[
                    {
                        src:
                            song.cover ||
                            "logo.png",

                        sizes:"512x512",

                        type:"image/png"
                    }
                ]

            });


        navigator.mediaSession.setActionHandler(
            "play",
            playSong
        );


        navigator.mediaSession.setActionHandler(
            "pause",
            pauseSong
        );


        navigator.mediaSession.setActionHandler(
            "nexttrack",
            () => next.click()
        );


        navigator.mediaSession.setActionHandler(
            "previoustrack",
            () => prev.click()
        );


        navigator.mediaSession.setActionHandler(
            "seekbackward",
            () => {

                audio.currentTime =
                    Math.max(
                        0,
                        audio.currentTime - 10
                    );

            }
        );


        navigator.mediaSession.setActionHandler(
            "seekforward",
            () => {

                audio.currentTime =
                    Math.min(
                        audio.duration,
                        audio.currentTime + 10
                    );

            }
        );

    }catch(error) {

}

}
