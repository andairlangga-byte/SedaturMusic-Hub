<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Sedatur Music Hub</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080808;
  color:#fff;
  min-height:100vh;
}

header{
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #222;
  position:sticky;
  top:0;
  background:#080808ee;
  backdrop-filter:blur(12px);
  z-index:10;
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.home{
  text-decoration:none;
  color:#fff;
  background:#191919;
  padding:9px 14px;
  border-radius:20px;
}

.container{
  width:min(900px,94%);
  margin:auto;
  padding:25px 0 40px;
}

.hero{
  text-align:center;
  padding:15px 0 25px;
}

.hero h1{
  font-size:28px;
  margin-bottom:8px;
}

.hero p{
  color:#aaa;
}

.player{
  background:linear-gradient(145deg,#171717,#0e0e0e);
  border:1px solid #292929;
  border-radius:24px;
  padding:22px;
  box-shadow:0 15px 50px #0008;
}

.cover-box{
  display:flex;
  justify-content:center;
  margin-bottom:18px;
}

#vinyl{
  width:190px;
  height:190px;
  border-radius:50%;
  overflow:hidden;
  border:6px solid #222;
  box-shadow:0 10px 30px #000;
}

#cover{
  width:100%;
  height:100%;
  object-fit:cover;
}

.spin{
  animation:spin 5s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.song-info{
  text-align:center;
  margin-bottom:20px;
}

.song-info h2{
  font-size:21px;
  margin-bottom:5px;
}

.song-info p{
  color:#aaa;
}

#status{
  display:block;
  margin-top:8px;
  font-size:13px;
  color:#888;
}

.progress{
  display:flex;
  align-items:center;
  gap:8px;
}

input[type="range"]{
  width:100%;
  accent-color:#fff;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin:18px 0;
}

.controls button,
.tool button{
  border:0;
  background:#222;
  color:#fff;
  width:42px;
  height:42px;
  border-radius:50%;
  cursor:pointer;
  font-size:17px;
}

.controls button:hover,
.tool button:hover{
  background:#333;
}

.controls .main{
  width:58px;
  height:58px;
  font-size:22px;
  background:#fff;
  color:#000;
}

.controls button.active{
  background:#fff;
  color:#000;
}

.tools{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.tool{
  display:flex;
  align-items:center;
  gap:8px;
  background:#171717;
  padding:10px;
  border-radius:14px;
}

.tool span{
  font-size:13px;
  color:#aaa;
}

#sleepSelect{
  flex:1;
  background:#222;
  color:#fff;
  border:0;
  padding:8px;
  border-radius:8px;
}

#sleepCountdown{
  display:none;
  color:#aaa;
  font-size:12px;
  margin-top:5px;
}

.video-box{
  display:none;
  margin-top:18px;
}

.video-box.active{
  display:block;
}

#lyricsVideo{
  width:100%;
  max-height:400px;
  border-radius:16px;
  background:#000;
}

.search-area{
  margin-top:22px;
}

#search,
#category{
  width:100%;
  padding:13px;
  margin-bottom:10px;
  background:#151515;
  color:#fff;
  border:1px solid #292929;
  border-radius:12px;
  outline:none;
}

.playlist{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.song{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px;
  background:#141414;
  border:1px solid #222;
  border-radius:13px;
  cursor:pointer;
}

.song:hover{
  background:#1d1d1d;
}

.song.active{
  border-color:#fff;
}

.song-info-list{
  min-width:0;
}

.song-title{
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.song-artist{
  color:#888;
  font-size:12px;
  margin-top:3px;
}

.fav{
  background:none;
  border:0;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:20px;
}

.stat{
  background:#141414;
  border:1px solid #222;
  border-radius:14px;
  padding:14px 5px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:18px;
}

.stat span{
  color:#888;
  font-size:11px;
}

.marquee{
  overflow:hidden;
  white-space:nowrap;
  margin:15px 0;
  color:#777;
  font-size:12px;
}

#marqueeText{
  display:inline-block;
  animation:marquee 15s linear infinite;
}

@keyframes marquee{
  from{
    transform:translateX(100%);
  }

  to{
    transform:translateX(-100%);
  }
}

.empty{
  text-align:center;
  padding:25px;
  color:#777;
}

@media(max-width:600px){

  .tools{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  #vinyl{
    width:160px;
    height:160px;
  }

  .controls{
    gap:6px;
  }

}

</style>
</head>

let shuffleMode = false;

/* =====================================================

   /* =====================================================

/* =====================================================
   FORMAT WAKTU
===================================================== */

function formatTime(seconds){

  if(!isFinite(seconds) || seconds < 0){
    return "00:00";
  }

  const min = Math.floor(seconds / 60);
  const sec = Math.floor(seconds % 60);

  return String(min).padStart(2,"0") + ":" +
         String(sec).padStart(2,"0");
}


/* =====================================================
   FAVORIT
===================================================== */

function getFavorites(){

  try{
    return JSON.parse(
      localStorage.getItem("sedatur_favorites") || "[]"
    );
  }catch{
    return [];
  }

}


function isFavorite(index){

  return getFavorites().includes(index);

}


function toggleFavorite(index){

  let favorites = getFavorites();

  if(favorites.includes(index)){

    favorites =
      favorites.filter(i => i !== index);

  }else{

    favorites.push(index);

  }

  localStorage.setItem(
    "sedatur_favorites",
    JSON.stringify(favorites)
  );

  renderPlaylist();
  updateStats();

}


/* =====================================================
   KATEGORI ARTIS
===================================================== */

function createCategories(){

  category.innerHTML = `
    <option value="all">
      🎤 Semua Artis
    </option>
  `;

  const categories = [
    ...new Set(
      songs
        .map(song => song.category || song.artist)
        .filter(Boolean)
    )
  ];

  categories.forEach(name => {

    const option =
      document.createElement("option");

    option.value = name;
    option.textContent = "🎤 " + name;

    category.appendChild(option);

  });

}


/* =====================================================
   RENDER PLAYLIST
===================================================== */

function renderPlaylist(){

  playlist.innerHTML = "";

  const keyword =
    search.value.trim().toLowerCase();

  let count = 0;

  songs.forEach((song,index)=>{

    const text = (
      (song.title || "") + " " +
      (song.artist || "") + " " +
      (song.category || "")
    ).toLowerCase();


    if(
      category.value !== "all" &&
      song.category !== category.value &&
      song.artist !== category.value
    ){

      return;

    }


    if(
      keyword &&
      !text.includes(keyword)
    ){

      return;

    }


    count++;


    const item =
      document.createElement("div");

    item.className = "song";


    if(index === currentIndex){

      item.classList.add("active");

    }


    const favorite =
      isFavorite(index);


    item.innerHTML = `

      <div class="song-info-list">

        <div class="song-title">
          ${song.title || "Tanpa Judul"}
        </div>

        <div class="song-artist">
          ${song.artist || "Unknown Artist"}
        </div>

      </div>

      <button
        class="fav"
        type="button"
      >
        ${favorite ? "❤️" : "♡"}
      </button>

    `;


    item.addEventListener(
      "click",
      ()=>{

        currentIndex = index;

        loadSong(true);

      }
    );


    item
      .querySelector(".fav")
      .addEventListener(
        "click",
        event => {

          event.stopPropagation();

          toggleFavorite(index);

        }
      );


    playlist.appendChild(item);

  });


  if(count === 0){

    playlist.innerHTML = `
      <div class="empty">
        🔎 Lagu tidak ditemukan
      </div>
    `;

  }

}


/* =====================================================
   SEARCH & FILTER
===================================================== */

search.addEventListener(
  "input",
  renderPlaylist
);


category.addEventListener(
  "change",
  renderPlaylist
);


/* =====================================================
   LOAD LAGU
===================================================== */

function loadSong(autoplay = false){

  if(!songs.length){

    status.textContent =
      "⚠️ Playlist kosong";

    return;

  }


  const song =
    songs[currentIndex];

  if(!song) return;


  audio.pause();


  /* AUDIO */

  audio.src =
    song.file || "";

  audio.load();


  /* COVER */

  cover.src =
    song.cover || "logo.png";


  cover.onerror = function(){

    this.onerror = null;

    this.src = "logo.png";

  };


  /* INFORMASI */

  title.textContent =
    song.title || "Tanpa Judul";

  artist.textContent =
    song.artist || "Unknown Artist";


  marqueeText.textContent =
    "🎵 " +
    (song.title || "") +
    " — " +
    (song.artist || "") +
    " • Sedatur Music Hub";


  status.textContent =
    "⏸ Siap diputar";


  /* PROGRESS */

  seek.value = 0;

  currentTime.textContent =
    "00:00";

  duration.textContent =
    "00:00";


  /* VIDEO */

  stopVideo();


  if(
    song.lyricsVideo &&
    String(song.lyricsVideo).trim()
  ){

    videoBtn.disabled = false;

    videoBtn.textContent = "🎬";

  }else{

    videoBtn.disabled = true;

    videoBtn.textContent = "🚫";

  }


  /* SIMPAN LAGU TERAKHIR */

  localStorage.setItem(
    "sedatur_song",
    currentIndex
  );


  renderPlaylist();


  if(autoplay){

    playAudio();

  }

}


/* =====================================================
   PLAY / PAUSE
===================================================== */

function playAudio(){

  audio.play()
    .catch(()=>{

      status.textContent =
        "▶️ Tekan Play untuk memutar";

    });

}


function pauseAudio(){

  audio.pause();

}

  ()=>{

    if(!audio.src){

      loadSong(false);

    }


    if(audio.paused){

      playAudio();

    }else{

      pauseAudio();

    }

  }
);


/* =====================================================
   AUDIO PLAY
===================================================== */

audio.addEventListener(
  "play",
  ()=>{

/* =====================================================

===================================================== */

audio.addEventListener(
  "pause",
  ()=>{

    playBtn.textContent = "▶";

    playBtn.title = "Play";

    vinyl.classList.remove("spin");


    if(!audio.ended){

      status.textContent =

/* =====================================================

===================================================== */

audio.addEventListener(

  ()=>{

      "⚠️ Lagu gagal dimuat";

    vinyl.classList.remove("spin");

  }
);


/* =====================================================
   METADATA
===================================================== */

audio.addEventListener(
  "loadedmetadata",
  ()=>{

    if(isFinite(audio.duration)){

      seek.max =
        audio.duration;

      duration.textContent =
        formatTime(audio.duration);

    }

  }
);


/* =====================================================

===================================================== */

audio.addEventListener(

  ()=>{

    if(!isFinite(audio.duration)){
      return;
    }


    seek.max =

      audio.currentTime;


    currentTime.textContent =
      formatTime(
        audio.currentTime
      );


    duration.textContent =
      formatTime(
        audio.duration
      );

  }
);


/* =====================================================

===================================================== */

seek.addEventListener(
  "input",

    if(isFinite(audio.duration)){

      audio.currentTime =

    }

  }
);

if(savedVolume !== null){

}


audio.volume =

/* =====================================================
   SHUFFLE
===================================================== */

shuffleBtn.addEventListener(
  "click",
  ()=>{

    shuffleMode =
      !shuffleMode;

    shuffleBtn.classList.toggle(
      "active",
      shuffleMode
    );

  }
);


/* =====================================================
   REPEAT
===================================================== */

repeatBtn.addEventListener(
  "click",
  ()=>{

    repeatMode =
      !repeatMode;

    repeatBtn.classList.toggle(
      "active",
      repeatMode
    );

  }
);


/* =====================================================
   NEXT
===================================================== */

function nextSong(){

  if(!songs.length) return;


  if(shuffleMode){

    if(songs.length === 1){

      currentIndex = 0;

    }else{

      let nextIndex;

      do{

        nextIndex =
          Math.floor(
            Math.random() * songs.length
          );

      }while(
        nextIndex === currentIndex
      );


      currentIndex =
        nextIndex;

    }

  }else{

    currentIndex++;

    if(
      currentIndex >= songs.length
    ){

      currentIndex = 0;

    }

  }


  loadSong(true);

}


nextBtn.addEventListener(
  "click",
  nextSong
);


/* =====================================================
   PREVIOUS
===================================================== */

function previousSong(){

  if(!songs.length) return;


  if(audio.currentTime > 5){

    audio.currentTime = 0;

    return;

  }


  currentIndex--;


  if(currentIndex < 0){

    currentIndex =
      songs.length - 1;

  }


  loadSong(true);

}


prevBtn.addEventListener(
  "click",
  previousSong
);


/* =====================================================
   LAGU SELESAI
===================================================== */

audio.addEventListener(
  "ended",
  ()=>{

    if(repeatMode){

      audio.currentTime = 0;

      playAudio();

    }else{

      nextSong();

    }

  }
);


/* =====================================================
   STATISTIK
===================================================== */

function updateStats(){

  const statSongs =
    document.getElementById(
      "statSongs"
    );

  const statFav =
    document.getElementById(
      "statFav"
    );

  const statPlays =
    document.getElementById(
      "statPlays"
    );

  const statTime =
    document.getElementById(
      "statTime"
    );


  if(statSongs){

    statSongs.textContent =
      songs.length;

  }


  if(statFav){

    statFav.textContent =
      getFavorites().length;

  }


  if(statPlays){

    statPlays.textContent =
      localStorage.getItem(
        "sedatur_plays"
      ) || "0";

  }


  if(statTime){

    const seconds =
      Number(
        localStorage.getItem(
          "sedatur_playtime"
        ) || 0
      );


    statTime.textContent =
      Math.floor(seconds / 60) + "m";

  }

}


/* =====================================================
   HITUNG DIPUTAR
===================================================== */

audio.addEventListener(
  "play",
  ()=>{

    if(audio.dataset.counted !== "yes"){

      let plays =
        Number(
          localStorage.getItem(
            "sedatur_plays"
          ) || 0
        );


      plays++;


      localStorage.setItem(
        "sedatur_plays",
        plays
      );


      audio.dataset.counted =
        "yes";


      updateStats();

    }

  }
);


/* Reset hitungan saat lagu berubah */

function resetPlayCounter(){

  audio.dataset.counted = "";

}


/* =====================================================
   WAKTU DENGAR
===================================================== */

let lastAudioTime = 0;


audio.addEventListener(
  "timeupdate",
  ()=>{

    if(audio.paused){

      lastAudioTime =
        audio.currentTime;

      return;

    }


    const difference =
      audio.currentTime -
      lastAudioTime;


    if(
      difference > 0 &&
      difference < 2
    ){

      let total =
        Number(
          localStorage.getItem(
            "sedatur_playtime"
          ) || 0
        );


      total += difference;


      localStorage.setItem(
        "sedatur_playtime",
        total
      );


      updateStats();

    }


    lastAudioTime =
      audio.currentTime;

  }
);

/* ⬇️ TARUH PART 3 TEPAT DI BAWAH SINI */
/* =====================================================
   /* =====================================================
   SEDATUR MUSIC HUB — PART 3
   VIDEO LIRIK + SLEEP TIMER + START
===================================================== */


/* =====================================================
   VIDEO LIRIK
===================================================== */

let videoActive = false;


/* STOP VIDEO */

function stopVideo(){

  videoActive = false;

  try{
    lyricsVideo.pause();
  }catch(e){}

  lyricsVideo.removeAttribute("src");

  lyricsVideo.load();

  videoBox.classList.remove("active");

  videoBtn.textContent = "🎬";

}


/* BUKA / TUTUP VIDEO */

videoBtn.addEventListener(
  "click",
  ()=>{

    const song =
      songs[currentIndex];


    if(
      !song ||
      !song.lyricsVideo
    ){

      return;

    }


    /* TUTUP */

    if(videoActive){

      stopVideo();

      return;

    }


    /* BUKA */

    videoActive = true;

    lyricsVideo.muted = true;

    lyricsVideo.src =
      song.lyricsVideo;

    lyricsVideo.load();

    videoBox.classList.add(
      "active"
    );

    videoBtn.textContent = "❌";


    /*
      Video mengikuti posisi audio
    */

    lyricsVideo.addEventListener(
      "loadedmetadata",
      ()=>{

        try{

          lyricsVideo.currentTime =
            audio.currentTime;

        }catch(e){}


        /*
          Kalau audio sedang play,
          video ikut play
        */

        if(!audio.paused){

          lyricsVideo.play()
            .catch(()=>{});

        }

      },
      {once:true}
    );

  }
);


/* =====================================================
   AUDIO → VIDEO PLAY
===================================================== */

audio.addEventListener(
  "play",
  ()=>{

    if(!videoActive){
      return;
    }


    /*
      Samakan posisi sebelum play
    */

    try{

      lyricsVideo.currentTime =
        audio.currentTime;

    }catch(e){}


    lyricsVideo.play()
      .catch(()=>{});

  }
);


/* =====================================================
   AUDIO → VIDEO PAUSE
===================================================== */

audio.addEventListener(
  "pause",
  ()=>{

    if(!videoActive){
      return;
    }


    lyricsVideo.pause();

  }
);


/* =====================================================
   AUDIO → VIDEO SYNC
===================================================== */

audio.addEventListener(
  "timeupdate",
  ()=>{

    if(!videoActive){
      return;
    }


    if(
      !isFinite(
        lyricsVideo.duration
      )
    ){

      return;

    }


    const difference =
      Math.abs(
        lyricsVideo.currentTime -
        audio.currentTime
      );


    /*
      Koreksi kalau video
      mulai melenceng
    */

    if(difference > 0.4){

      try{

        lyricsVideo.currentTime =
          audio.currentTime;

      }catch(e){}

    }

  }
);


/* =====================================================
   SEEK AUDIO → VIDEO
===================================================== */

seek.addEventListener(
  "input",
  ()=>{

    if(!videoActive){
      return;
    }


    try{

      lyricsVideo.currentTime =
        audio.currentTime;

    }catch(e){}

  }
);


/* =====================================================
   ERROR VIDEO
===================================================== */

lyricsVideo.addEventListener(
  "error",
  ()=>{

    console.log(
      "❌ Video lirik gagal dimuat"
    );


    stopVideo();

  }
);


/* =====================================================
   SLEEP TIMER
===================================================== */

let sleepTimer = null;

const sleepSelect =
  document.getElementById(
    "sleepSelect"
  );

const sleepCountdown =
  document.getElementById(
    "sleepCountdown"
  );


sleepSelect.addEventListener(
  "change",
  ()=>{

    clearInterval(
      sleepTimer
    );


    sleepCountdown.style.display =
      "none";


    const minutes =
      Number(
        sleepSelect.value
      );


    if(!minutes){
      return;
    }


    let remaining =
      minutes * 60;


    sleepCountdown.style.display =
      "block";


    function updateSleep(){

      const min =
        Math.floor(
          remaining / 60
        );


      const sec =
        remaining % 60;


      sleepCountdown.textContent =
        "😴 Berhenti dalam " +
        String(min).padStart(2,"0") +
        ":" +
        String(sec).padStart(2,"0");


      if(remaining <= 0){

        clearInterval(
          sleepTimer
        );


        pauseAudio();


        sleepSelect.value =
          "0";


        sleepCountdown.textContent =
          "😴 Waktu tidur selesai";


        return;

      }


      remaining--;

    }


    updateSleep();


    sleepTimer =
      setInterval(
        updateSleep,
        1000
      );

  }
);


/* =====================================================
   RESTORE LAGU TERAKHIR
===================================================== */

const savedSong =

    )

if(

   /* =====================================================

function updateMediaSession(){

  if(!("mediaSession" in navigator)){
    return;
  }

  const song = songs[currentIndex];
  
  if(!song){
    return;
    
    updateMediaSession();
  }


  navigator.mediaSession.metadata =
    new MediaMetadata({

      title:
        song.title || "Sedatur Music Hub",

      artist:
        song.artist || "Unknown Artist",

      album:
        "Sedatur Music Hub",

      artwork:[
        {
          src:
            song.cover || "logo.png",

          sizes:
            "512x512",

          type:
            "image/png"
        }
      ]

    });

}


/* =====================================================
   PLAY / PAUSE
===================================================== */

if("mediaSession" in navigator){

  navigator.mediaSession.setActionHandler(
    "play",
    ()=>{
      playAudio();
    }
  );


  navigator.mediaSession.setActionHandler(
    "pause",
    ()=>{
      pauseAudio();
    }
  );


  navigator.mediaSession.setActionHandler(
    "nexttrack",
    ()=>{
      nextSong();
    }
  );


  navigator.mediaSession.setActionHandler(
    "previoustrack",
    ()=>{
      previousSong();
    }
  );

}

);
