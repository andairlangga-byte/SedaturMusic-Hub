<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>🎵 Sedatur Music Hub</title>

<style>
*{box-sizing:border-box;font-family:Arial;margin:0;padding:0}

body{
background:linear-gradient(#0f172a,#020617);
color:white;
min-height:100vh
}

header{
padding:15px;
display:flex;
justify-content:center;
align-items:center;
background:#111827;
position:sticky;
top:0
}

.logo{font-weight:bold;font-size:20px}

.home{
background:#2563eb;
color:white;
padding:8px 12px;
border-radius:10px;
text-decoration:none;
font-size:14px
}

.clock{text-align:right;font-size:13px}
#time{font-size:20px;font-weight:bold}


.marquee{
margin:15px;
background:#1e293b;
padding:10px;
border-radius:12px;
overflow:hidden;
white-space:nowrap
}

.marquee span{
display:inline-block;
animation:run 12s linear infinite
}

@keyframes run{
from{transform:translateX(100%)}
to{transform:translateX(-100%)}
}


.box{
max-width:600px;
margin:auto;
padding:15px
}


.card{
background:#1e293b;
border-radius:25px;
padding:20px;
text-align:center
}


.vinyl{
width:220px;
height:220px;
margin:auto;
border-radius:50%;
background:radial-gradient(circle,#333 0 20%,#000 21%);
display:flex;
align-items:center;
justify-content:center
}

.vinyl img{
width:90px;
height:90px;
border-radius:50%;
background:white
}

.spin{
animation:spin 8s linear infinite
}

@keyframes spin{
100%{transform:rotate(360deg)}
}


h2{
margin-top:20px
}

.artist{
color:#94a3b8;
margin:8px
}


input,select{
width:100%;
margin-top:10px
}


.controls{
display:flex;
justify-content:center;
gap:10px;
margin:20px
}

button{
width:45px;
height:45px;
border:0;
border-radius:50%;
background:#334155;
color:white;
font-size:18px
}

.play{
width:60px;
height:60px;
background:#22c55e
}


.playlist{
margin-top:20px;
background:#020617;
border-radius:15px;
padding:10px
}

.song{
display:flex;
gap:10px;
align-items:center;
padding:10px;
border-radius:10px
}

.song:hover{
background:#334155
}

.song img{
width:50px;
height:50px;
border-radius:50%
}

</style>
</head>

<body>

<header>

<div class="logo">
🎵 Sedatur Music Hub
</div>

<div>
<a class="home"
href="https://sites.google.com/view/sedatur-rawamangun/home"
target="_blank">
🏠 Home
</a>

<div class="clock">
<div id="time">00:00:00</div>
<div id="date"></div>
</div>

</div>

</header>


<div class="marquee">
<span id="run">
🎵 Selamat datang di Sedatur Music Hub 🎧
</span>
</div>


<div class="box">

<div class="card">

<div class="vinyl" id="vinyl">
<img id="cover" src="logo.png">
</div>


<h2 id="title">
Sedatur Music Hub
</h2>

<div class="artist" id="artist">
Pilih Lagu
</div>


<div id="status">
⏸ Belum diputar
</div>


<input id="seek" type="range">


<div>
<span id="cur">00:00</span>
/
<span id="dur">00:00</span>
</div>


<div class="controls">

<button id="prev">⏮</button>
<button id="play" class="play">▶</button>
<button id="next">⏭</button>
<button id="shuffle">🔀</button>
<button id="repeat">🔁</button>

</div>


<input id="vol" type="range" min="0" max="1" step="0.01">


<select id="cat">
<option value="all">
🎤 Semua Artis
</option>
</select>


<div class="playlist" id="list"></div>

</div>

</div>


<audio id="audio"></audio>
  <script>

const audio=document.getElementById("audio");
const vinyl=document.getElementById("vinyl");
const cover=document.getElementById("cover");

const title=document.getElementById("title");
const artist=document.getElementById("artist");
const status=document.getElementById("status");

const play=document.getElementById("play");
const prev=document.getElementById("prev");
const next=document.getElementById("next");

const shuffle=document.getElementById("shuffle");
const repeat=document.getElementById("repeat");

const seek=document.getElementById("seek");
const vol=document.getElementById("vol");

const cur=document.getElementById("cur");
const dur=document.getElementById("dur");

const list=document.getElementById("list");
const cat=document.getElementById("cat");

const run=document.getElementById("run");


let songs=[];
let index=0;

let shuf=false;
let rep=false;



// JAM

function clock(){

let d=new Date();

document.getElementById("time")
.textContent=d.toLocaleTimeString("id-ID");

document.getElementById("date")
.textContent=d.toLocaleDateString(
"id-ID",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
);

}

clock();
setInterval(clock,1000);




// LOAD JSON

fetch("playlist.json")
.then(x=>x.json())
.then(data=>{

songs=data;

buatKategori();

tampil();

restore();

});




// KATEGORI

function buatKategori(){

[...new Set(
songs.map(x=>x.category)
)]
.forEach(c=>{

let o=document.createElement("option");

o.value=c;

o.textContent="🎤 "+c;

cat.appendChild(o);

});

}


cat.onchange=tampil;




// LIST

function tampil(){

list.innerHTML="";


songs.forEach((s,i)=>{

if(
cat.value!="all" &&
s.category!=cat.value
)return;


let div=document.createElement("div");

div.className="song";


div.innerHTML=`

<img src="${s.cover}">

<div>
<b>${s.title}</b>
<br>
<small>${s.artist}</small>
</div>

`;


div.onclick=()=>{

index=i;

load();

playSong();

};


list.appendChild(div);


});


}




// LOAD LAGU

function load(){

let s=songs[index];

if(!s)return;


audio.src=s.file;

cover.src=s.cover;

title.textContent=s.title;

artist.textContent=s.artist;


run.textContent=
"🎵 Sedang Diputar • "+
s.title+
" • "+
s.artist+
" 🎧";


localStorage.song=index;

media();

}




// PLAY

function playSong(){

audio.play();

play.textContent="⏸";

status.textContent="🟢 Sedang Diputar";

vinyl.classList.add("spin");

}


function pauseSong(){

audio.pause();

play.textContent="▶";

status.textContent="⏸ Dijeda";

vinyl.classList.remove("spin");

}


play.onclick=()=>{

audio.paused?
playSong():
pauseSong();

};




// NEXT

next.onclick=()=>{

if(shuf){

index=Math.floor(
Math.random()*songs.length
);

}else{

index++;

if(index>=songs.length)
index=0;

}


load();

playSong();

};



// PREV

prev.onclick=()=>{

index--;

if(index<0)
index=songs.length-1;

load();

playSong();

};




// SHUFFLE

shuffle.onclick=()=>{

shuf=!shuf;

shuffle.style.background=
shuf?"#22c55e":"#334155";

localStorage.shuf=shuf;

};




// REPEAT

repeat.onclick=()=>{

rep=!rep;

repeat.style.background=
rep?"#22c55e":"#334155";

localStorage.rep=rep;

};




// AUTO

audio.onended=()=>{

if(rep){

audio.currentTime=0;

playSong();

}else{

next.click();

}

};




// SEEK

audio.onloadedmetadata=()=>{

seek.max=audio.duration;

dur.textContent=format(audio.duration);

};


audio.ontimeupdate=()=>{

seek.value=audio.currentTime;

cur.textContent=format(audio.currentTime);

localStorage.pos=audio.currentTime;

};


seek.oninput=()=>{

audio.currentTime=seek.value;

};




// VOLUME

vol.value=
localStorage.vol || 1;

audio.volume=vol.value;


vol.oninput=()=>{

audio.volume=vol.value;

localStorage.vol=vol.value;

};




// FORMAT

function format(s){

if(isNaN(s))return"00:00";

let m=Math.floor(s/60);

let d=Math.floor(s%60);

return String(m).padStart(2,"0")
+":"+
String(d).padStart(2,"0");

}




// RESTORE

function restore(){

index=
Number(localStorage.song)||0;

shuf=
localStorage.shuf=="true";

rep=
localStorage.rep=="true";

load();

}




// MEDIA ANDROID

function media(){

if(!("mediaSession" in navigator))
return;


navigator.mediaSession.metadata=
new MediaMetadata({

title:title.textContent,

artist:artist.textContent,

album:"Sedatur Music Hub",

artwork:[
{
src:cover.src,
sizes:"512x512"
}
]

});


navigator.mediaSession.setActionHandler(
"play",
playSong
);


navigator.mediaSession.setActionHandler(
"pause",
pauseSong
);


navigator.mediaSession.setActionHandler(
"nexttrack",
()=>next.click()
);


navigator.mediaSession.setActionHandler(
"previoustrack",
()=>prev.click()
);


}


</script>

</body>
</html>
