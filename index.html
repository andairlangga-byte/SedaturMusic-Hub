<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Sedatur Music Hub</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

margin:0;
min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:#0f172a;

color:white;

padding:20px;

}


.player{

width:100%;
max-width:400px;

background:#1e293b;

padding:25px;

border-radius:25px;

text-align:center;

}


.logo{

width:220px;
height:220px;

border-radius:20px;

object-fit:cover;

}



h1{

font-size:25px;

margin:20px 0 5px;

}


#artist{

color:#94a3b8;

}



audio{

width:100%;

margin-top:20px;

}



button{

border:0;

background:#facc15;

padding:12px 20px;

margin:15px 5px 0;

border-radius:30px;

font-size:20px;

cursor:pointer;

}



</style>


</head>


<body>


<div class="player">


<img id="cover" class="logo" src="logo.png">


<h1 id="title">
Loading...
</h1>


<p id="artist">
Sedatur Music
</p>



<audio id="audio" controls></audio>



<div>

<button onclick="prev()">⏮</button>

<button onclick="next()">⏭</button>

</div>



</div>



<script>


let playlist=[];

let index=0;


const audio=document.getElementById("audio");

const title=document.getElementById("title");

const artist=document.getElementById("artist");

const cover=document.getElementById("cover");




// LOAD JSON

fetch("playlist.json")

.then(res=>res.json())

.then(data=>{

playlist=data;

loadSong();

});





function loadSong(){


let song=playlist[index];


audio.src=song.file;


title.innerHTML=song.title;


artist.innerHTML=song.artist;


cover.src=song.cover;


setMedia();


}






function next(){


index++;


if(index>=playlist.length){

index=0;

}


loadSong();

audio.play();


}




function prev(){


index--;


if(index<0){

index=playlist.length-1;

}


loadSong();

audio.play();


}



audio.onended=function(){

next();

};





// ==========================
// BACKGROUND CONTROL
// ==========================


function setMedia(){


if("mediaSession" in navigator){


navigator.mediaSession.metadata = new MediaMetadata({

title:playlist[index].title,

artist:playlist[index].artist,

album:"Sedatur Music Hub",

artwork:[

{

src:playlist[index].cover,

sizes:"512x512",

type:"image/png"

}

]

});





navigator.mediaSession.setActionHandler(
"nexttrack",
()=>{

next();

});


navigator.mediaSession.setActionHandler(
"previoustrack",
()=>{

prev();

});


}


}



</script>


</body>

</html>
