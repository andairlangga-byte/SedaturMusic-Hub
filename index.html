<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sedatur Music Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080808;
  color:#fff;
  min-height:100vh;
}

header{
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #222;
  position:sticky;
  top:0;
  background:#080808ee;
  backdrop-filter:blur(12px);
  z-index:10;
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.home{
  text-decoration:none;
  color:#fff;
  background:#191919;
  padding:9px 14px;
  border-radius:20px;
}

.container{
  width:min(900px,94%);
  margin:auto;
  padding:25px 0 40px;
}

.hero{
  text-align:center;
  padding:15px 0 25px;
}

.hero h1{
  font-size:28px;
  margin-bottom:8px;
}

.hero p{
  color:#aaa;
}

.player{
  background:linear-gradient(145deg,#171717,#0e0e0e);
  border:1px solid #292929;
  border-radius:24px;
  padding:22px;
  box-shadow:0 15px 50px #0008;
}

.cover-box{
  display:flex;
  justify-content:center;
  margin-bottom:18px;
}

#vinyl{
  width:190px;
  height:190px;
  border-radius:50%;
  overflow:hidden;
  border:6px solid #222;
  box-shadow:0 10px 30px #000;
}

#cover{
  width:100%;
  height:100%;
  object-fit:cover;
}

.spin{
  animation:spin 5s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.song-info{
  text-align:center;
  margin-bottom:20px;
}

.song-info h2{
  font-size:21px;
  margin-bottom:5px;
}

.song-info p{
  color:#aaa;
}

#status{
  display:block;
  margin-top:8px;
  font-size:13px;
  color:#888;
}

.progress{
  display:flex;
  align-items:center;
  gap:8px;
}

input[type="range"]{
  width:100%;
  accent-color:#fff;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin:18px 0;
}

.controls button,
.tool button{
  border:0;
  background:#222;
  color:#fff;
  width:42px;
  height:42px;
  border-radius:50%;
  cursor:pointer;
  font-size:17px;
}

.controls button:hover,
.tool button:hover{
  background:#333;
}

.controls .main{
  width:58px;
  height:58px;
  font-size:22px;
  background:#fff;
  color:#000;
}

.controls button.active{
  background:#fff;
  color:#000;
}

.tools{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.tool{
  display:flex;
  align-items:center;
  gap:8px;
  background:#171717;
  padding:10px;
  border-radius:14px;
}

.tool span{
  font-size:13px;
  color:#aaa;
}

#sleepSelect{
  flex:1;
  background:#222;
  color:#fff;
  border:0;
  padding:8px;
  border-radius:8px;
}

#sleepCountdown{
  display:none;
  color:#aaa;
  font-size:12px;
  margin-top:5px;
}

.video-box{
  display:none;
  margin-top:18px;
}

.video-box.active{
  display:block;
}

#lyricsVideo{
  width:100%;
  max-height:400px;
  border-radius:16px;
  background:#000;
}

.search-area{
  margin-top:22px;
}

#search,
#category{
  width:100%;
  padding:13px;
  margin-bottom:10px;
  background:#151515;
  color:#fff;
  border:1px solid #292929;
  border-radius:12px;
  outline:none;
}

.playlist{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.song{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px;
  background:#141414;
  border:1px solid #222;
  border-radius:13px;
  cursor:pointer;
}

.song:hover{
  background:#1d1d1d;
}

.song.active{
  border-color:#fff;
}

.song-info-list{
  min-width:0;
}

.song-title{
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.song-artist{
  color:#888;
  font-size:12px;
  margin-top:3px;
}

.fav{
  background:none;
  border:0;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:20px;
}

.stat{
  background:#141414;
  border:1px solid #222;
  border-radius:14px;
  padding:14px 5px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:18px;
}

.stat span{
  color:#888;
  font-size:11px;
}

.marquee{
  overflow:hidden;
  white-space:nowrap;
  margin:15px 0;
  color:#777;
  font-size:12px;
}

#marqueeText{
  display:inline-block;
  animation:marquee 15s linear infinite;
}

@keyframes marquee{
  from{transform:translateX(100%)}
  to{transform:translateX(-100%)}
}

.empty{
  text-align:center;
  padding:25px;
  color:#777;
}

@media(max-width:600px){
  .tools{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  #vinyl{
    width:160px;
    height:160px;
  }

  .controls{
    gap:6px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo"> Sedatur Music Hub</div>
  <a class="home" href="../"> Home</a>
</header>

<main class="container">

<section class="hero">
  <h1> Sedatur Music Hub</h1>
  <p>Selamat datang di Sedatur Music Hub </p>
</section>

<section class="player">

  <div class="cover-box">
    <div id="vinyl">
      <img id="cover" src="logo.png" alt="Cover">
    </div>
  </div>

  <div class="song-info">
    <h2 id="title">Sedatur Music Hub</h2>
    <p id="artist">Pilih Lagu</p>
    <span id="status"> Belum diputar</span>
  </div>

  <div class="marquee">
    <span id="marqueeText"> Sedatur Music Hub</span>
  </div>

  <div class="progress">
    <span id="current">00:00</span>
    <input id="seek" type="range" min="0" max="100" value="0">
    <span id="duration">00:00</span>
  </div>

  <div class="controls">
    <button id="prev" title="Sebelumnya"></button>
    <button id="play" class="main" title="Play"></button>
    <button id="next" title="Berikutnya"></button>
    <button id="shuffle" title="Acak"></button>
    <button id="repeat" title="Ulangi"></button>
  </div>

  <div class="tools">

    <div class="tool">
      <button id="videoBtn"></button>
      <span>Lirik Video</span>
    </div>

    <div class="tool">
      <span> Volume</span>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="1">
    </div>

    <div class="tool">
      <span> Waktu Tidur</span>
      <select id="sleepSelect">
        <option value="0">Tidak aktif</option>
        <option value="5">5 menit</option>
        <option value="10">10 menit</option>
        <option value="15">15 menit</option>
        <option value="30">30 menit</option>
        <option value="60">60 menit</option>
      </select>
    </div>

  </div>

  <div id="sleepCountdown"></div>

  <div id="videoBox" class="video-box">
    <video id="lyricsVideo" playsinline muted></video>
  </div>

</section>

<section class="search-area">

  <input
    id="search"
    type="search"
    placeholder=" Cari lagu atau artis..."
  >

  <select id="category">
    <option value="all"> Semua Artis</option>
  </select>

  <div id="playlist" class="playlist">
    <div class="empty">Memuat playlist...</div>
  </div>

</section>

<section class="stats">

  <div class="stat">
    <strong id="statSongs">0</strong>
    <span>Lagu</span>
  </div>

  <div class="stat">
    <strong id="statPlays">0</strong>
    <span>Diputar</span>
  </div>

  <div class="stat">
    <strong id="statFav">0</strong>
    <span>Favorit</span>
  </div>

  <div class="stat">
    <strong id="statTime">0m</strong>
    <span>Waktu</span>
  </div>

</section>

</main>

<audio id="audio" preload="metadata"></audio>

<script>

/* =====================================================
   SEDATUR MUSIC HUB
   PART 2 DITARUH DI BAWAH INI
===================================================== */


/*  JANGAN HAPUS TANDA INI  */


/* =====================================================
   AKHIR PART 1
    TARUH PART 2 TEPAT DI BAWAH TANDA INI
   /* =====================================================
   SEDATUR MUSIC HUB — PART 2
   PLAYLIST + AUDIO PLAYER + VIDEO
===================================================== */

const audio = document.getElementById("audio");
const vinyl = document.getElementById("vinyl");
const cover = document.getElementById("cover");
const title = document.getElementById("title");
const artist = document.getElementById("artist");
const status = document.getElementById("status");

const playBtn = document.getElementById("play");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const shuffleBtn = document.getElementById("shuffle");
const repeatBtn = document.getElementById("repeat");

const seek = document.getElementById("seek");
const volume = document.getElementById("volume");

const currentTime = document.getElementById("current");
const duration = document.getElementById("duration");

const playlist = document.getElementById("playlist");
const search = document.getElementById("search");
const category = document.getElementById("category");

const videoBtn = document.getElementById("videoBtn");
const lyricsVideo = document.getElementById("lyricsVideo");
const videoBox = document.getElementById("videoBox");

const marqueeText = document.getElementById("marqueeText");

let songs = [];
let currentIndex = 0;
let shuffleMode = false;
let repeatMode = false;


/* =====================================================
   JAM REALTIME
===================================================== */

function updateClock(){

  const now = new Date();

  const time = document.getElementById("time");
  const date = document.getElementById("date");

  if(time){
    time.textContent = now.toLocaleTimeString(
      "id-ID",
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      }
    );
  }

  if(date){
    date.textContent = now.toLocaleDateString(
      "id-ID",
      {
        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );
  }

}

updateClock();
setInterval(updateClock,1000);


/* =====================================================
   FORMAT WAKTU
===================================================== */

function formatTime(seconds){

  if(!isFinite(seconds) || seconds < 0){
    return "00:00";
  }

  const min = Math.floor(seconds / 60);
  const sec = Math.floor(seconds % 60);

  return String(min).padStart(2,"0") +
         ":" +
         String(sec).padStart(2,"0");

}


/* =====================================================
   AMANKAN TEXT
===================================================== */

function safeText(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   FAVORITE
===================================================== */

function getFavorites(){

  try{

    return JSON.parse(
      localStorage.getItem("sedatur_favorites") || "[]"
    );

  }catch{

    return [];

  }

}


function isFavorite(index){

  return getFavorites().includes(index);

}


function toggleFavorite(index){

  let favorites = getFavorites();

  if(favorites.includes(index)){

    favorites = favorites.filter(
      i => i !== index
    );

  }else{

    favorites.push(index);

  }

  localStorage.setItem(
    "sedatur_favorites",
    JSON.stringify(favorites)
  );

  renderPlaylist();
  updateStats();

}


/* =====================================================
   KATEGORI ARTIS
===================================================== */

function createCategories(){

  category.innerHTML =
    `<option value="all"> Semua Artis</option>`;

  const categories = [
    ...new Set(
      songs
        .map(song => song.category || song.artist)
        .filter(Boolean)
    )
  ];

  categories.forEach(name => {

    const option =
      document.createElement("option");

    option.value = name;
    option.textContent = " " + name;

    category.appendChild(option);

  });

}


/* =====================================================
   RENDER PLAYLIST
===================================================== */

function renderPlaylist(){

  playlist.innerHTML = "";

  const keyword =
    search.value.trim().toLowerCase();

  let count = 0;

  songs.forEach((song,index)=>{

    const songText = (
      (song.title || "") + " " +
      (song.artist || "") + " " +
      (song.category || "")
    ).toLowerCase();

    if(
      category.value !== "all" &&
      song.category !== category.value &&
      song.artist !== category.value
    ){
      return;
    }

    if(
      keyword &&
      !songText.includes(keyword)
    ){
      return;
    }

    count++;

    const item =
      document.createElement("div");

    item.className = "song";

    if(index === currentIndex){
      item.classList.add("active");
    }

    const favorite =
      isFavorite(index);

    item.innerHTML = `

      <div class="song-info-list">

        <div class="song-title">
          ${safeText(song.title || "Tanpa Judul")}
        </div>

        <div class="song-artist">
          ${safeText(song.artist || "Unknown Artist")}
        </div>

      </div>

      <button class="fav" aria-label="Favorit">
        ${favorite ? "" : ""}
      </button>

    `;

    item.onclick = ()=>{

      currentIndex = index;

      loadSong(true);

    };

    item.querySelector(".fav").onclick =
      event => {

        event.stopPropagation();

        toggleFavorite(index);

      };

    playlist.appendChild(item);

  });


  if(count === 0){

    playlist.innerHTML = `
      <div class="empty">
         Lagu tidak ditemukan
      </div>
    `;

  }

}


/* =====================================================
   SEARCH + FILTER
===================================================== */

search.addEventListener(
  "input",
  renderPlaylist
);

category.addEventListener(
  "change",
  renderPlaylist
);


/* =====================================================
   LOAD PLAYLIST.JSON
===================================================== */

async function loadPlaylist(){

  try{

    const response =
      await fetch("./playlist.json");

    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );

    }

    const data =
      await response.json();

    if(!Array.isArray(data)){

      throw new Error(
        "playlist.json harus berupa array"
      );

    }

    songs = data;

    if(!songs.length){

      playlist.innerHTML = `
        <div class="empty">
           Playlist masih kosong
        </div>
      `;

      updateStats();

      return;

    }


    /* Restore lagu terakhir */

    const savedSong =
      Number(
        localStorage.getItem("sedatur_song")
      );

    if(
      Number.isInteger(savedSong) &&
      savedSong >= 0 &&
      savedSong < songs.length
    ){

      currentIndex = savedSong;

    }


    createCategories();
    renderPlaylist();
    loadSong(false);
    updateStats();

  }catch(error){

    console.error(
      "Playlist Error:",
      error
    );

    playlist.innerHTML = `
      <div class="empty">
         playlist.json tidak terbaca<br><br>
        Pastikan playlist.json berada<br>
        satu folder dengan index.html
      </div>
    `;

  }

}


/* =====================================================
   LOAD LAGU
===================================================== */

function loadSong(autoplay = false){

  if(!songs.length) return;

  const song =
    songs[currentIndex];

  if(!song) return;

  audio.pause();

  audio.src =
    song.file || "";

  audio.load();


  /* Reset video */

  stopVideo();


  /* Cover */

  cover.src =
    song.cover || "logo.png";

  cover.onerror = ()=>{

    cover.onerror = null;

    cover.src = "logo.png";

  };


  /* Informasi */

  title.textContent =
    song.title || "Tanpa Judul";

  artist.textContent =
    song.artist || "Unknown Artist";

  marqueeText.textContent =
    " " +
    (song.title || "") +
    " • " +
    (song.artist || "") +
    " •  Sedatur Music Hub";


  status.textContent =
    " Siap diputar";


  /* Progress */

  seek.value = 0;

  currentTime.textContent =
    "00:00";

  duration.textContent =
    "00:00";


  /* Video */

  if(
    song.lyricsVideo &&
    String(song.lyricsVideo).trim()
  ){

    videoBtn.disabled = false;
    videoBtn.textContent =
      " Lirik Video";

  }else{

    videoBtn.disabled = true;
    videoBtn.textContent =
      " Tidak Tersedia";

  }


  localStorage.setItem(
    "sedatur_song",
    currentIndex
  );


  renderPlaylist();


  if(autoplay){

    playAudio();

  }

}


/* =====================================================
   PLAY / PAUSE
===================================================== */

function playAudio(){

  audio.play()
    .catch(error => {

      console.log(
        "Play diblokir:",
        error
      );

      status.textContent =
        " Tekan Play untuk memutar";

    });

}


function pauseAudio(){

  audio.pause();

}


playBtn.onclick = ()=>{

  if(!audio.src){

    loadSong(false);

  }

  if(audio.paused){

    playAudio();

  }else{

    pauseAudio();

  }

};


/* =====================================================
   AUDIO PLAY
===================================================== */

audio.addEventListener(
  "play",
  ()=>{

    playBtn.textContent = "";

    status.textContent =
      " Sedang Diputar";

    vinyl.classList.add("spin");

  }
);


/* =====================================================
   AUDIO PAUSE
===================================================== */

audio.addEventListener(
  "pause",
  ()=>{

    playBtn.textContent = "";

    vinyl.classList.remove("spin");

    if(!audio.ended){

      status.textContent =
        " Dijeda";

    }

  }
);


/* =====================================================
   METADATA
===================================================== */

audio.addEventListener(
  "loadedmetadata",
  ()=>{

    if(isFinite(audio.duration)){

      seek.max =
        audio.duration;

      duration.textContent =
        formatTime(audio.duration);

    }

  }
);


/* =====================================================
   PROGRESS
===================================================== */

audio.addEventListener(
  "timeupdate",
  ()=>{

    if(!isFinite(audio.duration))
      return;

    seek.max =
      audio.duration;

    seek.value =
      audio.currentTime;

    currentTime.textContent =
      formatTime(audio.currentTime);

    duration.textContent =
      formatTime(audio.duration);

  }
);


/* =====================================================
   SEEK
===================================================== */

seek.addEventListener(
  "input",
  ()=>{

    audio.currentTime =
      Number(seek.value);

  }
);


/* =====================================================
   VOLUME
===================================================== */

volume.addEventListener(
  "input",
  ()=>{

    audio.volume =
      Number(volume.value);

    localStorage.setItem(
      "sedatur_volume",
      volume.value
    );

  }
);


/* =====================================================
   NEXT
===================================================== */

function nextSong(){

  if(!songs.length) return;


  if(shuffleMode){

    if(songs.length === 1){

      currentIndex = 0;

    }else{

      let next;

      do{

        next =
          Math.floor(
            Math.random() * songs.length
          );

      }while(
        next === currentIndex
      );

      currentIndex = next;

    }

  }else{

    currentIndex++;

    if(
      currentIndex >= songs.length
    ){

      currentIndex = 0;

    }

  }

  loadSong(true);

}


nextBtn.onclick =
  nextSong;


/* =====================================================
   PREVIOUS
===================================================== */

function previousSong(){

  if(!songs.length) return;


  if(audio.currentTime > 5){

    audio.currentTime = 0;

    return;

  }


  currentIndex--;

  if(currentIndex < 0){

    currentIndex =
      songs.length - 1;

  }

  loadSong(true);

}


prevBtn.onclick =
  previousSong;


/* =====================================================
   SHUFFLE
===================================================== */

shuffleBtn.onclick = ()=>{

  shuffleMode =
    !shuffleMode;

  shuffleBtn.classList.toggle(
    "active",
    shuffleMode
  );

  localStorage.setItem(
    "sedatur_shuffle",
    shuffleMode
  );

};


/* =====================================================
   REPEAT
===================================================== */

repeatBtn.onclick = ()=>{

  repeatMode =
    !repeatMode;

  repeatBtn.classList.toggle(
    "active",
    repeatMode
  );

  localStorage.setItem(
    "sedatur_repeat",
    repeatMode
  );

};


/* =====================================================
   LAGU SELESAI
===================================================== */

audio.addEventListener(
  "ended",
  ()=>{

    if(repeatMode){

      audio.currentTime = 0;

      playAudio();

    }else{

      nextSong();

    }

  }
);


/* =====================================================
   VIDEO LIRIK
===================================================== */

function stopVideo(){

  lyricsVideo.pause();

  lyricsVideo.removeAttribute(
    "src"
  );

  lyricsVideo.load();

  videoBox.classList.remove(
    "active"
  );

  vinyl.style.display =
    "flex";

  videoBtn.textContent =
    " Lirik Video";

}


videoBtn.onclick = ()=>{

  if(!songs.length) return;

  const song =
    songs[currentIndex];


  if(
    !song.lyricsVideo ||
    !String(song.lyricsVideo).trim()
  ){

    return;

  }


  /* Video tidak mengeluarkan suara */

  lyricsVideo.muted = true;

  lyricsVideo.volume = 0;

  lyricsVideo.src =
    song.lyricsVideo;

  lyricsVideo.load();


  vinyl.style.display =
    "none";

  videoBox.classList.add(
    "active"
  );

  videoBtn.textContent =
    " Tutup Video";


  lyricsVideo.currentTime =
    audio.currentTime || 0;


  if(!audio.paused){

    lyricsVideo.play()
      .catch(()=>{});

  }

};


/* =====================================================
   SINKRON VIDEO
===================================================== */

audio.addEventListener(
  "timeupdate",
  ()=>{

    if(
      !videoBox.classList.contains(
        "active"
      )
    ){

      return;

    }

    if(!lyricsVideo.readyState)
      return;


    const difference =
      Math.abs(
        lyricsVideo.currentTime -
        audio.currentTime
      );


    if(difference > 0.35){

      try{

        lyricsVideo.currentTime =
          audio.currentTime;

      }catch{}

    }

  }
);

if(savedVolume !== null){

   START

/* =====================================================
   MEDIA SESSION
   Kontrol layar kunci / notifikasi media
===================================================== */

function updateMediaSession(){

  if(!("mediaSession" in navigator))
    return;

  if(!songs.length)
    return;

  const song =
    songs[currentIndex];

  if(!song)
    return;


  try{

    navigator.mediaSession.metadata =
      new MediaMetadata({

        title:
          song.title ||
          "Sedatur Music Hub",

        artist:
          song.artist ||
          "Unknown Artist",

        album:
          "Sedatur Music Hub",

        artwork:[
          {
            src:
              song.cover ||
              "logo.png",

            sizes:
              "512x512",

            type:
              "image/png"
          }
        ]

      });

  }catch(error){

    console.log(
      "Media Session:",
      error
    );

  }

}


/* =====================================================
   MEDIA SESSION ACTION
===================================================== */

function setupMediaSession(){

  if(!("mediaSession" in navigator))
    return;


  try{

    navigator.mediaSession.setActionHandler(
      "play",
      ()=>{
        playAudio();
      }
    );

  }catch{}


  try{

    navigator.mediaSession.setActionHandler(
      "pause",
      ()=>{
        pauseAudio();
      }
    );

  }catch{}


  try{

    navigator.mediaSession.setActionHandler(
      "previoustrack",
      ()=>{
        previousSong();
      }
    );

  }catch{}


  try{

    navigator.mediaSession.setActionHandler(
      "nexttrack",
      ()=>{
        nextSong();
      }
    );

  }catch{}


  try{

    navigator.mediaSession.setActionHandler(
      "seekbackward",
      details => {

        const offset =
          details.seekOffset || 10;

        audio.currentTime =
          Math.max(
            0,
            audio.currentTime - offset
          );

      }
    );

  }catch{}


  try{

    navigator.mediaSession.setActionHandler(
      "seekforward",
      details => {

        const offset =
          details.seekOffset || 10;

        audio.currentTime =
          Math.min(
            audio.duration || Infinity,
            audio.currentTime + offset
          );

      }
    );

  }catch{}


  try{

    navigator.mediaSession.setActionHandler(
      "stop",
      ()=>{

        pauseAudio();

        audio.currentTime = 0;

      }
    );

  }catch{}

}


/* =====================================================
   UPDATE MEDIA SESSION SAAT LAGU BERUBAH
===================================================== */

const originalLoadSong =
  loadSong;

loadSong = function(autoplay = false){

  originalLoadSong(autoplay);

  updateMediaSession();

};


/* =====================================================
   UPDATE SAAT AUDIO MULAI
===================================================== */

audio.addEventListener(
  "play",
  ()=>{

    updateMediaSession();

  }
);


/* =====================================================
   SETUP MEDIA SESSION
===================================================== */

setupMediaSession();


/* =====================================================
   SLEEP TIMER
===================================================== */

let sleepTimer = null;
let sleepEnd = 0;

const sleepSelect =
  document.getElementById(
    "sleepSelect"
  );

const sleepCountdown =
  document.getElementById(
    "sleepCountdown"
  );


sleepSelect.addEventListener(
  "change",
  ()=>{

    clearInterval(
      sleepTimer
    );

    sleepTimer = null;
    sleepEnd = 0;


    const minutes =
      Number(
        sleepSelect.value
      );


    if(!minutes){

      sleepCountdown.style.display =
        "none";

      return;

    }


    sleepEnd =
      Date.now() +
      minutes * 60 * 1000;


    sleepCountdown.style.display =
      "block";


    sleepTimer =
      setInterval(
        updateSleep,
        1000
      );


    updateSleep();

  }
);


/* =====================================================
   UPDATE SLEEP TIMER
===================================================== */

function updateSleep(){

  const remaining =
    sleepEnd - Date.now();


  if(remaining <= 0){

    clearInterval(
      sleepTimer
    );

    sleepTimer = null;
    sleepEnd = 0;


    sleepSelect.value = "0";


    sleepCountdown.style.display =
      "none";


    pauseAudio();


    stopVideo();


    status.textContent =
      " Waktu tidur selesai";


    return;

  }


  const totalSeconds =
    Math.ceil(
      remaining / 1000
    );


  const minutes =
    Math.floor(
      totalSeconds / 60
    );


  const seconds =
    totalSeconds % 60;


  sleepCountdown.textContent =
    " Berhenti dalam " +
    minutes +
    ":" +
    String(seconds)
      .padStart(2,"0");

}


/* =====================================================
   STATISTIK
===================================================== */

let totalPlays =
  Number(
    localStorage.getItem(
      "sedatur_plays"
    ) || 0
  );


let totalSeconds =
  Number(
    localStorage.getItem(
      "sedatur_time"
    ) || 0
  );


function updateStats(){

  const favorites =
    getFavorites();


  document.getElementById(
    "statSongs"
  ).textContent =
    songs.length;


  document.getElementById(
    "statPlays"
  ).textContent =
    totalPlays;


  document.getElementById(
    "statFav"
  ).textContent =
    favorites.length;


  const minutes =
    Math.floor(
      totalSeconds / 60
    );


  document.getElementById(
    "statTime"
  ).textContent =
    minutes + "m";

}


updateStats();


/* =====================================================
   HITUNG PLAY
===================================================== */

let lastPlayedSong = -1;


audio.addEventListener(
  "play",
  ()=>{

    if(
      currentIndex !== lastPlayedSong
    ){

      totalPlays++;

      lastPlayedSong =
        currentIndex;


      localStorage.setItem(
        "sedatur_plays",
        totalPlays
      );


      updateStats();

    }

  }
);


/* =====================================================
   HITUNG WAKTU DENGAR
===================================================== */

setInterval(
  ()=>{

    if(
      !audio.paused &&
      audio.src
    ){

      totalSeconds++;


      localStorage.setItem(
        "sedatur_time",
        totalSeconds
      );


      updateStats();

    }

  },
  1000
);


/* =====================================================
   RESET HITUNG PLAY SAAT LAGU BERGANTI
===================================================== */

audio.addEventListener(
  "ended",
  ()=>{

    lastPlayedSong = -1;

  }
);


/* =====================================================
   RESTORE LAST PLAYED
===================================================== */

const savedLastSong =
  Number(
    localStorage.getItem(
      "sedatur_song"
    )
  );


if(
  Number.isInteger(savedLastSong) &&
  savedLastSong >= 0
){

  currentIndex =
    savedLastSong;

}


/* =====================================================
   UPDATE MEDIA SESSION SETELAH PLAYLIST SIAP
===================================================== */

if(songs.length){

  updateMediaSession();

}


/* =====================================================
   SELESAI — SEDATUR MUSIC HUB
===================================================== */

</script>
