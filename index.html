<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sedatur Music</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
font-family:Arial,sans-serif;
background:
linear-gradient(135deg,#050505,#172554,#064e3b);
color:white;
display:flex;
justify-content:center;
align-items:center;
}

.player{

width:95%;
max-width:430px;

background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);

border-radius:30px;

padding:25px;

box-shadow:0 20px 60px #000;

}


.header{

display:flex;
justify-content:space-between;
align-items:center;

}


.logo{

font-size:22px;
font-weight:bold;

}


.online{

color:#22c55e;
font-size:12px;

}



.cover{

width:260px;
height:260px;

display:block;
margin:25px auto;

border-radius:25px;

object-fit:cover;

background:#222;

box-shadow:0 15px 40px #000;

}



.rotate{

animation:rotate 8s linear infinite;

}


@keyframes rotate{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}



.info{

text-align:center;

}


.title{

font-size:24px;
font-weight:bold;

}


.artist{

color:#aaa;

margin-top:5px;

}



.equalizer{

display:flex;
justify-content:center;
gap:5px;

height:35px;

margin:20px;

}


.bar{

width:5px;
height:10px;

background:#22c55e;

border-radius:10px;

}



.playing .bar{

animation:eq .8s infinite alternate;

}


@keyframes eq{

from{
height:10px;
}

to{
height:35px;
}

}



input{

width:100%;

accent-color:#22c55e;

}



.time{

display:flex;
justify-content:space-between;

font-size:12px;

color:#aaa;

}



.controls{

display:flex;

justify-content:center;

gap:15px;

margin:25px 0;

}



button{

border:none;

cursor:pointer;

}


.main{

width:65px;
height:65px;

border-radius:50%;

background:#22c55e;

font-size:25px;

}


.side{

width:45px;
height:45px;

border-radius:50%;

background:#333;

color:white;

}



.search{

margin-top:15px;

padding:12px;

border-radius:15px;

border:none;

background:#ffffff15;

color:white;

}



.playlist{

margin-top:15px;

max-height:200px;

overflow:auto;

}



.song{

padding:12px;

border-radius:12px;

background:#ffffff10;

margin-bottom:5px;

cursor:pointer;

}


.active{

background:#22c55e55;

}


</style>

</head>


<body>


<div class="player">


<div class="header">

<div class="logo">
🎧 Sedatur Music
</div>

<div class="online">
● Online
</div>

</div>


<img id="cover"
class="cover"
src="https://drive.google.com/thumbnail?id=1_t_SCuzlRMn8_Y_-WZS_ahzQgMKysbyY&sz=w1000">



<div class="info">

<div id="title" class="title">
Loading...
</div>

<div id="artist" class="artist">
Sedatur
</div>

</div>



<div id="eq" class="equalizer">

<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>

</div>



<audio id="audio"></audio>


<input id="progress" type="range" value="0">


<div class="time">

<span id="current">0:00</span>

<span id="duration">0:00</span>

</div>



<div class="controls">

<button onclick="shuffle()" class="side">
🔀
</button>

<button onclick="prev()" class="side">
⏮
</button>

<button onclick="playPause()" id="play" class="main">
▶️
</button>

<button onclick="next()" class="side">
⏭
</button>

<button onclick="repeat()" id="repeat" class="side">
🔁
</button>

</div>


<input id="volume"
type="range"
min="0"
max="1"
step="0.1"
value="1">


<input id="search"
class="search"
placeholder="🔎 Cari lagu...">


<div id="playlist" class="playlist"></div>


</div>


<script>
  
const songs=[

{
title:"Dunia Yang Nanti",
artist:"Raim Laode",
cover:"https://via.placeholder.com/500",
file:"https://probable-tan-ruunsniv.edgeone.dev/Raim%20Laode%20-%20Dunia%20Yang%20Nanti%20(%20Lirik%20video%20).mp3"
},

{
title:"Ini Abadi",
artist:"Perunggu",
cover:"https://via.placeholder.com/500",
file:"https://probable-tan-ruunsniv.edgeone.dev/Perunggu%20-%20Ini%20Abadi%20(Video%20Lirik).mp3"
},

{
title:"Shape of My Heart",
artist:"Backstreet Boys",
cover:"https://via.placeholder.com/500",
file:"https://probable-tan-ruunsniv.edgeone.dev/Backstreet%20Boys%20-%20Shape%20Of%20My%20Heart%20(Official%20HD%20Video).mp3"
}

];


let index=0;
let isShuffle=false;
let isRepeat=false;


const audio=document.getElementById("audio");
const cover=document.getElementById("cover");
const title=document.getElementById("title");
const artist=document.getElementById("artist");
const playlist=document.getElementById("playlist");
const playBtn=document.getElementById("play");
const progress=document.getElementById("progress");
const volume=document.getElementById("volume");
const search=document.getElementById("search");
const eq=document.getElementById("eq");



function loadSong(){

let song=songs[index];

audio.src=song.file;

title.innerHTML=song.title;
artist.innerHTML=song.artist;

cover.src=song.cover;

renderPlaylist();

}



function playPause(){

if(audio.paused){

audio.play()
.then(()=>{

playBtn.innerHTML="⏸";

cover.classList.add("rotate");

eq.classList.add("playing");

})
.catch(()=>{

alert("Audio gagal diputar");

});


}else{


audio.pause();

playBtn.innerHTML="▶️";

cover.classList.remove("rotate");

eq.classList.remove("playing");


}

}




function next(){


if(isShuffle){

index=Math.floor(Math.random()*songs.length);


}else{


index++;


if(index>=songs.length){

index=0;

}

}


loadSong();

audio.play();


}




function prev(){

index--;

if(index<0){

index=songs.length-1;

}


loadSong();

audio.play();

}




function shuffle(){

isShuffle=!isShuffle;

alert(
isShuffle?
"Shuffle Aktif 🔀":
"Shuffle Mati"
);

}




function repeat(){

isRepeat=!isRepeat;

document.getElementById("repeat").innerHTML=

isRepeat?
"🔁✓":
"🔁";


}




audio.addEventListener("ended",()=>{


if(isRepeat){

audio.play();


}else{


next();


}


});




audio.addEventListener("timeupdate",()=>{


let value=

(audio.currentTime/audio.duration)*100;


progress.value=value || 0;



document.getElementById("current").innerHTML=
formatTime(audio.currentTime);


document.getElementById("duration").innerHTML=
formatTime(audio.duration);



});




progress.oninput=function(){

audio.currentTime=

(this.value/100)*audio.duration;

}




volume.oninput=function(){

audio.volume=this.value;

}




function formatTime(sec){

if(isNaN(sec)){

return "0:00";

}


let min=Math.floor(sec/60);

let s=Math.floor(sec%60);


if(s<10){

s="0"+s;

}


return min+":"+s;


}




function renderPlaylist(keyword=""){


playlist.innerHTML="";


songs.forEach((song,i)=>{


if(

!song.title.toLowerCase()
.includes(keyword.toLowerCase())

&&

!song.artist.toLowerCase()
.includes(keyword.toLowerCase())

){

return;

}



let item=document.createElement("div");


item.className="song";


if(i==index){

item.classList.add("active");

}



item.innerHTML=

"🎵 "+song.title+
"<br><small>"+song.artist+"</small>";



item.onclick=function(){

index=i;

loadSong();

audio.play();


};



playlist.appendChild(item);


});


}



search.oninput=function(){

renderPlaylist(this.value);

};



loadSong();



</script>


</body>
</html>
