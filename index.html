<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Sedatur Music Hub</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #222;
  position:sticky;
  top:0;
  background:#080808ee;
  backdrop-filter:blur(10px);
  z-index:10;
}

.logo{
  font-weight:bold;
}

.home{
  color:#fff;
  text-decoration:none;
  background:#1c1c1c;
  padding:8px 13px;
  border-radius:20px;
}

.container{
  width:min(800px,94%);
  margin:auto;
  padding:20px 0 40px;
}

.hero{
  text-align:center;
  padding:10px 0 20px;
}

.hero h1{
  font-size:26px;
  margin-bottom:6px;
}

.hero p{
  color:#888;
  font-size:14px;
}

.player{
  background:#141414;
  border:1px solid #252525;
  border-radius:20px;
  padding:20px;
}

.cover{
  display:flex;
  justify-content:center;
  margin-bottom:18px;
}

#cover{
  width:170px;
  height:170px;
  border-radius:50%;
  object-fit:cover;
  border:5px solid #292929;
}

.spin{
  animation:spin 5s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.info{
  text-align:center;
}

#title{
  font-size:20px;
}

#artist{
  color:#888;
  margin-top:5px;
}

.progress{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:20px;
  font-size:12px;
  color:#888;
}

input[type="range"]{
  width:100%;
  accent-color:#fff;
}

.controls{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:18px 0;
}

button{
  border:0;
  cursor:pointer;
}

.controls button{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#242424;
  color:#fff;
  font-size:17px;
}

.controls .play{
  width:56px;
  height:56px;
  background:#fff;
  color:#000;
  font-size:21px;
}

.controls button.active{
  background:#fff;
  color:#000;
}

.tools{
  display:flex;
  gap:10px;
}

.tools button{
  flex:1;
  padding:11px;
  border-radius:12px;
  background:#222;
  color:#fff;
}

.video{
  display:none;
  margin-top:15px;
}

.video.show{
  display:block;
}

#lyricsVideo{
  width:100%;
  max-height:400px;
  border-radius:14px;
  background:#000;
}

.search{
  margin-top:20px;
}

#search,
#category{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:12px;
  border:1px solid #252525;
  background:#141414;
  color:#fff;
  outline:none;
}

.playlist{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.song{
  display:flex;
  align-items:center;
  padding:12px;
  background:#141414;
  border:1px solid #222;
  border-radius:12px;
}

.song.active{
  border-color:#fff;
}

.song-main{
  flex:1;
  min-width:0;
  cursor:pointer;
}

.song-title{
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.song-artist{
  color:#777;
  font-size:12px;
  margin-top:3px;
}

.empty{
  text-align:center;
  padding:20px;
  color:#777;
}

@media(max-width:500px){

  #cover{
    width:150px;
    height:150px;
  }

}

</style>

</head>

<body>

<header>

  <div class="logo">
    🎵 Sedatur Music Hub
  </div>

  <a class="home" href="../">
    🏠 Home
  </a>

</header>


<main class="container">

<section class="hero">

  <h1>🎵 Sedatur Music Hub</h1>

  <p>Selamat datang di Sedatur Music Hub 🎧</p>

</section>


<section class="player">

  <div class="cover">

    <img
      id="cover"
      src="logo.png"
      alt="Cover"
    >

  </div>


  <div class="info">

    <h2 id="title">
      Sedatur Music Hub
    </h2>

    <p id="artist">
      Pilih lagu
    </p>

  </div>


  <div class="progress">

    <span id="current">00:00</span>

    <input
      id="seek"
      type="range"
      min="0"
      max="100"
      value="0"
    >

    <span id="duration">00:00</span>

  </div>


  <div class="controls">

    <button id="prev">⏮</button>

    <button id="play" class="play">▶</button>

    <button id="next">⏭</button>

    <button id="shuffle">🔀</button>

    <button id="repeat">🔁</button>

  </div>


  <div class="tools">

    <button id="videoBtn">
      🎬 Lirik Video
    </button>

  </div>


  <div id="videoBox" class="video">

    <video
      id="lyricsVideo"
      muted
      playsinline
      controls
    ></video>

  </div>

</section>


<section class="search">

  <input
    id="search"
    type="search"
    placeholder="🔎 Cari lagu atau artis..."
  >

  <select id="category">

    <option value="all">
      🎤 Semua Artis
    </option>

  </select>

</section>


<section id="playlist" class="playlist">

  <div class="empty">
    Memuat lagu...
  </div>

</section>

</main>


<audio id="audio" preload="metadata"></audio>


<script>

const audio =
  document.getElementById("audio");

const cover =
  document.getElementById("cover");

const title =
  document.getElementById("title");

const artist =
  document.getElementById("artist");

const playBtn =
  document.getElementById("play");

const prevBtn =
  document.getElementById("prev");

const nextBtn =
  document.getElementById("next");

const shuffleBtn =
  document.getElementById("shuffle");

const repeatBtn =
  document.getElementById("repeat");

const seek =
  document.getElementById("seek");

const current =
  document.getElementById("current");

const duration =
  document.getElementById("duration");

const playlist =
  document.getElementById("playlist");

const search =
  document.getElementById("search");

const category =
  document.getElementById("category");

const videoBtn =
  document.getElementById("videoBtn");

const videoBox =
  document.getElementById("videoBox");

const lyricsVideo =
  document.getElementById("lyricsVideo");


let songs = [];

let currentIndex = 0;

let shuffle = false;

let repeat = false;


/* FORMAT WAKTU */

function time(sec){

  if(!isFinite(sec)){
    return "00:00";
  }

  const m =
    Math.floor(sec / 60);

  const s =
    Math.floor(sec % 60);

  return String(m).padStart(2,"0")
    + ":" +
    String(s).padStart(2,"0");

}


/* LOAD LAGU */

function loadSong(){

  const song =
    songs[currentIndex];

  if(!song){
    return;
  }

  audio.src =
    song.file;

  title.textContent =
    song.title;

  artist.textContent =
    song.artist;

  cover.src =
    song.cover || "logo.png";

  current.textContent =
    "00:00";

  duration.textContent =
    "00:00";

  seek.value = 0;

  renderPlaylist();

  updateMediaSession();

}

/* PLAY */

function playSong(){

  audio.play()
    .catch(error=>{
      console.log("Gagal memutar:",error);
    });

}


/* PAUSE */

function pauseSong(){

  audio.pause();

}


/* PLAY / PAUSE */

playBtn.onclick = ()=>{

  if(audio.paused){

    playSong();

  }else{

    pauseSong();

  }

};


/* NEXT */

function nextSong(){

  if(!songs.length){
    return;
  }

  if(shuffle){

    let next;

    do{

      next =
        Math.floor(
          Math.random() *
          songs.length
        );

    }while(
      songs.length > 1 &&
      next === currentIndex
    );

    currentIndex = next;

  }else{

    currentIndex++;

    if(currentIndex >= songs.length){
      currentIndex = 0;
    }

  }

  loadSong();

  playSong();

}

nextBtn.onclick =
  nextSong;


/* PREVIOUS */

prevBtn.onclick = ()=>{

  if(!songs.length){
    return;
  }

  currentIndex--;

  if(currentIndex < 0){
    currentIndex =
      songs.length - 1;
  }

  loadSong();

  playSong();

};


/* SHUFFLE */

shuffleBtn.onclick = ()=>{

  shuffle =
    !shuffle;

  shuffleBtn.classList.toggle(
    "active",
    shuffle
  );

};


/* REPEAT */

repeatBtn.onclick = ()=>{

  repeat =
    !repeat;

  repeatBtn.classList.toggle(
    "active",
    repeat
  );

};


/* AUDIO */

audio.addEventListener(
  "loadedmetadata",
  ()=>{

    duration.textContent =
      time(audio.duration);

  }
);


audio.addEventListener(
  "timeupdate",
  ()=>{

    if(!audio.duration){
      return;
    }

    seek.value =
      audio.currentTime /
      audio.duration * 100;

    current.textContent =
      time(audio.currentTime);

  }
);


audio.addEventListener(
  "play",
  ()=>{

    playBtn.textContent =
      "⏸";

    cover.classList.add(
      "spin"
    );

  }
);


audio.addEventListener(
  "pause",
  ()=>{

    playBtn.textContent =
      "▶";

    cover.classList.remove(
      "spin"
    );

  }
);


audio.addEventListener(
  "ended",
  ()=>{

    if(repeat){

      audio.currentTime = 0;

      playSong();

    }else{

      nextSong();

    }

  }
);


/* SEEK */

seek.oninput = ()=>{

  if(!audio.duration){
    return;
  }

  audio.currentTime =
    seek.value /
    100 *
    audio.duration;

};


/* PLAYLIST */

function renderPlaylist(){

  playlist.innerHTML = "";

  const keyword =
    search.value.toLowerCase();

  songs.forEach(
    (song,index)=>{

      if(
        keyword &&
        !song.title
          .toLowerCase()
          .includes(keyword) &&
        !song.artist
          .toLowerCase()
          .includes(keyword)
      ){

        return;

      }


      if(
        category.value !== "all" &&
        song.artist !==
        category.value
      ){

        return;

      }


      const item =
        document.createElement(
          "div"
        );

      item.className =
        "song";


      if(
        index === currentIndex
      ){

        item.classList.add(
          "active"
        );

      }


      item.innerHTML = `

        <div class="song-main">

          <div class="song-title">
            ${song.title}
          </div>

          <div class="song-artist">
            ${song.artist}
          </div>

        </div>

      `;


      item.onclick = ()=>{

        currentIndex =
          index;

        loadSong();

        playSong();

      };


      playlist.appendChild(
        item
      );

    }
  );

}


/* SEARCH */

search.oninput =
  renderPlaylist;


/* CATEGORY */

function makeCategories(){

  const artists =
    [
      ...new Set(
        songs.map(
          song => song.artist
        )
      )
    ];

  artists.forEach(
    name=>{

      const option =
        document.createElement(
          "option"
        );

      option.value =
        name;

      option.textContent =
        "🎤 " + name;

      category.appendChild(
        option
      );

    }
  );

}

category.onchange =
  renderPlaylist;


/* VIDEO */

function openVideo(){

  const song =
    songs[currentIndex];

  if(
    !song ||
    !song.lyricsVideo
  ){
    return;
  }

  lyricsVideo.src =
    song.lyricsVideo;

  lyricsVideo.currentTime =
    audio.currentTime || 0;

  videoBox.classList.add(
    "show"
  );

  if(!audio.paused){

    lyricsVideo.play()
      .catch(()=>{});

  }

}


function closeVideo(){

  lyricsVideo.pause();

  lyricsVideo.removeAttribute(
    "src"
  );

  lyricsVideo.load();

  videoBox.classList.remove(
    "show"
  );

}


videoBtn.onclick = ()=>{

  if(
    videoBox.classList.contains(
      "show"
    )
  ){

    closeVideo();

  }else{

    openVideo();

  }

};


/* VIDEO IKUT AUDIO */

audio.addEventListener(
  "timeupdate",
  ()=>{

    if(
      !videoBox.classList.contains(
        "show"
      )
    ){
      return;
    }

    if(!lyricsVideo.duration){
      return;
    }

    if(
      Math.abs(
        lyricsVideo.currentTime -
        audio.currentTime
      ) > 0.5
    ){

      lyricsVideo.currentTime =
        audio.currentTime;

    }

  }
);


audio.addEventListener(
  "play",
  ()=>{

    if(
      videoBox.classList.contains(
        "show"
      )
    ){

      lyricsVideo.play()
        .catch(()=>{});

    }

  }
);


audio.addEventListener(
  "pause",
  ()=>{

    lyricsVideo.pause();

  }
);


/* MEDIA SESSION */

function updateMediaSession(){

  if(
    !("mediaSession" in navigator)
  ){
    return;
  }

  const song =
    songs[currentIndex];

  if(!song){
    return;
  }

  navigator.mediaSession.metadata =
    new MediaMetadata({

      title:
        song.title,

      artist:
        song.artist,

      album:
        "Sedatur Music Hub",

      artwork:[
        {
          src:
            song.cover ||
            "logo.png",

          sizes:
            "512x512",

          type:
            "image/png"
        }
      ]

    });

}


if(
  "mediaSession" in navigator
){

  navigator.mediaSession.setActionHandler(
    "play",
    playSong
  );

  navigator.mediaSession.setActionHandler(
    "pause",
    pauseSong
  );

  navigator.mediaSession.setActionHandler(
    "nexttrack",
    nextSong
  );

  navigator.mediaSession.setActionHandler(
    "previoustrack",
    prevBtn.click
  );

}


/* LOAD PLAYLIST.JSON */

fetch("playlist.json")

  .then(response=>{

    if(!response.ok){

      throw new Error(
        "playlist.json tidak ditemukan"
      );

    }

    return response.json();

  })

  .then(data=>{

    songs = data;

    if(!songs.length){

      throw new Error(
        "Playlist kosong"
      );

    }

    makeCategories();

    loadSong();

  })

  .catch(error=>{

    console.error(error);

    playlist.innerHTML = `
      <div class="empty">
        ❌ Playlist gagal dimuat
      </div>
    `;

  });

</script>

</body>
</html>
