<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎵 Sedatur Music Hub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:linear-gradient(180deg,#0f172a,#020617);
color:white;
min-height:100vh;
}


header{

display:flex;
justify-content:space-between;
align-items:center;

padding:18px;

background:#111827;

position:sticky;
top:0;

}

.logo{
font-size:20px;
font-weight:bold;
}


.clock{
text-align:right;
}

#time{
font-size:22px;
font-weight:bold;
}

#date{
font-size:12px;
color:#94a3b8;
}



.marquee{

margin:15px;

background:#1e293b;

border-radius:12px;

padding:10px;

overflow:hidden;

white-space:nowrap;

}


.marquee span{

display:inline-block;

animation:run 12s linear infinite;

}


@keyframes run{

from{
transform:translateX(100%);
}

to{
transform:translateX(-100%);
}

}



.container{

max-width:700px;

margin:auto;

padding:15px;

}



.card{

background:#1e293b;

border-radius:25px;

padding:25px;

text-align:center;

box-shadow:0 15px 40px #0005;

}



/* VINYL */

.vinyl{

width:230px;

height:230px;

margin:auto;

border-radius:50%;

background:
radial-gradient(circle,#222 0 20%,#000 21%);

display:flex;

align-items:center;

justify-content:center;

}


.vinyl img{

width:90px;

height:90px;

border-radius:50%;

background:white;

padding:5px;

}



.spin{

animation:spin 8s linear infinite;

}


@keyframes spin{

100%{
transform:rotate(360deg);
}

}




.title{

font-size:25px;

font-weight:bold;

margin-top:20px;

}


.artist{

color:#94a3b8;

margin-top:5px;

}


.status{

margin-top:10px;

color:#22c55e;

}




input[type=range]{

width:100%;

}



.timebar{

display:flex;

justify-content:space-between;

font-size:12px;

color:#cbd5e1;

}




.controls{

display:flex;

justify-content:center;

gap:12px;

margin-top:20px;

}


button{

border:0;

width:45px;

height:45px;

border-radius:50%;

background:#334155;

color:white;

font-size:18px;

}


.play{

width:60px;

height:60px;

background:#22c55e;

}




.volume{

margin-top:20px;

display:flex;

gap:10px;

align-items:center;

}




select{

width:100%;

margin-top:20px;

padding:12px;

border-radius:12px;

background:#334155;

color:white;

border:0;

}



.playlist{

margin-top:20px;

background:#111827;

border-radius:20px;

padding:10px;

}



.song{

display:flex;

align-items:center;

gap:12px;

padding:10px;

border-radius:12px;

}


.song:hover{

background:#334155;

}


.song img{

width:50px;

height:50px;

border-radius:50%;

}



.active{

background:#2563eb;

}


</style>

</head>


<body>


<header>

<div class="logo">
🎵 Sedatur Music Hub
</div>


<div class="clock">

<div id="time">
00:00:00
</div>

<div id="date">
Loading...
</div>

</div>

</header>



<div class="marquee">

<span id="running">
🎵 Selamat datang di Sedatur Music Hub 🎧
</span>

</div>



<div class="container">


<div class="card">


<div class="vinyl" id="vinyl">

<img id="cover" src="logo.png">

</div>



<div class="title" id="title">

Sedatur Music Hub

</div>


<div class="artist" id="artist">

Pilih lagu

</div>


<div class="status" id="status">

⏸ Belum diputar

</div>



<br>


<input id="seek" type="range" value="0">



<div class="timebar">

<span id="current">
00:00
</span>

<span id="duration">
00:00
</span>

</div>



<div class="controls">

<button id="prev">
⏮
</button>


<button id="play" class="play">
▶
</button>


<button id="next">
⏭
</button>


<button id="shuffle">
🔀
</button>


<button id="repeat">
🔁
</button>


</div>



<div class="volume">

🔊

<input id="volume" type="range" min="0" max="1" step="0.01">

</div>



<select id="category">

<option value="all">
🎤 Semua Artis
</option>

</select>



<div class="playlist" id="playlist">

</div>


</div>

</div>



<audio id="audio"></audio>
<script>

const audio=document.getElementById("audio");

const cover=document.getElementById("cover");
const vinyl=document.getElementById("vinyl");

const title=document.getElementById("title");
const artist=document.getElementById("artist");
const status=document.getElementById("status");

const play=document.getElementById("play");
const prev=document.getElementById("prev");
const next=document.getElementById("next");

const shuffle=document.getElementById("shuffle");
const repeat=document.getElementById("repeat");

const seek=document.getElementById("seek");
const volume=document.getElementById("volume");

const current=document.getElementById("current");
const duration=document.getElementById("duration");

const playlist=document.getElementById("playlist");

const category=document.getElementById("category");

const running=document.getElementById("running");

const time=document.getElementById("time");
const date=document.getElementById("date");


let songs=[];
let index=0;

let isShuffle=false;
let isRepeat=false;



// JAM REALTIME

function clock(){

let now=new Date();

time.textContent=
now.toLocaleTimeString("id-ID");


date.textContent=
now.toLocaleDateString(
"id-ID",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
);

}

clock();

setInterval(clock,1000);




// LOAD PLAYLIST

fetch("playlist.json")

.then(r=>r.json())

.then(data=>{

songs=data;

makeCategory();

showPlaylist();

restore();

});




// KATEGORI

function makeCategory(){

let cats=[...new Set(
songs.map(x=>x.category)
)];

cats.forEach(c=>{

let op=document.createElement("option");

op.value=c;

op.textContent="🎤 "+c;

category.appendChild(op);

});

}



category.onchange=showPlaylist;




// TAMPIL PLAYLIST

function showPlaylist(){

playlist.innerHTML="";


songs.forEach((song,i)=>{


if(
category.value!="all" &&
song.category!=category.value
)return;


let div=document.createElement("div");

div.className="song";


div.innerHTML=`

<img src="${song.cover}">

<div>

<b>${song.title}</b>

<br>

<small>${song.artist}</small>

</div>

`;


div.onclick=()=>{

index=i;

loadSong();

playSong();

};


playlist.appendChild(div);


});


}



// LOAD LAGU

function loadSong(){

let song=songs[index];

if(!song)return;


audio.src=song.file;


cover.src=song.cover;


title.textContent=song.title;


artist.textContent=song.artist;


running.textContent=
"🎵 Sedang Diputar • "
+song.title+
" • "
+song.artist+
" 🎧";


save();


updateMedia();

}



// PLAY

function playSong(){

audio.play();

play.textContent="⏸";

status.textContent="🟢 Sedang Diputar";

vinyl.classList.add("spin");

}


function pauseSong(){

audio.pause();

play.textContent="▶";

status.textContent="⏸ Dijeda";

vinyl.classList.remove("spin");

}



play.onclick=()=>{

audio.paused?
playSong():
pauseSong();

};




// NEXT

next.onclick=()=>{

if(isShuffle){

index=Math.floor(
Math.random()*songs.length
);

}else{

index++;

if(index>=songs.length)
index=0;

}


loadSong();

playSong();

};



// PREV

prev.onclick=()=>{

index--;

if(index<0)
index=songs.length-1;


loadSong();

playSong();

};




// SHUFFLE

shuffle.onclick=()=>{

isShuffle=!isShuffle;

shuffle.style.background=
isShuffle?
"#22c55e":
"#334155";

save();

};




// REPEAT

repeat.onclick=()=>{

isRepeat=!isRepeat;


repeat.style.background=
isRepeat?
"#22c55e":
"#334155";

save();

};




// AUTO NEXT

audio.onended=()=>{


if(isRepeat){

audio.currentTime=0;

playSong();

}else{

next.click();

}


};




// SEEK

audio.onloadedmetadata=()=>{

seek.max=audio.duration;

duration.textContent=
format(audio.duration);

};



audio.ontimeupdate=()=>{

seek.value=audio.currentTime;

current.textContent=
format(audio.currentTime);

localStorage.setItem(
"pos",
audio.currentTime
);

};



seek.oninput=()=>{

audio.currentTime=seek.value;

};




// VOLUME

volume.value=
localStorage.getItem("vol") || 1;


audio.volume=volume.value;


volume.oninput=()=>{

audio.volume=volume.value;

localStorage.setItem(
"vol",
volume.value
);

};




// FORMAT

function format(sec){

if(isNaN(sec))
return "00:00";


let m=Math.floor(sec/60);

let s=Math.floor(sec%60);


return String(m).padStart(2,"0")
+":"+
String(s).padStart(2,"0");

}



// SIMPAN

function save(){

localStorage.setItem(
"song",
index
);

localStorage.setItem(
"shuffle",
isShuffle
);

localStorage.setItem(
"repeat",
isRepeat
);

}



// RESTORE

function restore(){

index=
Number(
localStorage.getItem("song")
)||0;


isShuffle=
localStorage.getItem("shuffle")
==="true";


isRepeat=
localStorage.getItem("repeat")
==="true";


loadSong();


}



// MEDIA SESSION ANDROID

function updateMedia(){

if(!("mediaSession" in navigator))
return;


navigator.mediaSession.metadata=
new MediaMetadata({

title:title.textContent,

artist:artist.textContent,

album:"Sedatur Music Hub",

artwork:[
{
src:cover.src,
sizes:"512x512"
}
]

});


navigator.mediaSession.setActionHandler(
"play",
playSong
);


navigator.mediaSession.setActionHandler(
"pause",
pauseSong
);


navigator.mediaSession.setActionHandler(
"nexttrack",
()=>next.click()
);


navigator.mediaSession.setActionHandler(
"previoustrack",
()=>prev.click()
);


}


</script>

</body>
</html>
