<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Sedatur Music Hub</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #222;
  position:sticky;
  top:0;
  background:#080808ee;
  backdrop-filter:blur(10px);
  z-index:10;
}

.logo{
  font-weight:bold;
}

.home{
  color:#fff;
  text-decoration:none;
  background:#1c1c1c;
  padding:8px 13px;
  border-radius:20px;
}

.container{
  width:min(800px,94%);
  margin:auto;
  padding:20px 0 40px;
}

.hero{
  text-align:center;
  padding:10px 0 20px;
}

.hero h1{
  font-size:26px;
  margin-bottom:6px;
}

.hero p{
  color:#888;
  font-size:14px;
}

.player{
  background:#141414;
  border:1px solid #252525;
  border-radius:20px;
  padding:20px;
}

.cover{
  display:flex;
  justify-content:center;
  margin-bottom:18px;
}

#cover{
  width:170px;
  height:170px;
  border-radius:50%;
  object-fit:cover;
  border:5px solid #292929;
}

.spin{
  animation:spin 5s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.info{
  text-align:center;
}

#title{
  font-size:20px;
}

#artist{
  color:#888;
  margin-top:5px;
}

.progress{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:20px;
  font-size:12px;
  color:#888;
}

input[type="range"]{
  width:100%;
  accent-color:#fff;
}

.controls{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:18px 0;
}

button{
  border:0;
  cursor:pointer;
}

.controls button{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#242424;
  color:#fff;
  font-size:17px;
}

.controls .play{
  width:56px;
  height:56px;
  background:#fff;
  color:#000;
  font-size:21px;
}

.controls button.active{
  background:#fff;
  color:#000;
}

.tools{
  display:flex;
  gap:10px;
}

.tools button{
  flex:1;
  padding:11px;
  border-radius:12px;
  background:#222;
  color:#fff;
}

.video{
  display:none;
  margin-top:15px;
}

.video.show{
  display:block;
}

#lyricsVideo{
  width:100%;
  max-height:400px;
  border-radius:14px;
  background:#000;
}

.search{
  margin-top:20px;
}

#search,
#category{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:12px;
  border:1px solid #252525;
  background:#141414;
  color:#fff;
  outline:none;
}

.playlist{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.song{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px;
  background:#141414;
  border:1px solid #222;
  border-radius:12px;
}

.song.active{
  border-color:#fff;
}

.song-main{
  flex:1;
  min-width:0;
  cursor:pointer;
}

.song-title{
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.song-artist{
  color:#777;
  font-size:12px;
  margin-top:3px;
}

.favorite{
  background:none;
  color:#fff;
  font-size:20px;
  padding:5px;
}

.empty{
  text-align:center;
  padding:20px;
  color:#777;
}

@media(max-width:500px){

  #cover{
    width:150px;
    height:150px;
  }

  .controls{
    gap:4px;
  }

}

</style>

</head>

<body>

<header>

  <div class="logo">
    🎵 Sedatur Music Hub
  </div>

  <a class="home" href="../">
    🏠 Home
  </a>

</header>


<main class="container">

<section class="hero">

  <h1>🎵 Sedatur Music Hub</h1>

  <p>Selamat datang di Sedatur Music Hub 🎧</p>

</section>


<section class="player">

  <div class="cover">

    <img
      id="cover"
      src="logo.png"
      alt="Cover"
    >

  </div>


  <div class="info">

    <h2 id="title">
      Sedatur Music Hub
    </h2>

    <p id="artist">
      Pilih lagu
    </p>

  </div>


  <div class="progress">

    <span id="current">
      00:00
    </span>

    <input
      id="seek"
      type="range"
      min="0"
      max="100"
      value="0"
    >

    <span id="duration">
      00:00
    </span>

  </div>


  <div class="controls">

    <button id="prev">
      ⏮
    </button>

    <button
      id="play"
      class="play"
    >
      ▶
    </button>

    <button id="next">
      ⏭
    </button>

    <button id="shuffle">
      🔀
    </button>

    <button id="repeat">
      🔁
    </button>

  </div>


  <div class="tools">

    <button id="videoBtn">
      🎬 Lirik Video
    </button>

    <button id="favoriteBtn">
      ♡ Favorit
    </button>

  </div>


  <div
    id="videoBox"
    class="video"
  >

    <video
      id="lyricsVideo"
      muted
      playsinline
      controls
    ></video>

  </div>

</section>


<section class="search">

  <input
    id="search"
    type="search"
    placeholder="🔎 Cari lagu atau artis..."
  >

  <select id="category">

    <option value="all">
      🎤 Semua Artis
    </option>

  </select>

</section>


<section
  id="playlist"
  class="playlist"
>

  <div class="empty">
    Memuat lagu...
  </div>

</section>

</main>


<audio
  id="audio"
  preload="metadata"
></audio>


<script>

/* ================================
   PLAYLIST
================================ */

const songs = [

{
  title:"Dunia Yang Nanti",
  artist:"Raim Laode",
  file:"dunia-yang-nanti.mp3",
  lyricsVideo:"https://github.com/andairlangga-byte/SedaturMusic-Hub/releases/download/Sedatur/Raim.Laode.-.Dunia.Yang.Nanti.Lirik.video.mp4"
},

{
  title:"Ini Abadi",
  artist:"Perunggu",
  file:"ini-abadi.mp3",
  lyricsVideo:"https://github.com/andairlangga-byte/SedaturMusic-Hub/releases/download/Sedatur/vidssave.com.Perunggu.-.Ini.Abadi.Video.Lirik.360P.mp4"
},

{
  title:"Shape of My Heart",
  artist:"Backstreet Boys",
  file:"shape-of-my-heart.mp3",
  lyricsVideo:"https://github.com/andairlangga-byte/SedaturMusic-Hub/releases/download/Sedatur/vidssave.com.Backstreet.Boys.-.Shape.Of.My.Heart.Official.HD.Video.360P.mp4"
},

{
  title:"IQRO",
  artist:"Raim Laode",
  file:"iqro.mp3",
  lyricsVideo:"https://github.com/andairlangga-byte/SedaturMusic-Hub/releases/download/Sedatur/IQRO.-.Raim.Laode._.Lirik.Lagu.mp4"
},

{
  title:"What Makes You Beautiful",
  artist:"One Direction",
  file:"what-makes-you-beautiful.mp3",
  lyricsVideo:"https://github.com/andairlangga-byte/SedaturMusic-Hub/releases/download/Sedatur/vidssave.com.One.Direction.-.What.Makes.You.Beautiful.Lyrics.360P.mp4"
},

{
  title:"33X",
  artist:"Perunggu",
  file:"33x.mp3",
  lyricsVideo:"https://github.com/andairlangga-byte/SedaturMusic-Hub/releases/download/Sedatur/Perunggu.-.33x.Video.Lirik.mp4"
},

{
  title:"Teh Hijau",
  artist:"Tulus",
  file:"teh-hijau.mp3",
  lyricsVideo:"https://github.com/andairlangga-byte/SedaturMusic-Hub/releases/download/Sedatur/Teh.Hijau.-.Tulus._.Lirik.Lagu.mp4"
},

{
  title:"1000 X",
  artist:"Ghea Indrawari",
  file:"1000x.mp3",
  lyricsVideo:"https://github.com/andairlangga-byte/SedaturMusic-Hub/releases/download/Sedatur/1000x.-.Ghea.Indrawari._.Lirik.Lagu.mp4"
},

{
  title:"Lesung Pipi",
  artist:"Raim Laode",
  file:"lesung-pipi.mp3",
  lyricsVideo:"https://github.com/andairlangga-byte/SedaturMusic-Hub/releases/download/Sedatur/lesung.pipi-video.lirik.mp4"
},

{
  title:"Everything U Are",
  artist:"Hindia",
  file:"everything-u-are.mp3",
  lyricsVideo:"https://github.com/andairlangga-byte/SedaturMusic-Hub/releases/download/Sedatur/everything.u.are-video.lirik.mp4"
},

{
  title:"Kami Belum Tentu",
  artist:".Feast",
  file:"kami-belum-tentu.mp3",
  lyricsVideo:"https://github.com/andairlangga-byte/SedaturMusic-Hub/releases/download/Sedatur/Kami.Belum.Tentu.Vertical.Video.Official.Music.Video.mp4"
},

{
  title:"Berapa Kali Kita Akan Saling Memaafkan",
  artist:"Pamungkas",
  file:"berapa-kali-kita-akan-saling-memaafkan.mp3",
  lyricsVideo:"https://github.com/andairlangga-byte/SedaturMusic-Hub/releases/download/Sedatur/berapa-kali-kita-akan-saling-memaafkam_Video-lirik.mp4"
},

{
  title:"Nina",
  artist:".Feast",
  file:"nina.mp3",
  lyricsVideo:"https://github.com/andairlangga-byte/SedaturMusic-Hub/releases/download/Sedatur/Feast.-.Nina.Official.Lyric.Video.mp4"
},

{
  title:"Buruh Tani",
  artist:"Marjinal",
  file:"buruh-tani.mp3",
  lyricsVideo:"https://github.com/andairlangga-byte/SedaturMusic-Hub/releases/download/Sedatur/BURUH.TANI.-.MARJINAL.dengan.teks.11.April.2022.Mahasiswa.Bergerak.mp4"
},

{
  title:"Dia Masa Lalumu, Aku Masa Depanmu",
  artist:"Vionita",
  file:"dia-masa-lalumu-aku-masa-depanmu.mp3",
  lyricsVideo:"https://github.com/andairlangga-byte/SedaturMusic-Hub/releases/download/Sedatur/Vionita.Sihombing.-.Dia.Masa.Lalumu.Aku.Masa.Depanmu.Lirik.mp4"
},

{
  title:"Sesi Potret",
  artist:"Enau & Ari Lesmana",
  file:"sesi-potret.mp3",
  lyricsVideo:"https://github.com/andairlangga-byte/SedaturMusic-Hub/releases/download/Sedatur/enau.feat.Ari.Lesmana.-.Sesi.Potret.LIRIK.LAGU.mp4"
}

];


/* PART 1 SELESAI */
/* ================================
   PLAYER
================================ */

const audio = document.getElementById("audio");
const cover = document.getElementById("cover");
const title = document.getElementById("title");
const artist = document.getElementById("artist");

const playBtn = document.getElementById("play");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const shuffleBtn = document.getElementById("shuffle");
const repeatBtn = document.getElementById("repeat");

const seek = document.getElementById("seek");
const current = document.getElementById("current");
const duration = document.getElementById("duration");

const playlist = document.getElementById("playlist");
const search = document.getElementById("search");
const category = document.getElementById("category");

let currentIndex = 0;
let shuffle = false;
let repeat = false;


/* ================================
   FORMAT WAKTU
================================ */

function time(sec){

  if(!isFinite(sec)) return "00:00";

  let m = Math.floor(sec / 60);
  let s = Math.floor(sec % 60);

  return String(m).padStart(2,"0") + ":" +
         String(s).padStart(2,"0");

}


/* ================================
   LOAD LAGU
================================ */

function loadSong(){

  const song = songs[currentIndex];

  if(!song) return;

  audio.src = song.file;

  title.textContent = song.title;
  artist.textContent = song.artist;

  cover.src = "logo.png";

  current.textContent = "00:00";
  duration.textContent = "00:00";

  seek.value = 0;

  renderPlaylist();

}


/* ================================
   PLAY
================================ */

function playSong(){

  audio.play()
    .then(()=>{

      playBtn.textContent = "⏸";
      cover.classList.add("spin");

    })
    .catch(error=>{

      console.log(error);

    });

}


/* ================================
   PAUSE
================================ */

function pauseSong(){

  audio.pause();

  playBtn.textContent = "▶";

  cover.classList.remove("spin");

}


/* ================================
   PLAY / PAUSE
================================ */

playBtn.onclick = ()=>{

  if(audio.paused){

    playSong();

  }else{

    pauseSong();

  }

};


/* ================================
   NEXT
================================ */

function nextSong(){

  if(shuffle){

    let next;

    do{

      next =
        Math.floor(
          Math.random() * songs.length
        );

    }while(
      songs.length > 1 &&
      next === currentIndex
    );

    currentIndex = next;

  }else{

    currentIndex++;

    if(currentIndex >= songs.length){

      currentIndex = 0;

    }

  }

  loadSong();

  playSong();

}

nextBtn.onclick = nextSong;


/* ================================
   PREVIOUS
================================ */

prevBtn.onclick = ()=>{

  currentIndex--;

  if(currentIndex < 0){

    currentIndex =
      songs.length - 1;

  }

  loadSong();

  playSong();

};


/* ================================
   SHUFFLE
================================ */

shuffleBtn.onclick = ()=>{

  shuffle = !shuffle;

  shuffleBtn.classList.toggle(
    "active",
    shuffle
  );

};


/* ================================
   REPEAT
================================ */

repeatBtn.onclick = ()=>{

  repeat = !repeat;

  repeatBtn.classList.toggle(
    "active",
    repeat
  );

};


/* ================================
   AUDIO EVENTS
================================ */

audio.addEventListener(
  "loadedmetadata",
  ()=>{

    duration.textContent =
      time(audio.duration);

  }
);


audio.addEventListener(
  "timeupdate",
  ()=>{

    if(!audio.duration) return;

    seek.value =
      (audio.currentTime /
       audio.duration) * 100;

    current.textContent =
      time(audio.currentTime);

  }
);


audio.addEventListener(
  "play",
  ()=>{

    playBtn.textContent = "⏸";

    cover.classList.add("spin");

  }
);


audio.addEventListener(
  "pause",
  ()=>{

    playBtn.textContent = "▶";

    cover.classList.remove("spin");

  }
);


audio.addEventListener(
  "ended",
  ()=>{

    if(repeat){

      audio.currentTime = 0;

      playSong();

    }else{

      nextSong();

    }

  }
);


/* ================================
   SEEK
================================ */

seek.oninput = ()=>{

  if(!audio.duration) return;

  audio.currentTime =
    (seek.value / 100) *
    audio.duration;

};


/* ================================
   PLAYLIST
================================ */

function renderPlaylist(){

  playlist.innerHTML = "";

  const keyword =
    search.value.toLowerCase();

  songs.forEach((song,index)=>{

    if(
      keyword &&
      !(
        song.title.toLowerCase()
        .includes(keyword) ||

        song.artist.toLowerCase()
        .includes(keyword)
      )
    ){

      return;

    }


    if(
      category.value !== "all" &&
      song.artist !== category.value
    ){

      return;

    }


    const item =
      document.createElement("div");

    item.className = "song";


    if(index === currentIndex){

      item.classList.add("active");

    }


    item.innerHTML = `

      <div class="song-main">

        <div class="song-title">
          ${song.title}
        </div>

        <div class="song-artist">
          ${song.artist}
        </div>

      </div>

    `;


    item.onclick = ()=>{

      currentIndex = index;

      loadSong();

      playSong();

    };


    playlist.appendChild(item);

  });

}


/* ================================
   SEARCH
================================ */

search.oninput =
  renderPlaylist;


/* ================================
   CATEGORY
================================ */

const artists =
  [...new Set(
    songs.map(song => song.artist)
  )];


artists.forEach(name=>{

  const option =
    document.createElement("option");

  option.value = name;
  option.textContent = "🎤 " + name;

  category.appendChild(option);

});


category.onchange =
  renderPlaylist;


/* ================================
   START
================================ */

loadSong();

/* ================================
   VIDEO LIRIK
================================ */

const videoBtn =
  document.getElementById("videoBtn");

const videoBox =
  document.getElementById("videoBox");

const lyricsVideo =
  document.getElementById("lyricsVideo");


function openVideo(){

  const song =
    songs[currentIndex];

  if(!song || !song.lyricsVideo){

    return;

  }

  lyricsVideo.src =
    song.lyricsVideo;

  lyricsVideo.currentTime =
    audio.currentTime || 0;

  videoBox.classList.add("show");

  if(!audio.paused){

    lyricsVideo.play()
      .catch(()=>{});

  }

}


function closeVideo(){

  lyricsVideo.pause();

  lyricsVideo.removeAttribute("src");

  lyricsVideo.load();

  videoBox.classList.remove("show");

}


videoBtn.onclick = ()=>{

  if(
    videoBox.classList.contains("show")
  ){

    closeVideo();

  }else{

    openVideo();

  }

};


/* ================================
   VIDEO IKUT AUDIO
================================ */

audio.addEventListener(
  "timeupdate",
  ()=>{

    if(
      !videoBox.classList.contains("show")
    ){

      return;

    }

    if(!lyricsVideo.duration){

      return;

    }

    if(
      Math.abs(
        lyricsVideo.currentTime -
        audio.currentTime
      ) > 0.5
    ){

      lyricsVideo.currentTime =
        audio.currentTime;

    }

  }
);


audio.addEventListener(
  "play",
  ()=>{

    if(
      videoBox.classList.contains("show")
    ){

      lyricsVideo.play()
        .catch(()=>{});

    }

  }
);


audio.addEventListener(
  "pause",
  ()=>{

    lyricsVideo.pause();

  }
);


/* ================================
   NEXT / PREVIOUS
   VIDEO IKUT GANTI
================================ */

function updateVideo(){

  if(
    !videoBox.classList.contains("show")
  ){

    return;

  }

  const song =
    songs[currentIndex];

  if(
    !song ||
    !song.lyricsVideo
  ){

    closeVideo();

    return;

  }

  lyricsVideo.src =
    song.lyricsVideo;

  lyricsVideo.load();

  lyricsVideo.onloadedmetadata = ()=>{

    lyricsVideo.currentTime =
      audio.currentTime || 0;

    if(!audio.paused){

      lyricsVideo.play()
        .catch(()=>{});

    }

  };

}


/* ================================
   MEDIA SESSION
   BACKGROUND / LOCK SCREEN
================================ */

function updateMediaSession(){

  if(
    !("mediaSession" in navigator)
  ){

    return;

  }

  const song =
    songs[currentIndex];

  if(!song) return;


  navigator.mediaSession.metadata =
    new MediaMetadata({

      title:
        song.title,

      artist:
        song.artist,

      album:
        "Sedatur Music Hub",

      artwork:[
        {
          src:"logo.png",
          sizes:"512x512",
          type:"image/png"
        }
      ]

    });

}


/* ================================
   KONTROL LAYAR KUNCI
================================ */

if(
  "mediaSession" in navigator
){

  navigator.mediaSession.setActionHandler(
    "play",
    ()=>{
      playSong();
    }
  );


  navigator.mediaSession.setActionHandler(
    "pause",
    ()=>{
      pauseSong();
    }
  );


  navigator.mediaSession.setActionHandler(
    "nexttrack",
    ()=>{
      nextSong();
    }
  );


  navigator.mediaSession.setActionHandler(
    "previoustrack",
    ()=>{

      currentIndex--;

      if(currentIndex < 0){

        currentIndex =
          songs.length - 1;

      }

      loadSong();

      playSong();

    }
  );

}


/* ================================
   UPDATE MEDIA SESSION
================================ */

const oldLoadSong =
  loadSong;

loadSong = function(){

  oldLoadSong();

  updateMediaSession();

  updateVideo();

};

/* ================================
   FAVORIT
================================ */

const favoriteBtn =
  document.getElementById("favoriteBtn");


function getFavorites(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "sedatur_favorites"
      ) || "[]"
    );

  }catch{

    return [];

  }

}


function updateFavorite(){

  const favorites =
    getFavorites();

  const active =
    favorites.includes(currentIndex);

  favoriteBtn.textContent =
    active
      ? "❤️ Favorit"
      : "♡ Favorit";

}


favoriteBtn.onclick = ()=>{

  let favorites =
    getFavorites();


  if(
    favorites.includes(currentIndex)
  ){

    favorites =
      favorites.filter(
        i => i !== currentIndex
      );

  }else{

    favorites.push(currentIndex);

  }


  localStorage.setItem(
    "sedatur_favorites",
    JSON.stringify(favorites)
  );


  updateFavorite();

};


/* ================================
   SIMPAN LAGU TERAKHIR
================================ */

function savePlayer(){

  localStorage.setItem(
    "sedatur_song",
    currentIndex
  );

}


function loadLastSong(){

  const saved =
    Number(
      localStorage.getItem(
        "sedatur_song"
      )
    );


  if(
    Number.isInteger(saved) &&
    saved >= 0 &&
    saved < songs.length
  ){

    currentIndex = saved;

  }

}


loadLastSong();


/* ================================
   SIMPAN POSISI LAGU
================================ */

audio.addEventListener(
  "timeupdate",
  ()=>{

    if(
      audio.currentTime > 0 &&
      !audio.ended
    ){

      localStorage.setItem(
        "sedatur_position",
        audio.currentTime
      );

    }

  }
);


/* ================================
   RESTORE POSISI
================================ */

audio.addEventListener(
  "loadedmetadata",
  ()=>{

    const saved =
      Number(
        localStorage.getItem(
          "sedatur_position"
        )
      );


    if(
      saved > 0 &&
      saved < audio.duration
    ){

      audio.currentTime = saved;

    }

  }
);


/* ================================
   SIMPAN SETIAP GANTI LAGU
================================ */

const originalNext =
  nextSong;

nextSong = function(){

  originalNext();

  savePlayer();
  updateFavorite();

};


const originalLoad =
  loadSong;

loadSong = function(){

  originalLoad();

  savePlayer();
  updateFavorite();

  updateMediaSession();
  updateVideo();

};


/* ================================
   MEDIA SESSION
================================ */

  if(
    !("mediaSession" in navigator)
  ){

    return;

  }


  const song =
    songs[currentIndex];

  if(!song) return;


  navigator.mediaSession.metadata =
    new MediaMetadata({

      title:
        song.title,

      artist:
        song.artist,

      album:
        "Sedatur Music Hub",

      artwork:[
        {
          src:"logo.png",
          sizes:"512x512",
          type:"image/png"
        }
      ]

    });

}


/* ================================
   MEDIA SESSION BUTTON
================================ */

if(
  "mediaSession" in navigator
){

  try{

    navigator.mediaSession.setActionHandler(
      "play",
      ()=>{
        playSong();
      }
    );

    navigator.mediaSession.setActionHandler(
      "pause",
      ()=>{
        pauseSong();
      }
    );

    navigator.mediaSession.setActionHandler(
      "nexttrack",
      ()=>{
        nextSong();
      }
    );

    navigator.mediaSession.setActionHandler(
      "previoustrack",
      ()=>{

        currentIndex--;

        if(currentIndex < 0){

          currentIndex =
            songs.length - 1;

        }

        loadSong();
        playSong();

      }
    );

  }catch(e){

    console.log(
      "Media Session tidak tersedia"
    );

  }

}


/* ================================
   UPDATE MEDIA SESSION
================================ */

updateMediaSession();
updateFavorite();


/* ================================
   PERBAIKI VIDEO SAAT GANTI LAGU
================================ */

function updateVideo(){

  if(
    !videoBox.classList.contains("show")
  ){

    return;

  }


  const song =
    songs[currentIndex];


  if(
    !song ||
    !song.lyricsVideo
  ){

    closeVideo();

    return;

  }


  lyricsVideo.pause();

  lyricsVideo.src =
    song.lyricsVideo;

  lyricsVideo.load();


  lyricsVideo.onloadedmetadata =
    ()=>{

      lyricsVideo.currentTime =
        audio.currentTime || 0;


      if(!audio.paused){

        lyricsVideo.play()
          .catch(()=>{});

      }

    };

}


/* ================================
   FINAL LOAD
================================ */

loadSong();

updateFavorite();
updateMediaSession();

</script>
