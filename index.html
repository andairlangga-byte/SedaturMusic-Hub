<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sedatur Music Hub</title>

<style>

*{
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
margin:0;
background:#020617;
color:white;
}


header{
padding:30px 20px;
text-align:center;
background:linear-gradient(135deg,#7c3aed,#2563eb);
}


.logo{
width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
border:3px solid white;
}


h1{
margin:15px 0 5px;
}


.container{
max-width:700px;
margin:auto;
padding:20px;
}


.player{

background:#111827;
border-radius:25px;
padding:25px;
text-align:center;

}


.cover{

width:230px;
height:230px;
border-radius:25px;
object-fit:cover;

}


#title{

font-size:24px;
margin-top:20px;

}


#artist{

color:#94a3b8;

}


audio{

width:100%;
margin-top:20px;

}


.search{

margin:20px 0;

}


.search input{

width:100%;
padding:15px;
border-radius:15px;
border:none;
outline:none;

}


.song{

display:flex;
align-items:center;
gap:15px;

background:#1e293b;

padding:15px;

border-radius:18px;

margin-bottom:10px;

cursor:pointer;

}


.song:hover{

background:#334155;

}


.song img{

width:60px;
height:60px;
border-radius:15px;
object-fit:cover;

}


.song b{

font-size:16px;

}


.song small{

color:#94a3b8;

}


</style>

</head>


<body>


<header>

<img src="logo.png" class="logo">

<h1>🎧 Sedatur Music Hub</h1>

<p>Music Center Sedatur Rawamangun</p>

</header>



<div class="container">


<div class="player">


<img src="logo.png" id="cover" class="cover">


<h2 id="title">
Pilih Lagu
</h2>


<p id="artist">
Sedatur Music
</p>


<audio id="audio" controls></audio>


</div>



<div class="search">

<input 
id="search"
placeholder="Cari lagu..."
oninput="searchSong()">

</div>



<div id="playlist">

Memuat lagu...

</div>



</div>




<script>


let songs=[];

let current=0;


const audio=document.getElementById("audio");

const title=document.getElementById("title");

const artist=document.getElementById("artist");

const cover=document.getElementById("cover");

const playlist=document.getElementById("playlist");




// Load playlist stabil

fetch("playlist.json?v=1")

.then(response=>response.json())

.then(data=>{


songs=data;


renderPlaylist(songs);


// Ambil lagu terakhir

let saved=localStorage.getItem("lastSong");


if(saved!==null){

playSong(Number(saved),false);

}


})

.catch(error=>{

playlist.innerHTML="Playlist gagal dimuat";

});





function renderPlaylist(data){


playlist.innerHTML="";


data.forEach(song=>{


let index=songs.indexOf(song);


let div=document.createElement("div");


div.className="song";


div.innerHTML=`

<img src="${song.cover}">

<div>

<b>${song.title}</b>

<br>

<small>${song.artist}</small>

</div>

`;


div.onclick=function(){

playSong(index,true);

};


playlist.appendChild(div);


});


}





function playSong(index,auto){


current=index;


let song=songs[index];


audio.src=song.file;


title.innerHTML=song.title;


artist.innerHTML=song.artist;


cover.src=song.cover;



localStorage.setItem(
"lastSong",
index
);



if(auto){

audio.play();

}


}





function searchSong(){


let key=document
.getElementById("search")
.value
.toLowerCase();



let result=songs.filter(song=>


song.title.toLowerCase().includes(key)

||

song.artist.toLowerCase().includes(key)


);


renderPlaylist(result);


}





audio.onended=function(){


current++;


if(current>=songs.length){

current=0;

}


playSong(current,true);


};


</script>


</body>
</html>
