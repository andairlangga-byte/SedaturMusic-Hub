<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sedatur Music Hub</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

margin:0;
min-height:100vh;

display:flex;
align-items:center;
justify-content:center;

padding:20px;

background:#0f172a;

color:white;

}


.player{

width:100%;
max-width:420px;

background:#1e293b;

padding:25px;

border-radius:25px;

text-align:center;

}


.logo{

width:220px;
height:220px;

object-fit:cover;

border-radius:20px;

}


h1{

font-size:24px;

margin:20px 0 5px;

}


.artist{

color:#94a3b8;

}


audio{

width:100%;

margin-top:20px;

}



button{

border:none;

padding:12px 18px;

margin:10px 5px;

border-radius:30px;

font-size:18px;

background:#facc15;

cursor:pointer;

}



</style>

</head>



<body>



<div class="player">


<img id="cover" class="logo" src="logo.png">


<h1 id="title">
Memuat Lagu...
</h1>


<p id="artist" class="artist">
Sedatur Music Hub
</p>



<audio id="audio" controls></audio>


<div>

<button onclick="prev()">
⏮
</button>


<button onclick="playPause()">
▶️
</button>


<button onclick="next()">
⏭
</button>


</div>


</div>




<script>


let playlist=[];

let index=0;


const audio=document.getElementById("audio");

const title=document.getElementById("title");

const artist=document.getElementById("artist");

const cover=document.getElementById("cover");




// Ambil playlist

fetch("playlist.json")

.then(response=>response.json())

.then(data=>{

playlist=data;

loadSong();

})

.catch(()=>{

title.innerHTML="Playlist Error";

});





function loadSong(){


const song=playlist[index];


audio.src=song.file;


title.innerHTML=song.title;


artist.innerHTML=song.artist;


cover.src=song.cover;


updateMedia();


}





function playPause(){


if(audio.paused){

audio.play();

}else{

audio.pause();

}


}





function next(){


index++;


if(index>=playlist.length){

index=0;

}


loadSong();

audio.play();


}




function prev(){


index--;


if(index<0){

index=playlist.length-1;

}


loadSong();

audio.play();


}





audio.addEventListener("ended",()=>{

next();

});







// MEDIA SESSION BACKGROUND


function updateMedia(){


if(!("mediaSession" in navigator)) return;



navigator.mediaSession.metadata =
new MediaMetadata({

title:playlist[index].title,

artist:playlist[index].artist,

album:"Sedatur Music Hub",

artwork:[

{

src:playlist[index].cover,

sizes:"512x512",

type:"image/png"

}

]

});



navigator.mediaSession.setActionHandler(
"nexttrack",
()=>{

next();

}
);



navigator.mediaSession.setActionHandler(
"previoustrack",
()=>{

prev();

}
);



navigator.mediaSession.setActionHandler(
"play",
()=>{

audio.play();

}
);



navigator.mediaSession.setActionHandler(
"pause",
()=>{

audio.pause();

}
);



}



</script>


</body>

</html>
