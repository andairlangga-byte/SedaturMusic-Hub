<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sedatur Music Hub</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#7c3aed">


<style>

*{
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{

margin:0;
background:
radial-gradient(circle at top,#7c3aed55,transparent 40%),
#020617;

color:white;

}


header{

padding:30px 20px;

text-align:center;

}


.logo{

width:110px;
height:110px;

border-radius:50%;

object-fit:cover;

box-shadow:0 0 40px #7c3aed;

}



h1{

font-size:32px;

margin:15px 0 5px;

}



.subtitle{

color:#94a3b8;

}



.container{

max-width:700px;

margin:auto;

padding:20px;

}



.player{

background:#ffffff10;

backdrop-filter:blur(20px);

border:1px solid #ffffff20;

border-radius:30px;

padding:25px;

text-align:center;

}



.cover{

width:250px;

height:250px;

border-radius:25px;

object-fit:cover;

}



#title{

margin-top:20px;

}



#artist{

color:#94a3b8;

}



audio{

width:100%;

margin-top:20px;

}



.search input{

width:100%;

padding:15px;

margin:20px 0;

border-radius:20px;

border:none;

outline:none;

font-size:16px;

}



.song{

display:flex;

align-items:center;

gap:15px;

background:#ffffff10;

padding:15px;

border-radius:20px;

margin-bottom:12px;

cursor:pointer;

transition:.3s;

}



.song:hover{

background:#7c3aed55;

transform:scale(1.02);

}



.song img{

width:60px;

height:60px;

border-radius:15px;

object-fit:cover;

}



.artist{

color:#94a3b8;

font-size:14px;

}



footer{

text-align:center;

padding:30px;

color:#64748b;

}


</style>


</head>



<body>


<header>

<img src="logo.png" class="logo">

<h1>
🎧 Sedatur Music Hub
</h1>

<p class="subtitle">
Music Center Sedatur Rawamangun
</p>

</header>



<div class="container">


<div class="player">


<img src="logo.png" id="cover" class="cover">


<h2 id="title">
Pilih Lagu
</h2>


<p id="artist">
Sedatur Music
</p>


<audio id="audio" controls></audio>


</div>



<div class="search">

<input 
id="search"
placeholder="Cari lagu..."
oninput="searchSong()">

</div>



<div id="playlist">

Memuat playlist...

</div>


</div>



<footer>

© 2026 Sedatur Music Hub

</footer>




<script>


let songs=[];

let current=0;


const audio=document.getElementById("audio");

const title=document.getElementById("title");

const artist=document.getElementById("artist");

const cover=document.getElementById("cover");

const playlist=document.getElementById("playlist");




// Load playlist

fetch("playlist.json?v=1")

.then(res=>res.json())

.then(data=>{


songs=data;


renderPlaylist(songs);



});





function renderPlaylist(data){


playlist.innerHTML="";


data.forEach(song=>{


let index=songs.indexOf(song);


let item=document.createElement("div");


item.className="song";


item.innerHTML=`

<img src="${song.cover}">

<div>

<b>${song.title}</b>

<br>

<span class="artist">
${song.artist}
</span>

</div>

`;



item.onclick=()=>playSong(index);



playlist.appendChild(item);



});


}




function playSong(index){


current=index;


let song=songs[index];


audio.src=song.file;


title.innerHTML=song.title;


artist.innerHTML=song.artist;


cover.src=song.cover;



localStorage.setItem(
"lastSong",
index
);



audio.play();


}




function searchSong(){


let keyword=document
.getElementById("search")
.value
.toLowerCase();



let result=songs.filter(song=>

song.title.toLowerCase().includes(keyword)

||

song.artist.toLowerCase().includes(keyword)

);


renderPlaylist(result);


}




audio.onended=function(){


current++;


if(current>=songs.length){

current=0;

}


playSong(current);


};




// PWA

if("serviceWorker" in navigator){

navigator.serviceWorker.register("sw.js");

}



</script>


</body>

</html>
