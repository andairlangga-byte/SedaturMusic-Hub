<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sedatur Music Hub</title>

<style>

*{
box-sizing:border-box;
font-family:Inter,Segoe UI,Arial,sans-serif;
}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at top,#7c3aed55,transparent 40%),
linear-gradient(180deg,#020617,#000);
color:white;
}


header{
padding:30px 20px;
display:flex;
align-items:center;
gap:20px;
max-width:1000px;
margin:auto;
}


.logo{
width:80px;
height:80px;
border-radius:50%;
object-fit:cover;
box-shadow:0 0 40px #7c3aed;
}


header h1{
margin:0;
font-size:32px;
}


header p{
margin:5px 0;
color:#94a3b8;
}



.container{
max-width:1000px;
margin:auto;
padding:20px;
display:grid;
grid-template-columns:350px 1fr;
gap:25px;
}



.player{

background:#ffffff10;
backdrop-filter:blur(20px);
border:1px solid #ffffff15;
border-radius:30px;
padding:25px;
text-align:center;
position:sticky;
top:20px;

}



.cover{

width:260px;
height:260px;
border-radius:25px;
object-fit:cover;

box-shadow:
0 20px 50px #000;

}



#title{

font-size:24px;
margin:20px 0 5px;

}



#artist{

color:#a1a1aa;

}



audio{

width:100%;
margin-top:20px;

}



.search{

background:#ffffff12;
border-radius:20px;
padding:15px;
margin-bottom:20px;

}



.search input{

width:100%;
background:transparent;
border:0;
outline:none;
color:white;
font-size:16px;

}



.song{

display:flex;
align-items:center;
gap:15px;

padding:15px;

border-radius:20px;

background:#ffffff08;

margin-bottom:12px;

cursor:pointer;

transition:.3s;

}



.song:hover{

background:#7c3aed55;
transform:translateX(8px);

}



.song img{

width:65px;
height:65px;
border-radius:15px;
object-fit:cover;

}



.song-title{

font-size:17px;
font-weight:600;

}



.song-artist{

font-size:14px;
color:#94a3b8;

}



.badge{

display:inline-block;

background:#22c55e;

padding:6px 15px;

border-radius:20px;

font-size:13px;

margin-top:10px;

}



@media(max-width:800px){

.container{

grid-template-columns:1fr;

}


.player{

position:relative;

}


.cover{

width:220px;
height:220px;

}

}


footer{

text-align:center;
padding:30px;
color:#64748b;

}

</style>

</head>


<body>


<header>

<img src="logo.png" class="logo">

<div>

<h1>
🎧 Sedatur Music Hub
</h1>

<p>
Official Music Center Sedatur Rawamangun
</p>

<span class="badge">
● Online Music
</span>

</div>

</header>



<div class="container">


<div class="player">


<img src="logo.png" id="cover" class="cover">


<h2 id="title">
Pilih Lagu
</h2>


<p id="artist">
Sedatur Music
</p>


<audio id="audio" controls></audio>


</div>




<div>


<div class="search">

🔍

<input 
id="search"
placeholder="Cari lagu..."
onkeyup="searchSong()">

</div>



<div id="playlist">

Memuat playlist...

</div>


</div>



</div>




<footer>

© 2026 Sedatur Music Hub

</footer>



<script>


let songs=[];

let current=0;


const audio=document.getElementById("audio");

const title=document.getElementById("title");

const artist=document.getElementById("artist");

const cover=document.getElementById("cover");

const playlist=document.getElementById("playlist");



fetch("playlist.json")

.then(r=>r.json())

.then(data=>{

songs=data;

render(songs);

});





function render(data){


playlist.innerHTML="";


data.forEach(song=>{


let index=songs.indexOf(song);


let div=document.createElement("div");


div.className="song";


div.innerHTML=`

<img src="${song.cover}">

<div>

<div class="song-title">
${song.title}
</div>

<div class="song-artist">
${song.artist}
</div>

</div>

`;


div.onclick=()=>play(index);


playlist.appendChild(div);



});


}




function play(i){


current=i;


let s=songs[i];


audio.src=s.file;

title.innerHTML=s.title;

artist.innerHTML=s.artist;

cover.src=s.cover;


audio.play();


}




function searchSong(){


let key=document
.getElementById("search")
.value
.toLowerCase();



render(

songs.filter(s=>

s.title.toLowerCase().includes(key)

||

s.artist.toLowerCase().includes(key)

)

);


}



audio.onended=()=>{

current++;

if(current>=songs.length)
current=0;

play(current);

};



</script>


</body>
</html>
