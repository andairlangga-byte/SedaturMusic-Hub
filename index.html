<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>🎵 Sedatur Music Hub</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
margin:0;
padding:0
}

:root{
--bg:#030712;
--panel:#0f172a;
--panel2:#111c30;
--border:rgba(255,255,255,.09);
--text:#f8fafc;
--muted:#94a3b8;
--accent:#38bdf8;
--green:#22c55e
}

body{
background:
radial-gradient(circle at 15% 0%,rgba(56,189,248,.13),transparent 30%),
radial-gradient(circle at 90% 20%,rgba(34,197,94,.08),transparent 28%),
var(--bg);
color:var(--text);
min-height:100vh
}

button,
input,
select{
font:inherit
}

button{
cursor:pointer
}


/* HEADER */

header{
position:sticky;
top:0;
z-index:100;
padding:15px;
background:rgba(3,7,18,.82);
backdrop-filter:blur(18px);
border-bottom:1px solid var(--border);
display:flex;
justify-content:space-between;
align-items:center;
gap:15px
}

.logo{
font-size:20px;
font-weight:900
}

.home{
display:inline-block;
background:rgba(56,189,248,.14);
border:1px solid rgba(56,189,248,.25);
color:var(--accent);
padding:9px 13px;
border-radius:12px;
text-decoration:none;
font-size:13px;
font-weight:700
}

.clock{
text-align:right;
margin-top:6px
}

#time{
font-size:18px;
font-weight:900
}

#date{
font-size:10px;
color:var(--muted)
}


/* MARQUEE */

.marquee{
margin:15px auto;
max-width:650px;
background:rgba(255,255,255,.035);
border:1px solid var(--border);
padding:11px;
border-radius:14px;
overflow:hidden;
white-space:nowrap
}

.marquee span{
display:inline-block;
animation:run 16s linear infinite;
color:#cbd5e1;
font-size:12px
}

@keyframes run{
from{transform:translateX(100%)}
to{transform:translateX(-100%)}
}


/* MAIN */

.box{
width:min(650px,100%);
margin:auto;
padding:0 15px 30px
}

.card{
background:
linear-gradient(
145deg,
rgba(17,28,48,.95),
rgba(8,15,29,.95)
);
border:1px solid var(--border);
border-radius:28px;
padding:22px;
box-shadow:0 25px 80px rgba(0,0,0,.35)
}


/* VINYL */

.vinyl{
width:220px;
height:220px;
margin:5px auto 0;
border-radius:50%;
background:
radial-gradient(
circle,
#222 0 10%,
#111 11% 20%,
#333 21% 22%,
#080808 23% 100%
);
display:flex;
align-items:center;
justify-content:center;
box-shadow:
0 0 0 8px rgba(255,255,255,.025),
0 20px 50px rgba(0,0,0,.5)
}

.vinyl img{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
border:4px solid #111
}

.spin{
animation:spin 8s linear infinite
}

@keyframes spin{
to{transform:rotate(360deg)}
}


/* SONG INFO */

#title{
font-size:24px;
margin-top:22px;
line-height:1.2
}

.artist{
color:var(--muted);
font-size:14px;
margin-top:7px
}

#status{
margin-top:10px;
font-size:12px;
color:#cbd5e1
}


/* SEEK */

.seek-area{
margin-top:22px
}

#seek{
width:100%;
accent-color:var(--accent)
}

.time-row{
display:flex;
justify-content:space-between;
font-size:11px;
color:var(--muted);
margin-top:5px
}


/* CONTROLS */

.controls{
display:flex;
justify-content:center;
align-items:center;
gap:9px;
margin:20px 0 15px;
flex-wrap:wrap
}

.controls button{
width:43px;
height:43px;
border:1px solid var(--border);
border-radius:50%;
background:#1e293b;
color:white;
font-size:17px;
transition:.2s
}

.controls button:active{
transform:scale(.92)
}

.controls button:hover{
background:#334155
}

.play{
width:62px!important;
height:62px!important;
background:var(--green)!important;
color:#001b08!important;
font-size:22px!important
}


/* LYRICS BUTTON */

.lyrics-btn{
width:100%;
height:48px;
border:1px solid rgba(56,189,248,.25);
border-radius:15px;
background:
linear-gradient(
135deg,
rgba(56,189,248,.18),
rgba(56,189,248,.06)
);
color:#7dd3fc;
font-weight:800;
font-size:14px;
transition:.2s
}

.lyrics-btn:hover{
background:rgba(56,189,248,.25)
}

.lyrics-btn:disabled{
opacity:.35;
cursor:not-allowed
}


/* VOLUME */

.volume-box{
margin-top:15px;
padding:13px 15px;
border-radius:15px;
background:rgba(255,255,255,.035);
border:1px solid var(--border)
}

.volume-label{
font-size:11px;
color:var(--muted);
margin-bottom:7px
}

#vol{
width:100%;
accent-color:var(--accent)
}


/* CATEGORY */

#cat{
width:100%;
margin-top:15px;
padding:13px;
border-radius:14px;
border:1px solid var(--border);
background:#0b1424;
color:white;
outline:none
}


/* PLAYLIST */

.playlist{
margin-top:15px;
background:rgba(2,6,23,.7);
border:1px solid var(--border);
border-radius:18px;
padding:8px
}

.song{
display:flex;
gap:12px;
align-items:center;
padding:10px;
border-radius:13px;
cursor:pointer;
transition:.2s
}

.song:hover{
background:#1e293b
}

.song.active{
background:
linear-gradient(
90deg,
rgba(56,189,248,.14),
rgba(56,189,248,.04)
);
border-left:3px solid var(--accent)
}

.song img{
width:48px;
height:48px;
border-radius:50%;
object-fit:cover
}

.song-info{
min-width:0
}

.song-info b{
font-size:13px
}

.song-info small{
color:var(--muted);
font-size:11px
}


/* =========================
   VIDEO POPUP
========================= */

.video-modal{
position:fixed;
inset:0;
z-index:9999;
display:none;
align-items:center;
justify-content:center;
padding:18px;
background:rgba(0,0,0,.88);
backdrop-filter:blur(12px)
}

.video-modal.active{
display:flex
}

.video-panel{
width:min(900px,100%);
max-height:92vh;
background:
linear-gradient(
145deg,
#111827,
#020617
);
border:1px solid rgba(255,255,255,.12);
border-radius:24px;
overflow:hidden;
box-shadow:0 30px 100px rgba(0,0,0,.7);
animation:modalIn .22s ease
}

@keyframes modalIn{
from{
opacity:0;
transform:scale(.94)
}
to{
opacity:1;
transform:scale(1)
}
}

.video-header{
padding:14px 16px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
border-bottom:1px solid var(--border)
}

.video-title{
min-width:0
}

.video-title b{
display:block;
font-size:14px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.video-title span{
display:block;
font-size:11px;
color:var(--muted);
margin-top:3px
}

.video-actions{
display:flex;
gap:7px;
flex-shrink:0
}

.video-actions button{
width:38px;
height:38px;
border:0;
border-radius:50%;
background:rgba(255,255,255,.08);
color:white;
font-size:17px
}

.video-actions button:hover{
background:rgba(255,255,255,.15)
}

.video-wrap{
background:#000;
aspect-ratio:16/9;
display:flex;
align-items:center;
justify-content:center
}

#lyricsVideo{
width:100%;
height:100%;
display:block;
background:#000
}

.video-footer{
padding:11px 15px;
font-size:10px;
color:#64748b;
text-align:center
}


/* MOBILE */

@media(max-width:500px){

header{
align-items:flex-start
}

.logo{
font-size:17px
}

.clock{
display:none
}

.card{
padding:17px
}

.vinyl{
width:190px;
height:190px
}

.vinyl img{
width:78px;
height:78px
}

#title{
font-size:21px
}

.video-modal{
padding:8px
}

.video-panel{
border-radius:18px
}

}


/* DESKTOP */

@media(min-width:800px){

.box{
padding-bottom:50px
}

}

</style>
</head>


<body>


<header>

<div class="logo">
🎵 Sedatur Music Hub
</div>

<div>

<a
class="home"
href="https://sites.google.com/view/sedatur-rawamangun/home"
target="_blank">

🏠 Home

</a>

<div class="clock">

<div id="time">
00:00:00
</div>

<div id="date">
-
</div>

</div>

</div>

</header>


<div class="marquee">

<span id="run">
🎵 Selamat datang di Sedatur Music Hub 🎧
</span>

</div>


<main class="box">

<div class="card">


<div
class="vinyl"
id="vinyl">

id="cover"

Sedatur Music Hub

</div>

min="0"
max="100"

</span>

⛶

🎵 Sedatur Music Hub • Video lirik

<audio id="audio"></audio>


<script>

/* =====================================================
   ELEMENT
===================================================== */

const audio = document.getElementById("audio");

const vinyl = document.getElementById("vinyl");
const cover = document.getElementById("cover");

const title = document.getElementById("title");
const artist = document.getElementById("artist");
const status = document.getElementById("status");

const play = document.getElementById("play");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

const shuffle = document.getElementById("shuffle");
const repeat = document.getElementById("repeat");

const seek = document.getElementById("seek");
const vol = document.getElementById("vol");

const cur = document.getElementById("cur");
const dur = document.getElementById("dur");

const list = document.getElementById("list");
const cat = document.getElementById("cat");

const run = document.getElementById("run");

const lyricsBtn = document.getElementById("lyricsBtn");

const videoModal = document.getElementById("videoModal");
const lyricsVideo = document.getElementById("lyricsVideo");

const videoTitle = document.getElementById("videoTitle");
const videoArtist = document.getElementById("videoArtist");

const closeVideo = document.getElementById("closeVideo");
const fullscreenBtn = document.getElementById("fullscreenBtn");


/* =====================================================
   GLOBAL
===================================================== */

let songs = [];

let index = 0;

let shuf = false;

let rep = false;

let isLoading = false;


/* =====================================================
   CLOCK
===================================================== */

function updateClock(){

    const now = new Date();

    const time = document.getElementById("time");
    const date = document.getElementById("date");

    if(!time || !date) return;

    time.textContent =
        now.toLocaleTimeString(
            "id-ID",
            {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            }
        );

    date.textContent =
        now.toLocaleDateString(
            "id-ID",
            {
                weekday:"long",
                day:"numeric",
                month:"long",
                year:"numeric"
            }
        );

}

updateClock();

setInterval(updateClock,1000);


/* =====================================================
   FORMAT WAKTU
===================================================== */

function formatTime(seconds){

    if(!isFinite(seconds) || seconds < 0){
        return "00:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60);

    return (
        String(minutes).padStart(2,"0")
        +
        ":"
        +
        String(secs).padStart(2,"0")
    );

}


/* =====================================================
   LOAD PLAYLIST
===================================================== */

async function loadPlaylist(){

    try{

        const response =
            await fetch(
                "playlist.json?cache="+Date.now()
            );

        if(!response.ok){

            throw new Error(
                "playlist.json gagal dimuat"
            );

        }

        const data =
            await response.json();

        if(!Array.isArray(data)){

            throw new Error(
                "Format playlist.json tidak valid"
            );

        }

        songs = data;

        if(!songs.length){

            status.textContent =
                "⚠️ Playlist kosong";

            return;

        }

        buatKategori();

        tampilPlaylist();

        restore();

    }catch(error){

        console.error(
            "Playlist Error:",
            error
        );

        list.innerHTML = `

        <div style="
            padding:20px;
            text-align:center;
            color:#94a3b8;
            font-size:13px;
        ">

            ⚠️ Playlist gagal dimuat

        </div>

        `;

    }

}

loadPlaylist();


/* =====================================================
   CATEGORY
===================================================== */

function buatKategori(){

    const categories =
        [
            ...new Set(
                songs
                .map(song => song.category)
                .filter(Boolean)
            )
        ];

    categories.forEach(category => {

        const option =
            document.createElement("option");

        option.value = category;

        option.textContent =
            "🎤 " + category;

        cat.appendChild(option);

    });

}


/* =====================================================
   PLAYLIST
===================================================== */

function tampilPlaylist(){

    list.innerHTML = "";

    songs.forEach((song,i)=>{

        if(
            cat.value !== "all" &&
            song.category !== cat.value
        ){

            return;

        }

        const item =
            document.createElement("div");

        item.className = "song";

        if(i === index){

            item.classList.add("active");

        }

        item.innerHTML = `

            <img
                src="${song.cover || "logo.png"}"
                alt="Cover"
                onerror="this.src='logo.png'"
            >

            <div class="song-info">

                <b>
                    ${escapeHTML(song.title)}
                </b>

                <br>

                <small>
                    ${escapeHTML(song.artist)}
                </small>

            </div>

        `;

        item.onclick = () => {

            index = i;

            loadSong(true);

        };

        list.appendChild(item);

    });

}


/* =====================================================
   CATEGORY CHANGE
===================================================== */

cat.onchange = () => {

    tampilPlaylist();

};


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

    return String(text ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   LOAD SONG
===================================================== */

function loadSong(autoplay = false){

    if(!songs.length) return;

    const song = songs[index];

    if(!song) return;

    isLoading = true;

    audio.pause();

    audio.src = song.file;

    audio.load();

    cover.src =
        song.cover || "logo.png";

    cover.onerror = () => {

        cover.src = "logo.png";

    };

    title.textContent =
        song.title || "Unknown";

    artist.textContent =
        song.artist || "Unknown Artist";

    run.textContent =
        "🎵 " +
        song.title +
        " • " +
        song.artist +
        " • 🎧 Sedatur Music Hub";

    status.textContent =
        "⏸ Siap diputar";

    seek.value = 0;

    cur.textContent = "00:00";

    dur.textContent = "00:00";


    /* ================================
       LIRIK VIDEO
    ================================= */

    if(
        song.lyricsVideo &&
        String(song.lyricsVideo).trim() !== ""
    ){

        lyricsBtn.disabled = false;

        lyricsBtn.textContent =
            "🎬 Lirik Video";

    }else{

        lyricsBtn.disabled = true;

        lyricsBtn.textContent =
            "🎬 Lirik Video Tidak Tersedia";

    }


    localStorage.setItem(
        "sedatur_song",
        index
    );


    tampilPlaylist();

    updateMediaSession();


    if(autoplay){

        audio.play()
        .then(()=>{

            startPlaying();

        })
        .catch(error => {

            console.log(
                "Autoplay/play error:",
                error
            );

            status.textContent =
                "▶️ Tekan Play untuk memutar";

        });

    }


    setTimeout(()=>{

        isLoading = false;

    },300);

}


/* =====================================================
   PLAY
===================================================== */

function startPlaying(){

    audio.play()
    .then(()=>{

        play.textContent = "⏸";

        status.textContent =
            "🟢 Sedang Diputar";

        vinyl.classList.add("spin");

    })
    .catch(error => {

        console.log(
            "Play error:",
            error
        );

        status.textContent =
            "▶️ Tekan Play untuk memutar";

    });

}


function pausePlaying(){

    audio.pause();

    play.textContent = "▶";

    status.textContent =
        "⏸ Dijeda";

    vinyl.classList.remove("spin");

}


/* =====================================================
   PLAY BUTTON
===================================================== */

play.onclick = () => {

    if(!audio.src){

        loadSong(false);

    }

    if(audio.paused){

        startPlaying();

    }else{

        pausePlaying();

    }

};


/* =====================================================
   NEXT
===================================================== */

function nextSong(){

    if(!songs.length) return;


    if(shuf){

        if(songs.length === 1){

            index = 0;

        }else{

            let newIndex;

            do{

                newIndex =
                    Math.floor(
                        Math.random() *
                        songs.length
                    );

            }while(
                newIndex === index
            );

            index = newIndex;

        }

    }else{

        index++;

        if(index >= songs.length){

            index = 0;

        }

    }

    loadSong(true);

}

next.onclick = nextSong;


/* =====================================================
   PREVIOUS
===================================================== */

function previousSong(){

    if(!songs.length) return;

    index--;

    if(index < 0){

        index =
            songs.length - 1;

    }

    loadSong(true);

}

prev.onclick = previousSong;


/* =====================================================
   SHUFFLE
===================================================== */

shuffle.onclick = () => {

    shuf = !shuf;

    shuffle.style.background =
        shuf
        ? "#22c55e"
        : "#1e293b";

    localStorage.setItem(
        "sedatur_shuffle",
        shuf
    );

};


/* =====================================================
   REPEAT
===================================================== */

repeat.onclick = () => {

    rep = !rep;

    repeat.style.background =
        rep
        ? "#22c55e"
        : "#1e293b";

    localStorage.setItem(
        "sedatur_repeat",
        rep
    );

};


/* =====================================================
   AUDIO ENDED
===================================================== */

audio.addEventListener(
    "ended",
    () => {

        if(rep){

            audio.currentTime = 0;

            startPlaying();

        }else{

            nextSong();

        }

    }
);


/* =====================================================
   METADATA
===================================================== */

audio.addEventListener(
    "loadedmetadata",
    () => {

        if(isFinite(audio.duration)){

            seek.max =
                audio.duration;

            dur.textContent =
                formatTime(
                    audio.duration
                );

        }

    }
);


/* =====================================================
   AUDIO TIME UPDATE
===================================================== */

audio.addEventListener(
    "timeupdate",
    () => {

        if(
            isFinite(audio.duration)
        ){

            seek.max =
                audio.duration;

            seek.value =
                audio.currentTime;

        }

        cur.textContent =
            formatTime(
                audio.currentTime
            );

        localStorage.setItem(
            "sedatur_position",
            audio.currentTime
        );

        /*
         * Sinkronisasi video lirik
         * jika popup sedang terbuka.
         */

        syncLyricsVideo();

    }
);


/* =====================================================
   SEEK
===================================================== */

seek.addEventListener(
    "input",
    () => {

        if(!isFinite(audio.duration))
            return;

        audio.currentTime =
            Number(seek.value);

        syncLyricsVideo();

    }
);


/* =====================================================
   VOLUME
===================================================== */

const savedVolume =
    localStorage.getItem(
        "sedatur_volume"
    );

if(savedVolume !== null){

    vol.value =
        savedVolume;

}else{

    vol.value = 1;

}

audio.volume =
    Number(vol.value);


vol.addEventListener(
    "input",
    () => {

        audio.volume =
            Number(vol.value);

        localStorage.setItem(
            "sedatur_volume",
            vol.value
        );

    }
);


/* =====================================================
   LIRIK VIDEO BUTTON
===================================================== */

lyricsBtn.onclick = () => {

    const song = songs[index];

    if(
        !song ||
        !song.lyricsVideo
    ){

        return;

    }


    videoTitle.textContent =
        song.title;

    videoArtist.textContent =
        song.artist;


    /*
     * Stop video lama terlebih dahulu.
     */

    lyricsVideo.pause();

    lyricsVideo.removeAttribute("src");

    lyricsVideo.load();


    /*
     * Pasang video baru.
     */

    lyricsVideo.src =
        song.lyricsVideo;

    lyricsVideo.load();


    videoModal.classList.add(
        "active"
    );

    document.body.style.overflow =
        "hidden";


    /*
     * Posisi video mengikuti
     * posisi MP3 saat popup dibuka.
     */

    lyricsVideo.addEventListener(
        "loadedmetadata",
        function setInitialPosition(){

            lyricsVideo.removeEventListener(
                "loadedmetadata",
                setInitialPosition
            );

            syncLyricsVideo();

            /*
             * Kalau MP3 sedang diputar,
             * video ikut play.
             */

            if(!audio.paused){

                lyricsVideo.play()
                .catch(()=>{});

            }

        }
    );

};


/* =====================================================
   SINKRON VIDEO ↔ MP3
===================================================== */

function syncLyricsVideo(){

    if(
        !videoModal.classList.contains(
            "active"
        )
    ){

        return;

    }


    if(
        !lyricsVideo.readyState ||
        !isFinite(lyricsVideo.duration)
    ){

        return;

    }


    const audioTime =
        audio.currentTime;

    const videoTime =
        lyricsVideo.currentTime;


    /*
     * Kalau selisih lebih dari 0.35 detik,
     * posisi video diperbaiki.
     */

    if(
        Math.abs(
            videoTime - audioTime
        ) > 0.35
    ){

        try{

            lyricsVideo.currentTime =
                Math.min(
                    audioTime,
                    lyricsVideo.duration
                );

        }catch(e){

            console.log(
                "Video sync error:",
                e
            );

        }

    }

}


/* =====================================================
   VIDEO PLAY / PAUSE MENGIKUTI AUDIO
===================================================== */

audio.addEventListener(
    "play",
    () => {

        if(
            videoModal.classList.contains(
                "active"
            )
        ){

            syncLyricsVideo();

            lyricsVideo.play()
            .catch(()=>{});

        }

    }
);


audio.addEventListener(
    "pause",
    () => {

        if(
            videoModal.classList.contains(
                "active"
            )
        ){

            lyricsVideo.pause();

        }

    }
);


/* =====================================================
   CLOSE VIDEO
===================================================== */

function closeLyricsVideo(){

    lyricsVideo.pause();

    videoModal.classList.remove(
        "active"
    );

    document.body.style.overflow =
        "";

}


closeVideo.onclick =
    closeLyricsVideo;


/* =====================================================
   CLICK BACKDROP
===================================================== */

videoModal.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            videoModal
        ){

            closeLyricsVideo();

        }

    }
);


/* =====================================================
   ESCAPE
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape" &&
            videoModal.classList.contains(
                "active"
            )
        ){

            closeLyricsVideo();

        }

    }
);


/* =====================================================
   FULLSCREEN
===================================================== */

fullscreenBtn.onclick = async () => {

    try{

        if(
            !document.fullscreenElement
        ){

            await lyricsVideo.requestFullscreen();

        }else{

            await document.exitFullscreen();

        }

    }catch(error){

        console.log(
            "Fullscreen error:",
            error
        );

    }

};


/* =====================================================
   VIDEO ERROR
===================================================== */

lyricsVideo.addEventListener(
    "error",
    () => {

        status.textContent =
            "⚠️ Video lirik gagal dimuat";

    }
);


/* =====================================================
   RESTORE
===================================================== */

function restore(){

    const savedSong =
        localStorage.getItem(
            "sedatur_song"
        );

    const savedShuffle =
        localStorage.getItem(
            "sedatur_shuffle"
        );

    const savedRepeat =
        localStorage.getItem(
            "sedatur_repeat"
        );


    if(savedSong !== null){

        const savedIndex =
            Number(savedSong);

        if(
            savedIndex >= 0 &&
            savedIndex < songs.length
        ){

            index =
                savedIndex;

        }

    }


    shuf =
        savedShuffle === "true";

    rep =
        savedRepeat === "true";


    shuffle.style.background =
        shuf
        ? "#22c55e"
        : "#1e293b";

    repeat.style.background =
        rep
        ? "#22c55e"
        : "#1e293b";


    loadSong(false);


    /*
     * Posisi terakhir hanya disiapkan.
     * Browser tidak otomatis memutar audio.
     */

    const savedPosition =
        localStorage.getItem(
            "sedatur_position"
        );

    if(savedPosition !== null){

        audio.addEventListener(
            "loadedmetadata",
            function restorePosition(){

                audio.removeEventListener(
                    "loadedmetadata",
                    restorePosition
                );

                const position =
                    Number(savedPosition);

                if(
                    isFinite(position) &&
                    position < audio.duration
                ){

                    audio.currentTime =
                        position;

                }

            }
        );

    }

}


/* =====================================================
   MEDIA SESSION ANDROID
===================================================== */

function updateMediaSession(){

    if(
        !("mediaSession" in navigator)
    ){

        return;

    }


    const song =
        songs[index];

    if(!song) return;


    try{

        navigator.mediaSession.metadata =
            new MediaMetadata({

                title:
                    song.title || "Sedatur Music Hub",

                artist:
                    song.artist || "Sedatur",

                album:
                    "Sedatur Music Hub",

                artwork:[
                    {
                        src:
                            song.cover ||
                            "logo.png",

                        sizes:
                            "512x512",

                        type:
                            "image/png"
                    }
                ]

            });


        navigator.mediaSession.setActionHandler(
            "play",
            () => startPlaying()
        );


        navigator.mediaSession.setActionHandler(
            "pause",
            () => pausePlaying()
        );


        navigator.mediaSession.setActionHandler(
            "nexttrack",
            () => nextSong()
        );


        navigator.mediaSession.setActionHandler(
            "previoustrack",
            () => previousSong()
        );


        navigator.mediaSession.setActionHandler(
            "seekbackward",
            () => {

                audio.currentTime =
                    Math.max(
                        0,
                        audio.currentTime - 10
                    );

            }
        );


        navigator.mediaSession.setActionHandler(
            "seekforward",
            () => {

                audio.currentTime =
                    Math.min(
                        audio.duration,
                        audio.currentTime + 10
                    );

            }
        );


    }catch(error){

        console.log(
            "Media Session:",
            error
        );

    }

}


/* =====================================================
   UPDATE MEDIA SESSION WHEN PLAYING
===================================================== */

audio.addEventListener(
    "play",
    () => {

        if(
            "mediaSession" in navigator
        ){

            try{

                navigator.mediaSession.playbackState =
                    "playing";

            }catch(e){}

        }

    }
);


audio.addEventListener(
    "pause",
    () => {

        if(
            "mediaSession" in navigator
        ){

            try{

                navigator.mediaSession.playbackState =
                    "paused";

            }catch(e){}

        }

    }
);


/* =====================================================
   KEYBOARD CONTROL
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        /*
         * Jangan ganggu input/select.
         */

        if(
            event.target.tagName === "INPUT" ||
            event.target.tagName === "SELECT"
        ){

            return;

        }


        if(event.code === "Space"){

            event.preventDefault();

            if(audio.paused){

                startPlaying();

            }else{

                pausePlaying();

            }

        }


        if(event.code === "ArrowRight"){

            audio.currentTime =
                Math.min(
                    audio.duration || 0,
                    audio.currentTime + 5
                );

        }


        if(event.code === "ArrowLeft"){

            audio.currentTime =
                Math.max(
                    0,
                    audio.currentTime - 5
                );

        }

    }
);
