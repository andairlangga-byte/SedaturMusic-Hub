<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>🎵 Sedatur Music Hub</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,Helvetica,sans-serif
}

:root{
--bg:#030712;
--panel:#0f172a;
--border:rgba(255,255,255,.09);
--text:#f8fafc;
--muted:#94a3b8;
--accent:#38bdf8;
--green:#22c55e;
--red:#fb7185
}

body{
min-height:100vh;
color:var(--text);

background:
radial-gradient(
circle at 15% 0%,
rgba(56,189,248,.13),
transparent 30%
),
radial-gradient(
circle at 90% 20%,
rgba(34,197,94,.08),
transparent 28%
),
var(--bg)
}

button,
input,
select{
font:inherit
}

button{
cursor:pointer
}


/* HEADER */

header{
position:sticky;
top:0;
z-index:100;

padding:14px 15px;

background:
rgba(3,7,18,.84);

backdrop-filter:blur(18px);

border-bottom:
1px solid var(--border);

display:flex;
justify-content:space-between;
align-items:center;
gap:12px
}

.logo{
font-size:19px;
font-weight:900
}

.home{
display:inline-block;

padding:8px 12px;

border-radius:11px;

background:
rgba(56,189,248,.13);

border:
1px solid rgba(56,189,248,.24);

color:#7dd3fc;

text-decoration:none;

font-size:12px;
font-weight:800
}

.clock{
text-align:right;
margin-top:5px
}

#time{
font-size:16px;
font-weight:900
}

#date{
font-size:9px;
color:var(--muted)
}


/* MARQUEE */

.marquee{
width:min(650px,calc(100% - 30px));

margin:14px auto;

padding:10px;

border-radius:13px;

background:
rgba(255,255,255,.035);

border:
1px solid var(--border);

overflow:hidden;

white-space:nowrap
}

.marquee span{
display:inline-block;

color:#cbd5e1;

font-size:11px;

animation:
marquee 17s linear infinite
}

@keyframes marquee{

from{
transform:translateX(100%)
}

to{
transform:translateX(-100%)
}

}


/* MAIN */

.box{
width:min(650px,100%);

margin:auto;

padding:
0 15px 40px
}

.card{
padding:20px;

border-radius:27px;

background:
linear-gradient(
145deg,
rgba(17,28,48,.96),
rgba(8,15,29,.96)
);

border:
1px solid var(--border);

box-shadow:
0 25px 80px rgba(0,0,0,.35)
}


/* VISUAL */

.visual-stage{

width:220px;
height:220px;

margin:5px auto 0;

border-radius:24px;

overflow:hidden;

display:flex;

align-items:center;
justify-content:center;

background:#000;

box-shadow:
0 20px 55px rgba(0,0,0,.55)
}


/* VINYL */

.vinyl{

width:220px;
height:220px;

border-radius:50%;

display:flex;

align-items:center;
justify-content:center;

background:
radial-gradient(
circle,
#222 0 10%,
#111 11% 20%,
#333 21% 22%,
#080808 23% 100%
);

flex-shrink:0
}

.vinyl img{

width:90px;
height:90px;

border-radius:50%;

object-fit:cover;

border:4px solid #111
}

.spin{

animation:
spin 8s linear infinite
}

@keyframes spin{

to{
transform:rotate(360deg)
}

}


/* VIDEO */

#lyricsVideo{

display:none;

width:100%;
height:100%;

object-fit:contain;

background:#000;

border:0;
outline:0
}

.visual-stage.video-active .vinyl{
display:none
}

.visual-stage.video-active #lyricsVideo{
display:block
}


/* SONG INFO */

#title{

margin-top:21px;

font-size:23px;

line-height:1.2
}

.artist{

margin-top:6px;

font-size:13px;

color:var(--muted)
}

#status{

margin-top:9px;

font-size:11px;

color:#cbd5e1
}


/* SEEK */

.seek-area{
margin-top:20px
}

#seek{

width:100%;

accent-color:
var(--accent)
}

.time-row{

display:flex;

justify-content:space-between;

margin-top:5px;

font-size:10px;

color:var(--muted)
}


/* CONTROLS */

.controls{

display:flex;

align-items:center;

justify-content:center;

gap:8px;

margin:
18px 0 14px;

flex-wrap:wrap
}

.controls button{

width:42px;
height:42px;

border-radius:50%;

border:
1px solid var(--border);

background:#1e293b;

color:white;

font-size:16px;

transition:.18s
}

.controls button:active{
transform:scale(.91)
}

.controls button.active{

background:
var(--green);

color:#001b08
}

.play{

width:60px!important;
height:60px!important;

background:
var(--green)!important;

color:#001b08!important;

font-size:21px!important
}


/* VIDEO BUTTON */

.lyrics-btn{

width:100%;
height:46px;

border-radius:14px;

border:
1px solid rgba(56,189,248,.25);

background:
rgba(56,189,248,.10);

color:#7dd3fc;

font-size:13px;

font-weight:800
}

.lyrics-btn:disabled{

opacity:.35;

cursor:not-allowed
}


/* VOLUME */

.volume-box{

margin-top:13px;

padding:12px 14px;

border-radius:14px;

background:
rgba(255,255,255,.035);

border:
1px solid var(--border)
}

.volume-label{

font-size:10px;

color:var(--muted);

margin-bottom:6px
}

#vol{

width:100%;

accent-color:
var(--accent)
}


/* SEARCH */

.search{

width:100%;

margin-top:14px;

padding:12px 14px;

border-radius:13px;

border:
1px solid var(--border);

background:#0b1424;

color:white;

outline:none;

font-size:12px
}

.search::placeholder{
color:#64748b
}


/* CATEGORY */

#cat{

width:100%;

margin-top:9px;

padding:12px;

border-radius:13px;

border:
1px solid var(--border);

background:#0b1424;

color:white;

outline:none;

font-size:12px
}


/* PLAYLIST */

.playlist{

margin-top:13px;

padding:7px;

border-radius:17px;

background:
rgba(2,6,23,.7);

border:
1px solid var(--border)
}

.song{

display:flex;

align-items:center;

gap:11px;

padding:9px;

border-radius:12px;

cursor:pointer;

transition:.18s
}

.song:hover{
background:#1e293b
}

.song.active{

background:
rgba(56,189,248,.10);

border-left:
3px solid var(--accent)
}

.song img{

width:47px;
height:47px;

border-radius:50%;

object-fit:cover
}

.song-info{

min-width:0;

flex:1
}

.song-info b{

font-size:12px;

display:block;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis
}

.song-info small{

font-size:10px;

color:var(--muted)
}


/* FAVORITE */

.fav-btn{

width:34px;
height:34px;

border:0;

border-radius:50%;

background:transparent;

color:#64748b;

font-size:20px;

flex-shrink:0
}

.fav-btn.active{
color:var(--red)
}


/* STATISTICS */

.stats{

margin-top:14px;

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:8px
}

.stat{

padding:12px;

border-radius:14px;

background:
rgba(255,255,255,.035);

border:
1px solid var(--border)
}

.stat small{

display:block;

font-size:9px;

color:var(--muted)
}

.stat b{

display:block;

margin-top:4px;

font-size:17px
}


/* MOBILE */

@media(max-width:500px){

header{
align-items:flex-start
}

.logo{
font-size:16px
}

.clock{
display:none
}

.card{
padding:16px
}

.visual-stage{

width:190px;
height:190px
}

.vinyl{

width:190px;
height:190px
}

.vinyl img{

width:78px;
height:78px
}

#title{
font-size:20px
}

}


/* DESKTOP */

@media(min-width:800px){

.box{
padding-bottom:55px
}

}

</style>

</head>


<body>

<div class="logo">
🎵 Sedatur Music Hub
</div>

<div>

<a
class="home"
href="https://sedatur.my.id/home"
target="_blank"
rel="noopener">

<div id="time">

</div>

🎵 Selamat datang di Sedatur Music Hub 🎧

<main class="box">

playsinline

<b id="statPlays">

</small>

<script>


/* =====================================================
   ELEMENT
===================================================== */

const audio =
document.getElementById("audio");

const vinyl =
document.getElementById("vinyl");

const cover =
document.getElementById("cover");

const title =
document.getElementById("title");

const artist =
document.getElementById("artist");

const status =
document.getElementById("status");

const play =
document.getElementById("play");

const prev =
document.getElementById("prev");

const next =
document.getElementById("next");

const shuffle =
document.getElementById("shuffle");

const repeat =
document.getElementById("repeat");

const seek =
document.getElementById("seek");

const vol =
document.getElementById("vol");

const cur =
document.getElementById("cur");

const dur =
document.getElementById("dur");

const list =
document.getElementById("list");

const cat =
document.getElementById("cat");

const search =
document.getElementById("search");

const run =
document.getElementById("run");

const lyricsBtn =
document.getElementById("lyricsBtn");

const lyricsVideo =
document.getElementById("lyricsVideo");

const visualStage =
document.getElementById("visualStage");


/* =====================================================
   GLOBAL
===================================================== */

let songs = [];

let index = 0;

let shuf = false;

let rep = false;

let videoReady = false;

let videoToken = 0;


/* =====================================================
   CLOCK
===================================================== */

function updateClock(){

const now =
new Date();

document.getElementById("time")
.textContent =
now.toLocaleTimeString(
"id-ID",
{
hour:"2-digit",
minute:"2-digit",
second:"2-digit"
}
);

document.getElementById("date")
.textContent =
now.toLocaleDateString(
"id-ID",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
);

}

updateClock();

setInterval(
updateClock,
1000
);


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(seconds){

if(
!isFinite(seconds) ||
seconds < 0
){

return "00:00";

}

const minutes =
Math.floor(
seconds / 60
);

const secondsPart =
Math.floor(
seconds % 60
);

return (

String(minutes)
.padStart(2,"0")

+

":"

+

String(secondsPart)
.padStart(2,"0")

);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

return String(text ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =====================================================
   PART 1 SELESAI
   
===================================================== */
 
/* =====================================================
   LOAD PLAYLIST
===================================================== */

async function loadPlaylist(){

    try{

        const response =
            await fetch(
                "playlist.json?cache=" +
                Date.now()
            );

        if(!response.ok){

            throw new Error(
                "playlist.json tidak ditemukan"
            );

        }

        const data =
            await response.json();

        if(!Array.isArray(data)){

            throw new Error(
                "Format playlist.json harus Array"
            );

        }

        songs = data;

        if(!songs.length){

            list.innerHTML = `

            <div style="
                padding:20px;
                text-align:center;
                color:#94a3b8;
                font-size:12px;
            ">

                ⚠️ Playlist kosong

            </div>

            `;

            return;

        }


        buatKategori();

        restoreSettings();

        tampilPlaylist();

        loadSong(false);

        updateStats();

    }catch(error){

        console.error(
            "Playlist Error:",
            error
        );

        list.innerHTML = `

        <div style="
            padding:20px;
            text-align:center;
            color:#94a3b8;
            font-size:12px;
        ">

            ⚠️ Gagal memuat playlist.json

            <br><br>

            Pastikan file
            <b>playlist.json</b>
            berada satu folder dengan
            <b>index.html</b>.

        </div>

        `;

    }

}


/* =====================================================
   CATEGORY
===================================================== */

function buatKategori(){

    /*
       Hapus kategori lama
       agar tidak dobel ketika
       fungsi dipanggil ulang.
    */

    cat.innerHTML = `

    <option value="all">
        🎤 Semua Artis
    </option>

    `;


    const categories = [
        ...new Set(

            songs

            .map(
                song =>
                song.category ||
                song.artist
            )

            .filter(Boolean)

        )
    ];


    categories.forEach(
        category => {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            category;

        option.textContent =
            "🎤 " + category;

        cat.appendChild(
            option
        );

    });

}


/* =====================================================
   FILTER PLAYLIST
===================================================== */

function getFilteredSongs(){

    const keyword =
        search.value
        .trim()
        .toLowerCase();


    return songs.filter(
        song => {

        const matchCategory =

            cat.value === "all" ||

            (
                song.category ||
                song.artist
            ) === cat.value;


        const matchSearch =

            !keyword ||

            String(
                song.title || ""
            )
            .toLowerCase()
            .includes(keyword)

            ||

            String(
                song.artist || ""
            )
            .toLowerCase()
            .includes(keyword);


        return (
            matchCategory &&
            matchSearch
        );

    });

}


/* =====================================================
   TAMPIL PLAYLIST
===================================================== */

function tampilPlaylist(){

    list.innerHTML = "";


    const filtered =
        getFilteredSongs();


    if(!filtered.length){

        list.innerHTML = `

        <div style="
            padding:20px;
            text-align:center;
            color:#94a3b8;
            font-size:12px;
        ">

            🔎 Lagu tidak ditemukan

        </div>

        `;

        return;

    }


    filtered.forEach(
        song => {

        const realIndex =
            songs.indexOf(song);


        const item =
            document.createElement(
                "div"
            );

        item.className =
            "song";


        if(
            realIndex === index
        ){

            item.classList.add(
                "active"
            );

        }


        const favorite =
            isFavorite(
                realIndex
            );


        item.innerHTML = `

        <img
            src="${
                song.cover ||
                "logo.png"
            }"
            alt="Cover"
            onerror="
                this.src='logo.png'
            "
        >


        <div class="song-info">

            <b>
                ${escapeHTML(
                    song.title ||
                    "Tanpa Judul"
                )}
            </b>

            <small>
                ${escapeHTML(
                    song.artist ||
                    "Unknown Artist"
                )}
            </small>

        </div>


        <button
            class="fav-btn ${
                favorite
                ? "active"
                : ""
            }"
            title="Favorit"
        >

            ${
                favorite
                ? "♥"
                : "♡"
            }

        </button>

        `;


        const favButton =
            item.querySelector(
                ".fav-btn"
            );


        favButton.onclick =
            event => {

            event.stopPropagation();

            toggleFavorite(
                realIndex
            );

            tampilPlaylist();

            updateStats();

        };


        item.onclick =
            () => {

            index =
                realIndex;

            loadSong(true);

        };


        list.appendChild(
            item
        );

    });

}


/* =====================================================
   SEARCH
===================================================== */

search.addEventListener(
"input",
()=>{

    tampilPlaylist();

});


/* =====================================================
   CATEGORY CHANGE
===================================================== */

cat.addEventListener(
"change",
()=>{

    tampilPlaylist();

});


/* =====================================================
   FAVORITE SYSTEM
===================================================== */

function getFavorites(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "sedatur_favorites"
            )
        ) || [];

    }catch{

        return [];

    }

}


function saveFavorites(
    favorites
){

    localStorage.setItem(
        "sedatur_favorites",
        JSON.stringify(
            favorites
        )
    );

}


function isFavorite(
    songIndex
){

    return getFavorites()
        .includes(songIndex);

}


function toggleFavorite(
    songIndex
){

    let favorites =
        getFavorites();


    if(
        favorites.includes(
            songIndex
        )
    ){

        favorites =
            favorites.filter(
                i =>
                i !== songIndex
            );

    }else{

        favorites.push(
            songIndex
        );

    }


    saveFavorites(
        favorites
    );

}


/* =====================================================
   LOAD SONG
===================================================== */

function loadSong(
    autoplay = false
){

    if(!songs.length){

        return;

    }


    const song =
        songs[index];


    if(!song){

        return;

    }


    /*
       VIDEO LAMA HARUS
       BERHENTI DULU
    */

    resetVideo();


    /*
       AUDIO JADI MASTER
    */

    audio.pause();

    audio.removeAttribute(
        "src"
    );

    audio.load();


    /*
       Gunakan URL relatif
       dari playlist.json
    */

    audio.src =
        song.file || "";


    audio.load();


    /*
       COVER
    */

    cover.src =
        song.cover ||
        "logo.png";


    cover.onerror =
        () => {

        cover.src =
            "logo.png";

    };


    /*
       INFORMASI
    */

    title.textContent =
        song.title ||
        "Tanpa Judul";


    artist.textContent =
        song.artist ||
        "Unknown Artist";


    run.textContent =

        "🎵 " +

        (
            song.title ||
            "Tanpa Judul"
        )

        +

        " • "

        +

        (
            song.artist ||
            "Unknown Artist"
        )

        +

        " • 🎧 Sedatur Music Hub";


    status.textContent =
        "⏸ Siap diputar";


    /*
       RESET SEEK
    */

    seek.value = 0;

    cur.textContent =
        "00:00";

    dur.textContent =
        "00:00";


    /*
       VIDEO BUTTON
    */

    updateVideoButton();


    /*
       SIMPAN LAGU TERAKHIR
    */

    localStorage.setItem(
        "sedatur_song",
        String(index)
    );


    /*
       UPDATE PLAYLIST
    */

    tampilPlaylist();


    /*
       AUTOPLAY
    */

    if(autoplay){

        startPlaying();

    }

}


/* =====================================================
   PLAY
===================================================== */

function startPlaying(){

    if(!audio.src){

        loadSong(false);

    }


    audio.play()

    .then(
        ()=>{

        play.textContent =
            "⏸";

        status.textContent =
            "🟢 Sedang Diputar";

        vinyl.classList.add(
            "spin"
        );


        /*
           Jika video sedang aktif,
           video ikut audio.
        */

        if(
            visualStage.classList.contains(
                "video-active"
            )
        ){

            startVideo();

        }

    })

    .catch(
        error => {

        console.log(
            "Play Error:",
            error
        );

        status.textContent =
            "▶️ Tekan Play untuk memutar";

    });

}


function pausePlaying(){

    audio.pause();

    play.textContent =
        "▶";

    status.textContent =
        "⏸ Dijeda";

    vinyl.classList.remove(
        "spin"
    );


    /*
       Video ikut pause
    */

    if(
        !lyricsVideo.paused
    ){

        lyricsVideo.pause();

    }

}


/* =====================================================
   PLAY BUTTON
===================================================== */

play.onclick =
()=>{

    if(audio.paused){

        startPlaying();

    }else{

        pausePlaying();

    }

};


/* =====================================================
   NEXT SONG
===================================================== */

function nextSong(){

    if(!songs.length){

        return;

    }


    if(shuf){

        if(songs.length <= 1){

            index = 0;

        }else{

            let newIndex;

            do{

                newIndex =
                    Math.floor(
                        Math.random() *
                        songs.length
                    );

            }while(
                newIndex === index
            );

            index =
                newIndex;

        }

    }else{

        index++;

        if(
            index >= songs.length
        ){

            index = 0;

        }

    }


    loadSong(true);

}


next.onclick =
nextSong;


/* =====================================================
   PREVIOUS SONG
===================================================== */

function previousSong(){

    if(!songs.length){

        return;

    }


    index--;


    if(index < 0){

        index =
            songs.length - 1;

    }


    loadSong(true);

}


prev.onclick =
previousSong;

shuffle.onclick =

/* =====================================================

        )
    ){

===================================================== */

seek.addEventListener(

()=>{

        isFinite(

        )
    ){

/* =====================================================
   RESTORE SETTINGS
===================================================== */

function restoreSettings(){

    const savedIndex =
        Number(
            localStorage.getItem(
                "sedatur_song"
            )
        );


    if(
        Number.isInteger(
            savedIndex
        ) &&
        savedIndex >= 0 &&
        savedIndex < songs.length
    ){

        index =
            savedIndex;

    }


    shuf =
        localStorage.getItem(
            "sedatur_shuffle"
        ) === "true";


    rep =
        localStorage.getItem(
            "sedatur_repeat"
        ) === "true";


    shuffle.classList.toggle(
        "active",
        shuf
    );


    repeat.classList.toggle(
        "active",
        rep
    );


    const savedVolume =
        Number(
            localStorage.getItem(
                "sedatur_volume"
            )
        );


    if(
        isFinite(savedVolume) &&
        savedVolume >= 0 &&
        savedVolume <= 1
    ){

        audio.volume =
            savedVolume;

        vol.value =
            savedVolume;

    }else{

        audio.volume =
            1;

    }

}

===================================================== */
 
/* =====================================================
   VIDEO SYSTEM
   AUDIO = MASTER CLOCK
===================================================== */


/* =====================================================
   RESET VIDEO
===================================================== */

function resetVideo(){

    videoToken++;

    videoReady = false;

    lyricsVideo.pause();

    lyricsVideo.removeAttribute(
        "src"
    );

    lyricsVideo.load();

    lyricsVideo.muted = true;

    visualStage.classList.remove(
        "video-active"
    );

    lyricsBtn.textContent =
        "🎬 Lirik Video";

}


/* =====================================================
   UPDATE VIDEO BUTTON
===================================================== */

function updateVideoButton(){

    const song =
        songs[index];


    if(
        !song ||
        !song.lyricsVideo ||
        !String(
            song.lyricsVideo
        ).trim()
    ){

        lyricsBtn.disabled =
            true;

        lyricsBtn.textContent =
            "🎬 Video Tidak Tersedia";

        return;

    }


    lyricsBtn.disabled =
        false;


    if(
        visualStage.classList.contains(
            "video-active"
        )
    ){

        lyricsBtn.textContent =
            "🎬 Sembunyikan Video";

    }else{

        lyricsBtn.textContent =
            "🎬 Lirik Video";

    }

}


/* =====================================================
   OPEN VIDEO
===================================================== */

function openVideo(){

    const song =
        songs[index];


    if(
        !song ||
        !song.lyricsVideo
    ){

        return;

    }


    /*
       TOKEN BARU
       Supaya video lama tidak
       bisa mengambil alih video baru.
    */

    const currentToken =
        ++videoToken;


    videoReady =
        false;


    /*
       Hentikan video sebelumnya
    */

    lyricsVideo.pause();


    lyricsVideo.removeAttribute(
        "src"
    );


    lyricsVideo.load();


    /*
       VIDEO WAJIB MUTE
    */

    lyricsVideo.muted =
        true;

    lyricsVideo.volume =
        0;


    /*
       Masukkan video lagu baru
    */

    lyricsVideo.src =
        song.lyricsVideo;


    lyricsVideo.load();


    visualStage.classList.add(
        "video-active"
    );


    lyricsBtn.textContent =
        "🎬 Memuat Video...";


    /*
       Saat metadata siap
    */

    lyricsVideo.onloadedmetadata =
        async () => {

        /*
           Kalau token sudah berubah,
           berarti lagu sudah berganti.
        */

        if(
            currentToken !==
            videoToken
        ){

            return;

        }


        videoReady =
            true;


        /*
           AUDIO ADALAH MASTER
        */

        syncVideo(true);


        /*
           Jika audio sedang berjalan,
           video ikut berjalan.
        */

        if(
            !audio.paused
        ){

            try{

                await lyricsVideo.play();

            }catch(error){

                console.log(
                    "Video autoplay diblokir:",
                    error
                );

            }

        }


        lyricsBtn.textContent =
            "🎬 Sembunyikan Video";

    };


    /*
       Kalau video error
    */

    lyricsVideo.onerror =
        () => {

        if(
            currentToken !==
            videoToken
        ){

            return;

        }


        videoReady =
            false;


        lyricsBtn.textContent =
            "⚠️ Video Gagal Dimuat";


        console.log(
            "Video gagal:",
            song.lyricsVideo
        );

    };

}


/* =====================================================
   VIDEO BUTTON
===================================================== */

lyricsBtn.onclick =
()=>{

    if(
        visualStage.classList.contains(
            "video-active"
        )
    ){

        resetVideo();

        updateVideoButton();

        return;

    }


    openVideo();

};


/* =====================================================
   SYNC VIDEO
===================================================== */

function syncVideo(
    force = false
){

    if(
        !videoReady
    ){

        return;

    }


    if(
        !isFinite(
            audio.currentTime
        )
    ){

        return;

    }


    if(
        !isFinite(
            lyricsVideo.duration
        )
    ){

        return;

    }


    const target =
        audio.currentTime;


    const difference =
        Math.abs(
            lyricsVideo.currentTime -
            target
        );


    /*
       Kalau beda lebih dari 0.08 detik,
       langsung koreksi.

       Ini membuat audio tetap
       menjadi sumber waktu utama.
    */

    if(
        force ||
        difference > 0.08
    ){

        try{

            lyricsVideo.currentTime =
                Math.min(
                    target,
                    lyricsVideo.duration
                );

        }catch(error){

            console.log(
                "Sync video error:",
                error
            );

        }

    }


    /*
       VIDEO SELALU MUTE
    */

    lyricsVideo.muted =
        true;

    lyricsVideo.volume =
        0;

}


/* =====================================================
   VIDEO PLAY / PAUSE MENGIKUTI AUDIO
===================================================== */

audio.addEventListener(
"play",
()=>{

    if(
        videoReady &&
        visualStage.classList.contains(
            "video-active"
        )
    ){

        syncVideo(true);


        lyricsVideo.play()
        .catch(
            error => {

            console.log(
                "Video play diblokir:",
                error
            );

        });

    }

});


audio.addEventListener(
"pause",
()=>{

    if(
        videoReady
    ){

        lyricsVideo.pause();

    }

});


/* =====================================================
   VIDEO JANGAN PERNAH MENGELUARKAN SUARA
===================================================== */

lyricsVideo.addEventListener(
"volumechange",
()=>{

    if(
        lyricsVideo.volume !== 0 ||
        !lyricsVideo.muted
    ){

        lyricsVideo.muted =
            true;

        lyricsVideo.volume =
            0;

    }

});


/* =====================================================
   VIDEO SEEK
===================================================== */

lyricsVideo.addEventListener(
"seeking",
()=>{

    /*
       Jangan biarkan video
       menjadi master clock.

       Setelah seek selesai,
       kembali ke posisi audio.
    */

    setTimeout(
        ()=>{

        syncVideo(true);

        },
        20
    );

});


/* =====================================================
   VIDEO TIME UPDATE
===================================================== */

lyricsVideo.addEventListener(
"timeupdate",
()=>{

    if(
        !videoReady
    ){

        return;

    }


    const difference =
        Math.abs(
            lyricsVideo.currentTime -
            audio.currentTime
        );


    if(
        difference > 0.12
    ){

        syncVideo(true);

    }

});


/* =====================================================
   VIDEO ENDED
===================================================== */

lyricsVideo.addEventListener(
"ended",
()=>{

    /*
       Jangan pindah lagu.

       Audio tetap berjalan.
       Video akan dikembalikan
       ke posisi audio.
    */

    if(
        !audio.paused
    ){

        syncVideo(true);


        lyricsVideo.play()
        .catch(
            ()=>{}
        );

    }

});


/* =====================================================
   AUTO SYNC LOOP
===================================================== */

setInterval(
()=>{

    if(
        videoReady &&
        visualStage.classList.contains(
            "video-active"
        )
    ){

        syncVideo();

    }

},
100
);


/* =====================================================
   STATISTICS
===================================================== */

function getNumber(
    key
){

    const value =
        Number(
            localStorage.getItem(
                key
            )
        );


    return isFinite(value)
        ? value
        : 0;

}


function setNumber(
    key,
    value
){

    localStorage.setItem(
        key,
        String(value)
    );

}


/* =====================================================
   PLAY COUNT
===================================================== */

audio.addEventListener(
"play",
()=>{

    /*
       Hanya dihitung ketika
       audio mulai dari posisi awal
       atau pergantian lagu.
    */

    const lastPlayed =
        localStorage.getItem(
            "sedatur_last_played"
        );


    const currentKey =
        String(index);


    if(
        lastPlayed !==
        currentKey
    ){

        const total =
            getNumber(
                "sedatur_plays"
            );


        setNumber(
            "sedatur_plays",
            total + 1
        );


        localStorage.setItem(
            "sedatur_last_played",
            currentKey
        );

    }


    updateStats();

});


/* =====================================================
   TOTAL WAKTU DENGAR
===================================================== */

let lastStatTime =
Date.now();


setInterval(
()=>{

    if(
        !audio.paused
    ){

        const now =
            Date.now();


        const elapsed =
            now -
            lastStatTime;


        /*
           Hindari angka aneh
           jika browser sleep.
        */

        if(
            elapsed > 0 &&
            elapsed < 10000
        ){

            const seconds =
                elapsed / 1000;


            const total =
                getNumber(
                    "sedatur_listen_time"
                );


            setNumber(
                "sedatur_listen_time",
                total + seconds
            );

        }


        lastStatTime =
            now;

    }else{

        lastStatTime =
            Date.now();

    }


    updateStats();

},
1000
);


/* =====================================================
   UPDATE STATISTICS UI
===================================================== */

function updateStats(){

    const statSongs =
        document.getElementById(
            "statSongs"
        );


    const statPlays =
        document.getElementById(
            "statPlays"
        );


    const statFav =
        document.getElementById(
            "statFav"
        );


    const statTime =
        document.getElementById(
            "statTime"
        );


    if(statSongs){

        statSongs.textContent =
            songs.length;

    }


    if(statPlays){

        statPlays.textContent =
            getNumber(
                "sedatur_plays"
            );

    }


    if(statFav){

        statFav.textContent =
            getFavorites().length;

    }


    if(statTime){

        const seconds =
            getNumber(
                "sedatur_listen_time"
            );


        const minutes =
            Math.floor(
                seconds / 60
            );


        if(
            minutes < 60
        ){

            statTime.textContent =
                minutes + "m";

        }else{

            const hours =
                Math.floor(
                    minutes / 60
                );


            const remaining =
                minutes % 60;


            statTime.textContent =
                hours +
                "j " +
                remaining +
                "m";

        }

    }

}


/* =====================================================
   PAGE VISIBILITY
===================================================== */

document.addEventListener(
"visibilitychange",
()=>{

    /*
       Ketika kembali ke halaman,
       sinkronkan video dengan audio.
    */

    if(
        !document.hidden &&
        videoReady &&
        !audio.paused
    ){

        syncVideo(true);

    }

});


/* =====================================================
   KEYBOARD SHORTCUT
===================================================== */

document.addEventListener(
"keydown",
event => {

    /*
       Jangan mengganggu search.
    */

    if(
        event.target.tagName ===
        "INPUT" ||

        event.target.tagName ===
        "SELECT"
    ){

        return;

    }


    /*
       SPACE
    */

    if(
        event.code ===
        "Space"
    ){

        event.preventDefault();


        if(audio.paused){

            startPlaying();

        }else{

            pausePlaying();

        }

    }


    /*
       ARROW RIGHT
       +5 DETIK
    */

    if(
        event.code ===
        "ArrowRight"
    ){

        if(
            isFinite(
                audio.duration
            )
        ){

            audio.currentTime =
                Math.min(
                    audio.currentTime + 5,
                    audio.duration
                );


            syncVideo(true);

        }

    }


    /*
       ARROW LEFT
       -5 DETIK
    */

    if(
        event.code ===
        "ArrowLeft"
    ){

        audio.currentTime =
            Math.max(
                audio.currentTime - 5,
                0
            );


        syncVideo(true);

    }

});

    ){

    if(
        lyricsVideo.requestFullscreen

    }

});
